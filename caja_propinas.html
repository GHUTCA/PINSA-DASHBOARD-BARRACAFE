<!doctype html>
<html lang="es-CL">
<!-- DEVICE-CLASS: 1 · cattura in movimento · mobile-only · UI es-CL registro tú
     🖐 QUARTA PENNA · 02-ott-2026 · ATTO III — LE PROPINAS, dal telefono della cajera
     Fonte dei vetri: 4_CANTIERE_CAJA/MOCKUP_CAJA_TRE_ATTI_01OTT2026.html (⑩ nelle due
     forme · ⑪ · ⑫) di 🎨 DESIGN · mockup madre MOCKUP_GIRO_EFECTIVO_14SET2026.html.
     Regole: 4_CANTIERE_CAJA/REGLAS_PROPINAS_01OTT2026.html — le SEDICI, tutte di Alberto.
     Cargo: CAJA. Leva server: CAJA_ATTO3_ON (una per penna/atto, come CAJA_ATTO1_ON di
     🎛 BKP), nasce "0". Il calcolo vive al bordo in `src/caja_atto3.js` — qui non si
     calcola NIENTE: si mostra e si consegna. Non deploya questa penna: il cancello è di BKP.

     🔴 COSA NASCE SPENTO, E PERCHÉ — Alberto, ven 02-ott sera (bacheca
        `CAJA CHICA DUE E PRIMO PAGO STORICO`):
        · le spese fisse NON escono dalla propina (seconda caja chica) ⇒ dal pozo non si
          sottrae niente oltre il 5%;
        · il 70% lo calcola e lo paga il sistema;
        · il 30% il sistema lo CALCOLA e lo MOSTRA, e lo divide Alberto A MANO.
        ⇒ ⑫ e la divisione per punti sono dietro `reparto_30_por_puntos` del SERVER, non
          dietro una costante di questo file. 🔑 Così il giorno che la regola del 30%
          esiste si accende UNA leva, non una leva più un deploy del vetro.
        · il pago di lun 5 è a mano, su carta: il sistema paga la prima volta mar 6.

     🔴 CONTRATTO DI LETTURA — il bordo ha già le funzioni pure (`caja_atto3.js`);
        qui resta la cucitura Worker (import + leva + rotta), di 🎛 BKP:
          GET  /caja/:local/reparto?t=&dia=YYYY-MM-DD&turno=AM|PM
               → { gate:bool, reparto:{turno,modo,regola_id,pozo_efectivo,
                   pozo_no_efectivo,quota_meseros_pct,desc_no_efectivo_pct}|null,
                   detalle:{...}|null, falta:{alias:[]|cobraron_y_no_estan:[]|
                   dos_grupos_mismo_turno:[]|modo:string}|null,
                   personas:[{persona_id,nombre,grupo,puntos,alias_app_caja:bool}],
                   pagados:[{persona_id,concepto,monto,ts,firmado}] }
          POST /caja/:local  { verbo:'reparto_cerrar', uid_gesto, dia_operativo, turno,
                               partes:[{persona_id,grupo,puntos}] }
          POST /caja/:local  { verbo:'propina_pago', uid_gesto, reparto_uid, persona_id,
                               grupo, concepto, monto, tranche, quien }
        A leva spenta i POST tornano { ok:true, scritto:false, motivo:'gate_spento' },
        la stessa forma dell'ATTO I che i vetri già leggono.
        Finché la cucitura non è incollata, l'app chiama, vede fallire e lo DICE sullo
        schermo invece di inventare uno zero.

     🔑 TRE COSE CHE QUESTO VETRO NON FA, DI PROPOSITO
        ① non conia un numero: ogni cifra viene dal `detalle` del bordo;
        ② non scrive un nome a mano in `quien`: manda l'ALIAS REGISTRATO (`app_caja`), e
           se la persona non ne ha uno lo dice PRIMA che il dinero esca — un pago che
           risulta non firmato dopo la consegna è peggio di un pago rifiutato prima
           (🚚, `CAJA SQL 9f84f85d01`: senza alias `firmado` è false e la regola 14 dice
           «nadie queda pagado sin su firma»);
        ③ non legge un `gia_presenti` come un pago riuscito: è «Ya pagado», e la cajera
           NON riconsegna il dinero (🎛 BKP, `ATTO I BUSTA DOPPIA ALLA PORTA`).
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Propinas · Pinsita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F3; --surf:#FFFFFF; --surf2:#F0EEE9;
  --ink:#1B1A17; --ink2:#5A564E; --edge:#8A8579; --hair:#D7D4CD;
  --acc:#8c6a20; --ok:#1F7A4D; --warn:#8A5A00; --bad:#B3261E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 Outfit,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:14px 14px calc(26px + env(safe-area-inset-bottom))}
.wrap{max-width:460px;margin:0 auto}
.bar{display:flex;align-items:center;gap:9px;margin-bottom:14px;font-size:12px;color:var(--ink2);
  font-family:'IBM Plex Mono',monospace}
.bar b{color:var(--ink);font-weight:600}
.bar .sp{margin-left:auto}
.pasos{display:flex;gap:5px;margin:10px 0 16px}
.pasos i{flex:1;height:4px;border-radius:3px;background:var(--hair);font-style:normal}
.pasos i.on{background:var(--acc)}
.kick{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--acc);margin:0 0 6px}
.kick.ok{color:var(--ok)} .kick.bad{color:var(--bad)}
h1{font-size:19px;font-weight:700;margin:0 0 3px;letter-spacing:-.01em}
.sd{font-size:12.5px;color:var(--ink2);margin:0 0 14px}
.modo{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:var(--surf2);border:1px solid var(--hair);border-radius:7px;padding:3px 8px;color:var(--acc)}
.modo i{font-style:normal;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink2);font-size:11px}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.big.acc{color:var(--acc)} .big.ok{color:var(--ok)} .big.bad{color:var(--bad)}
.blab{font-size:11.5px;color:var(--ink2);margin:0 0 14px}
.rows{border:1px solid var(--edge);border-radius:11px;overflow:hidden;background:var(--surf);margin-bottom:12px}
.r{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--hair);font-size:13.5px}
.r:last-child{border-bottom:0}
.r .n small{display:block;font-size:10.5px;color:var(--ink2);margin-top:1px}
.r .v{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
.r .v.ok{color:var(--ok)} .r .v.bad{color:var(--bad)} .r .v.acc{color:var(--acc)}
.r .v.strong{color:var(--ink);font-weight:700}
.r.hd{background:var(--surf2);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2);font-weight:700;padding:7px 12px}
.r.tot{background:var(--surf2)} .r.tot .n{font-weight:700} .r.tot .v{color:var(--ink);font-weight:700}
.r.clic{cursor:pointer}
.r.sub{padding-top:2px;border-bottom:0}
.r.sub .n{font-size:11px;color:var(--ink2)}
.r.dim{opacity:.55}
.inp{width:100%;background:var(--surf);border:1.5px solid var(--edge);border-radius:11px;padding:12px;
  font:inherit;font-size:16px;font-weight:600;color:var(--ink);margin-bottom:9px}
.inp::placeholder{color:var(--ink2);font-weight:400;font-size:14px;opacity:.75}
.lb{font-size:11.5px;color:var(--ink2);margin:0 0 6px}
.note{background:var(--surf);border:1px solid var(--edge);border-left-width:3px;border-radius:0 9px 9px 0;
  padding:10px 12px;margin:0 0 12px;font-size:12px;color:var(--ink2);line-height:1.5}
.note.bad{border-left-color:var(--bad)} .note.ok{border-left-color:var(--ok)}
.note b{color:var(--ink)}
.btn{width:100%;border:0;border-radius:13px;padding:14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.btn.acc{background:var(--acc);color:#fff} .btn.ok{background:var(--ok);color:#fff}
.btn.gh{background:transparent;color:var(--ink2);border:1px solid var(--edge)}
.btn[disabled]{opacity:.45;pointer-events:none}
.two{display:flex;gap:9px;margin-top:4px} .two .btn{margin-top:0}
.vuoto{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:7px;color:var(--ink2)}
.vuoto .ic{font-size:36px;opacity:.5}
.vuoto b{color:var(--ink);font-size:16.5px}
.sheet{position:fixed;inset:0;background:rgba(27,26,23,.55);display:none;z-index:40;align-items:flex-end}
.sheet.show{display:flex}
.sheet .card{background:var(--bg);width:100%;border-radius:17px 17px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-width:460px;margin:0 auto}
.pin{letter-spacing:.5em;text-align:center;font-size:22px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
  background:var(--ink);color:#fff;padding:11px 14px;border-radius:11px;font-size:13px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);display:none;z-index:50}
.toast.show{display:block}
.toast.bad{background:var(--bad)} .toast.ok{background:var(--ok)}
</style>

<body>
<div class="wrap" id="app"><p style="text-align:center;color:var(--ink2);padding:40px 0">Cargando…</p></div>
<div class="sheet" id="sheet"><div class="card" id="sheetCard"></div></div>
<div class="toast" id="toast"></div>
<span id="ver" hidden>v1.0.0 · atto3 propinas · 02oct</span>

<script src="shared/pinsita_auth.js"></script>
<script>
(function(){
'use strict';

/* ═══ 0 · CONTESTO ══════════════════════════════════════════════════════ */
var qp = new URLSearchParams(location.search);
var LOCAL = (qp.get('loc') || '').toLowerCase().trim();
var BORDE = {
  rsc: 'https://pinsita-borde.ghutca.workers.dev',
  cdl: 'https://pinsita-borde.ghutca.workers.dev'
};
var TOKEN = qp.get('t') || localStorage.getItem('pinsita_borde_t') || '';
if (qp.get('t')) { try { localStorage.setItem('pinsita_borde_t', qp.get('t')); } catch(e){} }

/* il taglio delle 06:00 serve SOLO a etichettare lo schermo e a scegliere il giorno da
   chiedere: il `dia_operativo` vero lo scrive il bordo in ogni verbo. */
function hoyOperativo(d) {
  var now = d || new Date();
  var s = new Date(now.toLocaleString('en-US', { timeZone: 'America/Santiago' }));
  if (s.getHours() < 6) s.setDate(s.getDate() - 1);
  return s.getFullYear() + '-' + String(s.getMonth()+1).padStart(2,'0') + '-' + String(s.getDate()).padStart(2,'0');
}
function diaAnterior(iso) {
  var d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0,10);
}
var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fechaLarga(iso) {
  var d = new Date(iso + 'T12:00:00');
  return DIAS[d.getDay()] + ' ' + d.getDate() + ' ' + MESES[d.getMonth()];
}
function fmt(n) { return '$' + Math.round(n||0).toLocaleString('es-CL'); }
function uidGesto(p) { return p + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,8); }
function esc(s) { return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
function toast(msg, clase) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (clase ? ' ' + clase : '');
  clearTimeout(toast._h); toast._h = setTimeout(function(){ t.classList.remove('show'); }, 3600);
}

/* ═══ 1 · RED ═══════════════════════════════════════════════════════════ */
var COLA_KEY = 'caja_atto3_cola';
function leerCola(){ try { return JSON.parse(localStorage.getItem(COLA_KEY) || '[]'); } catch(e){ return []; } }
function guardarCola(c){ try { localStorage.setItem(COLA_KEY, JSON.stringify(c)); } catch(e){} }

async function postCaja(body) {
  var base = BORDE[LOCAL] || BORDE.rsc;
  var url = base + '/caja/' + encodeURIComponent(LOCAL) + '?t=' + encodeURIComponent(TOKEN);
  try {
    var r = await fetch(url, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
    var j = await r.json();
    /* 🔴 «ya pagado» NON è un pago riuscito e NON è «non è successo niente»:
       è il dinero che è già uscito una volta. Lo diciamo con il suo nome. */
    if (j && j.motivo === 'propina_ya_pagada') return { ok:false, yaPagado:true, ya: j.ya || null };
    if (!r.ok || (j && j.ok === false)) return { ok:false, motivo:(j && (j.motivo || j.error)) || ('http_' + r.status) };
    if (j && j.scritto === false) return { ok:false, motivo: j.motivo || 'no_escrito' };
    return { ok:true };
  } catch (e) {
    /* un pago NON si accoda: se il dinero esce, deve esserci una riga adesso.
       Accodare un pago vuol dire consegnare contante contro una promessa di scrittura. */
    if (body && body.verbo === 'propina_pago') return { ok:false, motivo:'sin_red' };
    var c = leerCola(); c.push(body); guardarCola(c);
    return { ok:true, encolado:true };
  }
}
async function getReparto(dia, turno) {
  var base = BORDE[LOCAL] || BORDE.rsc;
  var url = base + '/caja/' + encodeURIComponent(LOCAL) + '/reparto?t=' + encodeURIComponent(TOKEN)
    + '&dia=' + encodeURIComponent(dia) + '&turno=' + encodeURIComponent(turno);
  try {
    var r = await fetch(url);
    var j = await r.json();
    if (!r.ok || (j && j.ok === false)) return { ok:false, error:(j && (j.error || j.motivo)) || ('http_' + r.status) };
    return Object.assign({ ok:true }, j);
  } catch (e) { return { ok:false, error:'sin_red' }; }
}

/* ═══ 2 · ESTADO ════════════════════════════════════════════════════════ */
var SES = null;
var DIA_HOY = hoyOperativo();
var DIA = diaAnterior(DIA_HOY);     // la propina che si paga oggi è di IERI (regola 7)
var TURNO = 'PM';                   // il turno del reparto che si sta pagando
var PASO = 1;                       // 1 reparto · 2 pago · 3 barra y cocina (solo a leva accesa)
var D = null;                       // la risposta di /reparto

/* ═══ 3 · RENDER ════════════════════════════════════════════════════════ */
var app = document.getElementById('app');

function barra() {
  return '<div class="bar"><b>Propinas</b> · ' + esc(fechaLarga(DIA)) + ' · ' + esc(TURNO)
    + '<span class="sp">' + esc((SES && SES.user) || '') + '</span></div>'
    + '<div class="pasos"><i class="' + (PASO>=1?'on':'') + '"></i><i class="' + (PASO>=2?'on':'') + '"></i>'
    + (verBarra() ? '<i class="' + (PASO>=3?'on':'') + '"></i>' : '') + '</div>';
}
/* ⑫ e la divisione per punti seguono la LEVA DEL SERVER, non una costante di qui:
   accendere il 30% è una leva sola, non una leva più un deploy del vetro. */
function verBarra() { return !!(D && D.detalle && D.detalle.reparto_30_por_puntos); }

function cargando() { app.innerHTML = barra() + '<p style="text-align:center;color:var(--ink2);padding:30px 0">Cargando…</p>'; }

function sinRed(err) {
  app.innerHTML = barra()
    + '<div class="vuoto"><div class="ic">📵</div><b>No puedo leer el reparto</b>'
    + '<p style="margin:0;font-size:13px">' + esc(err === 'sin_red' ? 'Sin conexión.' : ('El bordo respondió: ' + err)) + '</p>'
    + '<p style="margin:0;font-size:12px">No te muestro números hasta poder leerlos.</p></div>'
    + '<button class="btn gh" id="rec">Reintentar</button>';
  document.getElementById('rec').onclick = cargar;
}

/* ⑩ · gli ARRESTI: il reparto non si chiude e si dice CHI manca. */
function pantallaFalta(f) {
  var h = barra() + '<p class="kick bad">Falta algo antes de cerrar</p>';
  if (f.alias && f.alias.length) {
    h += '<h1>No sé quién es</h1><p class="sd">Alguien cobró propina anoche con un nombre que no está en la lista de personas.</p>'
      + '<div class="rows"><div class="r hd">nombres sin ficha</div>'
      + f.alias.map(function(n){ return '<div class="r"><div class="n">' + esc(n) + '</div><div class="v bad">sin ficha</div></div>'; }).join('')
      + '</div><div class="note bad">Si reparto sin ellos, su dinero se suma al de los demás y ningún total se ve mal. '
      + 'Avisa a administración para que quede en la lista.</div>';
  } else if (f.cobraron_y_no_estan && f.cobraron_y_no_estan.length) {
    h += '<h1>Falta marcar a alguien</h1><p class="sd">Cobraron propina anoche y no están entre los que trabajaron.</p>'
      + '<div class="rows"><div class="r hd">cobraron y no están marcados</div>'
      + f.cobraron_y_no_estan.map(function(x){
          return '<div class="r"><div class="n">' + esc((x.grafias||[]).join(' · ')) + '</div><div class="v">' + fmt(x.propina) + '</div></div>'; }).join('')
      + '</div><div class="note bad">Márcalos como que trabajaron, o déjalos fuera a propósito. '
      + 'Lo que no se puede es cerrar sin decidirlo.</div>';
  } else if (f.dos_grupos_mismo_turno && f.dos_grupos_mismo_turno.length) {
    h += '<h1>Alguien está en dos grupos</h1><p class="sd">En un turno cada persona recibe de un solo grupo.</p>'
      + '<div class="rows">'
      + f.dos_grupos_mismo_turno.map(function(x){
          return '<div class="r"><div class="n">' + esc(x.nombre || x.persona_id) + '<small>' + esc((x.grupos||[]).join(' + ')) + '</small></div></div>'; }).join('')
      + '</div>';
  } else if (f.modo) {
    h += '<h1>No sé cómo se reparte hoy</h1><p class="sd">' + esc(f.modo) + '</p>'
      + '<div class="note bad">La regla del día y del turno no está escrita. No reparto adivinando.</div>';
  } else {
    h += '<h1>Falta algo</h1><p class="sd">' + esc(JSON.stringify(f)) + '</p>';
  }
  h += '<button class="btn gh" id="rec">Volver a leer</button>';
  app.innerHTML = h;
  document.getElementById('rec').onclick = cargar;
}

/* ⑩ · EL REPARTO */
function pantallaReparto() {
  var d = D.detalle, rp = D.reparto;
  var meseros = (d.partes || []).filter(function(p){ return p.grupo === 'mesero'; });
  var esTronco = rp.modo === 'tronco';
  var h = barra()
    + '<p class="kick">Propinas</p><h1>El reparto</h1>'
    + '<p class="sd"><span class="modo">' + (esTronco ? 'Al tronco' : 'Individual') + '</span> '
    + '<i>' + (esTronco ? 'parte igual para todos' : 'cada uno lo suyo') + '</i></p>'
    /* il pozo, di sopra: le tre righe che lo formano e il totale */
    + '<div class="rows">'
    + '<div class="r"><div class="n">Propina en tarjeta</div><div class="v">' + fmt(rp.pozo_no_efectivo) + '</div></div>'
    + '<div class="r"><div class="n">Descuento tarjeta ' + esc(rp.desc_no_efectivo_pct) + '%</div><div class="v bad">−' + fmt(d.descuento) + '</div></div>'
    + '<div class="r"><div class="n">Propina en efectivo</div><div class="v">' + fmt(rp.pozo_efectivo) + '</div></div>'
    + (d.residuo_arrastrado > 0
       ? '<div class="r"><div class="n">Queda de ayer<small>el redondeo del reparto anterior</small></div><div class="v">' + fmt(d.residuo_arrastrado) + '</div></div>' : '')
    + '<div class="r tot"><div class="n">El pozo</div><div class="v">' + fmt(d.pozo_neto) + '</div></div>'
    + '</div>';

  /* i garzones: il 70%, che è ciò che il sistema paga */
  h += '<div class="rows"><div class="r hd">garzones · ' + esc(rp.quota_meseros_pct) + '%</div>';
  if (esTronco) {
    var cu = meseros.length ? meseros[0].monto : 0;
    h += '<div class="r tot"><div class="n">' + meseros.length + ' ' + (meseros.length === 1 ? 'garzón' : 'garzones')
      + '<small>' + fmt(cu) + ' cada uno</small></div><div class="v">' + fmt(d.monto_meseros) + '</div></div>';
    h += meseros.map(function(p){
      return '<div class="r"><div class="n">' + esc(p.nombre) + '</div><div class="v strong">' + fmt(p.monto) + '</div></div>'; }).join('');
  } else {
    h += meseros.map(function(p){
      return '<div class="r"><div class="n">' + esc(p.nombre)
        + '<small>tarjeta ' + fmt(p.propia_no_efectivo) + ' · efectivo ' + fmt(p.propia_efectivo) + '</small></div>'
        + '<div class="v strong">' + fmt(p.monto) + '</div></div>'; }).join('');
    h += '<div class="r tot"><div class="n">A los garzones</div><div class="v">' + fmt(d.monto_meseros) + '</div></div>';
  }
  h += '</div>';

  /* il 30%. A leva spenta: una riga e l'etichetta di stato — le parole sono di 🎨 DESIGN,
     e sono poche di proposito: nessun «por ahora», nessun perché. */
  h += '<div class="rows">';
  if (!verBarra()) {
    h += '<div class="r tot"><div class="n">Barra y cocina · ' + (100 - Number(rp.quota_meseros_pct)) + '%'
      + '<small>lo reparte Alberto</small></div><div class="v">' + fmt(d.monto_30) + '</div></div>';
  } else {
    var bc = (d.partes || []).filter(function(p){ return p.grupo === 'barra_cocina'; });
    var pts = bc.reduce(function(a,p){ return a + (Number(p.puntos) === 0.5 ? 0.5 : 1); }, 0);
    h += '<div class="r hd">barra y cocina · ' + (100 - Number(rp.quota_meseros_pct)) + '%</div>';
    if (d.gastos_fijos > 0) {
      h += '<div class="r"><div class="n">Gastos fijos del día</div><div class="v bad">−' + fmt(d.gastos_fijos) + '</div></div>';
    }
    if (d.gastos_alcanzan === false) {
      h += '<div class="r"><div class="n">Faltan</div><div class="v bad">−' + fmt(d.gastos_faltan) + '</div></div>';
    }
    h += '<div class="r tot"><div class="n">' + pts + ' ' + (pts === 1 ? 'punto' : 'puntos') + '</div>'
      + '<div class="v">' + fmt(d.monto_barra_cocina) + '</div></div>';
  }
  h += '</div>';

  if (d.residuo > 0) {
    h += '<p class="blab">Quedan ' + fmt(d.residuo) + ' del redondeo. Van al pozo de mañana.</p>';
  }
  if (D.cerrado) {
    h += '<button class="btn ok" id="ir">Ir a la entrega</button>';
  } else {
    h += '<button class="btn acc" id="cerrar">Cerrar y avisar</button>'
      + '<p class="blab" style="text-align:center;margin-top:8px">Cada uno ve su número antes de recibir el dinero.</p>';
  }
  app.innerHTML = h;
  if (D.cerrado) document.getElementById('ir').onclick = function(){ PASO = 2; pintar(); };
  else document.getElementById('cerrar').onclick = cerrarReparto;
}

/* ⑪ · EL PAGO — una LISTA DI LAVORO: in alto chi manca, sotto chi è già pagato */
function pantallaPago() {
  var d = D.detalle;
  var pagados = {};
  (D.pagados || []).forEach(function(p){
    var k = String(p.persona_id) + '|' + String(p.concepto == null ? '' : p.concepto);
    if (!pagados[k] || String(p.ts||'') > String(pagados[k].ts||'')) pagados[k] = p;
  });
  var grupo = (PASO === 3) ? 'barra_cocina' : 'mesero';
  var filas = (d.partes || []).filter(function(p){ return p.grupo === grupo && Number(p.monto) > 0; });
  var falta = [], hechos = [], faltaTot = 0;
  filas.forEach(function(p){
    var f = pagados[String(p.persona_id) + '|'];
    if (f && f.firmado) hechos.push({ p:p, f:f });
    else { falta.push({ p:p, f:f||null }); faltaTot += Number(p.monto)||0; }
  });
  var alias = {};
  (D.personas || []).forEach(function(x){ alias[String(x.persona_id)] = !!x.alias_app_caja; });

  var h = barra() + '<p class="kick">Propinas</p>'
    + '<h1>La entrega · ' + hechos.length + ' de ' + filas.length + '</h1>'
    + '<p class="sd">Cambio de turno · le toca a quien tienes delante</p>';

  if (!filas.length) {
    h += '<div class="vuoto"><div class="ic">✓</div><b>Nada que entregar</b>'
      + '<p style="margin:0;font-size:13px">Este turno no dejó propina para este grupo.</p></div>';
  } else {
    h += '<div class="rows"><div class="r hd">falta entregar · ' + fmt(faltaTot) + '</div>';
    if (!falta.length) {
      h += '<div class="r"><div class="n">Ya están todos</div><div class="v ok">✓</div></div>';
    } else {
      h += falta.map(function(x){
        var sinAlias = alias[String(x.p.persona_id)] === false;
        var sub = sinAlias ? 'no puede firmar todavía'
          : (x.f ? 'esperando su firma' : 'aún no llega');
        return '<div class="r' + (sinAlias ? ' dim' : ' clic') + '" data-pid="' + esc(x.p.persona_id) + '">'
          + '<div class="n">' + esc(x.p.nombre) + '<small>' + sub + '</small></div>'
          + '<div class="v ' + (sinAlias ? 'bad' : 'strong') + '">' + fmt(x.p.monto) + (sinAlias ? '' : ' ☝︎') + '</div></div>'; }).join('');
    }
    h += '</div>';
    if (hechos.length) {
      h += '<div class="rows"><div class="r hd">ya entregados</div>'
        + hechos.map(function(x){
            return '<div class="r"><div class="n">' + esc(x.p.nombre) + '<small>firmado</small></div>'
              + '<div class="v ok">' + fmt(x.f.monto) + ' ✓</div></div>'; }).join('')
        + '</div>';
    }
    if (falta.some(function(x){ return alias[String(x.p.persona_id)] === false; })) {
      h += '<div class="note bad"><b>Sin ficha no se puede firmar.</b> No le entregues el dinero todavía: '
        + 'quedaría sin firma y, para el sistema, sin pagar. Avisa a administración.</div>';
    }
    h += '<div class="note">Nadie queda pagado sin su firma. Quien no viene hoy no pierde nada: '
      + 'su dinero queda en el fondo y aparece mañana en esta misma lista.</div>';
  }
  h += '<div class="two"><button class="btn gh" id="atras">‹ El reparto</button>'
    + '<button class="btn ok" id="guardar">Guardar</button></div>';
  app.innerHTML = h;
  document.getElementById('atras').onclick = function(){ PASO = 1; pintar(); };
  document.getElementById('guardar').onclick = function(){ toast('Guardado. Mañana sigue en esta lista.', 'ok'); };
  Array.prototype.forEach.call(app.querySelectorAll('.r.clic[data-pid]'), function(el){
    el.onclick = function(){ abrirFirma(el.dataset.pid, grupo); };
  });
}

/* la firma a PIN di CHI RICEVE — non della cajera */
function abrirFirma(pid, grupo) {
  var d = D.detalle;
  var p = (d.partes || []).filter(function(x){ return String(x.persona_id) === String(pid) && x.grupo === grupo; })[0];
  if (!p) return;
  var card = document.getElementById('sheetCard');
  card.innerHTML = '<p class="kick">Firma de quien recibe</p>'
    + '<h1>' + esc(p.nombre) + '</h1>'
    + '<p class="big acc">' + fmt(p.monto) + '</p>'
    + '<p class="blab">Que entre su PIN. No es el tuyo.</p>'
    + '<input class="inp pin" id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="····">'
    + '<div class="two"><button class="btn gh" id="can">Cancelar</button>'
    + '<button class="btn ok" id="ok">Entregado</button></div>';
  document.getElementById('sheet').className = 'sheet show';
  document.getElementById('pin').focus();
  document.getElementById('can').onclick = cerrarSheet;
  document.getElementById('ok').onclick = function(){ confirmarPago(p, grupo); };
}
function cerrarSheet(){ document.getElementById('sheet').className = 'sheet'; }

async function confirmarPago(p, grupo) {
  var pin = (document.getElementById('pin') || {}).value || '';
  if (!pin) { toast('Falta el PIN de quien recibe', 'bad'); return; }
  var per = (D.personas || []).filter(function(x){ return String(x.persona_id) === String(p.persona_id); })[0];
  if (per && per.alias_app_caja === false) { toast('Sin ficha no se puede firmar', 'bad'); return; }
  var btn = document.getElementById('ok'); btn.disabled = true; btn.textContent = 'Enviando…';
  var r = await postCaja({
    verbo: 'propina_pago',
    uid_gesto: uidGesto('pp'),              // l'uid lo conia il vetro, mai il bordo
    reparto_uid: D.reparto_uid || (D.reparto && D.reparto.uid_gesto) || null,
    persona_id: p.persona_id,
    grupo: grupo,
    concepto: p.concepto || null,
    monto: p.monto,
    tranche: TURNO === 'AM' ? 'AM_cierre' : 'PM_apertura',
    quien: (per && per.alias_app_caja_nombre) || p.persona_id,   // l'ALIAS registrato, mai testo libero
    pin: pin
  });
  btn.disabled = false; btn.textContent = 'Entregado';
  if (r.yaPagado) {
    cerrarSheet();
    toast('Ya pagado' + (r.ya && r.ya.monto ? ' · ' + fmt(r.ya.monto) : '') + '. No le entregues de nuevo.', 'bad');
    await cargar();
    return;
  }
  if (!r.ok) {
    toast(r.motivo === 'gate_spento' ? 'El pago del sistema aún no está encendido'
      : (r.motivo === 'sin_red' ? 'Sin conexión: no entregues hasta que quede escrito' : ('No se pudo: ' + r.motivo)), 'bad');
    return;
  }
  cerrarSheet();
  toast('Entregado y firmado', 'ok');
  await cargar();
}

async function cerrarReparto() {
  var btn = document.getElementById('cerrar'); btn.disabled = true; btn.textContent = 'Cerrando…';
  var partes = ((D.detalle && D.detalle.partes) || []).map(function(p){
    return { persona_id: p.persona_id, grupo: p.grupo, puntos: p.puntos, concepto: p.concepto || null };
  });
  var r = await postCaja({ verbo:'reparto_cerrar', uid_gesto: uidGesto('rp'),
    dia_operativo: DIA, turno: TURNO, partes: partes });
  btn.disabled = false; btn.textContent = 'Cerrar y avisar';
  if (!r.ok) {
    toast(r.motivo === 'gate_spento' ? 'El reparto del sistema aún no está encendido' : ('No se pudo: ' + r.motivo), 'bad');
    return;
  }
  toast(r.encolado ? 'Sin conexión: queda guardado y se envía solo' : 'Reparto cerrado. Cada uno ya ve su número.', 'ok');
  await cargar();
  PASO = 2; pintar();
}

function pintar() {
  if (!D) { cargando(); return; }
  if (!D.ok) { sinRed(D.error || 'error'); return; }
  if (D.falta) { pantallaFalta(D.falta); return; }
  if (!D.detalle) {
    app.innerHTML = barra() + '<div class="vuoto"><div class="ic">🌙</div><b>Todavía no hay propinas</b>'
      + '<p style="margin:0;font-size:13px">' + esc(fechaLarga(DIA)) + ' · ' + esc(TURNO) + ' no dejó propina.</p></div>'
      + '<button class="btn gh" id="rec">Volver a leer</button>';
    document.getElementById('rec').onclick = cargar;
    return;
  }
  if (PASO === 1) pantallaReparto();
  else pantallaPago();
}

async function cargar() {
  cargando();
  D = await getReparto(DIA, TURNO);
  if (D && D.ok && D.gate === false) {
    /* la leva spenta si DICE, non si traveste da «niente da fare» */
    app.innerHTML = barra() + '<div class="vuoto"><div class="ic">🔌</div><b>El reparto del sistema está apagado</b>'
      + '<p style="margin:0;font-size:13px">Hoy la entrega se hace a mano, en papel.</p></div>';
    return;
  }
  pintar();
}

/* ═══ 4 · ARRANQUE ══════════════════════════════════════════════════════
   ✏️ Al primo giro avevo scritto `init({ cargos:[…], onReady: … })`: **due opzioni
      che non esistono.** `pinsita_auth.js` prende `{ local, accent }` e la sessione si
      legge con `PinsitaAuth.sesion()`; il gating di cargo lo fa `aplicarGating` sugli
      attributi delle card, non un parametro di `init`.
   🩸 E non avrebbe dato nessun errore: `init` sarebbe partito con `local` di default e
      `onReady` **non sarebbe mai stato chiamato** ⇒ schermo fermo su «Cargando…»,
      senza una riga rossa in console. L'ho trovato leggendo la fonte di `init`, non
      provando il vetro — ed è il tipo di difetto per cui si legge la fonte. */
async function flushCola() {
  var c = leerCola();
  if (!c.length) return;
  var resto = [];
  for (var i = 0; i < c.length; i++) {
    var r = await postCaja(c[i]);
    if (!r.ok) resto.push(c[i]);
  }
  guardarCola(resto);
  if (resto.length < c.length) { toast((c.length - resto.length) + ' envíos pendientes se enviaron', 'ok'); cargar(); }
}

function arrancar() {
  SES = (window.PinsitaAuth && PinsitaAuth.sesion && PinsitaAuth.sesion()) || { user:'?', role:'CAJA' };
  if (!LOCAL) LOCAL = (SES.local && SES.local !== '*') ? SES.local : 'rsc';
  /* AM = día, PM = noche (🎛, `AM DIA PM NOCHE CONFERMATO`). Regola 7: ai meseros AM si
     paga alla chiusura del loro turno, ai PM all'apertura del loro ⇒ la mattina si paga
     il PM della notte prima, dal pomeriggio l'AM di oggi. */
  var hh = new Date(new Date().toLocaleString('en-US', { timeZone:'America/Santiago' })).getHours();
  if (hh >= 14) { DIA = DIA_HOY; TURNO = 'AM'; } else { DIA = diaAnterior(DIA_HOY); TURNO = 'PM'; }
  flushCola();
  cargar();
}

if (!window.PinsitaAuth) {
  app.innerHTML = '<p style="color:var(--bad)">No se pudo cargar pinsita_auth.js</p>';
} else {
  /* init() toglie l'overlay di login quando c'è sessione; se non c'è, mostra il login
     e blocca la UI da sé. Si parte comunque, come fa il vetro dell'ATTO II. */
  PinsitaAuth.init({ local: '*', accent: '#8c6a20' });
  setTimeout(arrancar, 50);
}
window.addEventListener('online', flushCola);
})();
</script>
