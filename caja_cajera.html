     🔴 `reserva_sobre` NON segue il binario accodato degli altri tre:
        bacheca `SPECIFICA BUSTA R-nnnn CAJA ROJA` (DESIGN, ordine di

<script>
(function(){
'use strict';

/* ═══ 0 · CONTESTO ══════════════════════════════════════════════════════ */
var qp = new URLSearchParams(location.search);
var LOCAL = (qp.get('loc') || '').toLowerCase().trim();
/* ✏️ 03-ott · BKP (`INTEGRACIÓN CAJA b50beda`): el bordo vivo es
   alberto-agostini.workers.dev — el otro dominio (ghutca) que tenía aquí
   no es el que sala.html usa de verdad (BORDE_SALA.URL, verificado). */
var BORDE = {
  rsc: 'https://pinsita-borde.alberto-agostini.workers.dev',
  cdl: 'https://pinsita-borde.alberto-agostini.workers.dev',
  bks: 'https://pinsita-borde.alberto-agostini.workers.dev'
};
/* [08-ott · BKP `BKP MAYRA LOC RIPIEGO RSC` + V28 `MAYRA LOC BKS LINK DATO`] los locales que TIENEN caja configurada (PIN en el bordo: hoy solo `PIN_CAJA_MAP_BKS`).
   Sin `?loc=` y sin un local de sesion que sea uno de estos, la caja PREGUNTA — antes caia en silencio a `rsc`, que no tiene PIN (Mayra veia «pin_caja_no_configurado» con todo lo demas en regla).
   Un local nuevo con caja se agrega aqui (y su PIN en el bordo). */
var LOCALES_CAJA = { bks: 'Backstage' };
/* [08-ott · AUT-EMERG · Mayra ferma] il portale porta qui con ?loc= e SENZA ?t=, e su un telefono nuovo il localStorage e vuoto: ⇒ token_invalid. Ripiego = lo STESSO gate di lettura che `app_jl.html`
   porta nel suo CFG (e un token PUBBLICO, non un'autenticazione: lo dice il codice stesso, M4). La sicurezza vera della caja e il PIN della cajera, che il DO verifica a ogni lettura. La radice (token per persona) e la 10.1/10.2 di RRHH. */
var TOKEN_PORTALE = '7QvreCN5fzM40GW2Me8vfvNwIwcA9RDnTceXMwgZ';
var TOKEN = qp.get('t') || localStorage.getItem('pinsita_borde_t') || TOKEN_PORTALE;
if (qp.get('t')) { try { localStorage.setItem('pinsita_borde_t', qp.get('t')); } catch(e){} }

/* ✏️ 03-ott · el PIN de la cajera — NUNCA en localStorage (misma disciplina
   que el PIN del JL): vive solo en memoria, se pide una vez al abrir, y una
   respuesta pin_caja_invalido lo borra y lo vuelve a pedir. Nunca viaja en
   la URL: body pin_caja en los POST, header X-Caja-Pin en los GET. */
var PIN_CAJA = null;

function hoyOperativo(d) {
  /* taglio 06:00 America/Santiago — stessa regola del bordo (sombraFechaOpOf),
     qui solo per ETICHETTARE lo schermo: il dia_operativo VERO lo scrive il
     bordo stesso in ogni verbo (`caja_atto2.js` lo riceve, non lo calcola). */
  var now = d || new Date();
  var santiago = new Date(now.toLocaleString('en-US', { timeZone: 'America/Santiago' }));
  if (santiago.getHours() < 6) santiago.setDate(santiago.getDate() - 1);
  var y = santiago.getFullYear(), m = String(santiago.getMonth()+1).padStart(2,'0'), day = String(santiago.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}
function diaAnterior(iso) {
  var d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0,10);
}
function fmt(n) { return '$' + Math.round(n||0).toLocaleString('es-CL'); }
/* ✏️ 03-ott · Alberto, a DESIGN: «"Anoche" a mediodía ya no se sabe a qué
   se refiere — la fecha sí». "2026-10-02" -> "2 Oct". */
function fechaCorta(iso) {
  var d = new Date(iso + 'T12:00:00');
  return d.getDate() + ' ' + d.toLocaleDateString('es-CL', { month: 'short' }).replace('.', '');
}
function uidGesto(prefijo) {
  return prefijo + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
}
/* [08-ott · EMERG CAJERA ACCODATO LETTO COME ERRORE 5 CONTEOS] el uid nace con el GESTO, no con el tocco: «el retry crea una fila nueva» fue lo que paso (5 conteos de la 1002 en 32 s, cada uno con su uid).
   La clave describe el contenido del gesto (que fila, que cifra): el mismo gesto repetido (retry, segundo tocco, red incierta) recibe el MISMO uid y el bordo lo reconoce (`ya`);
   un gesto CON OTRO CONTENIDO (otra cifra) es un hecho nuevo y recibe uno nuevo. */
var UIDS_GESTO = {};
function uidGestoEstable(clave, prefijo) {
  if (!UIDS_GESTO[clave]) UIDS_GESTO[clave] = uidGesto(prefijo);
  return UIDS_GESTO[clave];
}
function toast(msg, clase) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (clase ? ' ' + clase : '');
  clearTimeout(toast._h); toast._h = setTimeout(function(){ t.classList.remove('show'); }, 3200);
}

/* ✏️ 02-ott sera · Alberto («DOPPIO TOCCO DISEGNO E SISTEMA»): «se clicco due
   volte, sono dos fatti» — un sistema a 450ms premia el doble toque que el
   sistema lento (Google) castigaba sin querer. UN TOQUE = UN HECHO: en cada
   botón que escribe un fatto (confirmar conteo · guardar corte · salir al
   banco · guardar depósito), el segundo toque se ignora hasta que el primero
   termina (éxito o error) — nunca "mientras dure la red", siempre hasta que
   el gesto esté confirmado. La etiqueta cambia al tocar: prueba visible de
   que SÍ tomó el gesto, no solo un botón apagado. */
function unTocoUnHecho(btn, fn) {
  btn.addEventListener('click', async function(ev){
    if (btn.dataset.tocado === '1') return;   // el segundo toque, ignorado
    btn.dataset.tocado = '1';
    var texto = btn.textContent;
    btn.textContent = '… ' + texto;
    btn.disabled = true;
    try { await fn(ev); }
    finally {
      btn.dataset.tocado = '';
      btn.disabled = false;
      btn.textContent = texto;
    }
  });
}

/* ═══ 1 · RED — llamadas al bordo, con cola si falla ════════════════════ */
var COLA_KEY = 'caja_atto2_cola';
function leerCola() { try { return JSON.parse(localStorage.getItem(COLA_KEY) || '[]'); } catch(e){ return []; } }
function guardarCola(c) { try { localStorage.setItem(COLA_KEY, JSON.stringify(c)); } catch(e){} }
function colaEncolar(body) {
  var c = leerCola(); c.push(body); guardarCola(c);
}
/* las cuatro respuestas del PIN de la caja (bordo, _cajaPinCaja): si una
   llamada tropieza con alguna, se trata ANTES de leer "ok"/"motivo" como
   si fuera un rechazo cualquiera — borra el PIN si está mal, y pide uno
   nuevo en la próxima pantalla en vez de reintentar a ciegas. */
async function esRespuestaPin(j) {
  var err = j && j.error;
  if (err === 'pin_caja_invalido') {
    PIN_CAJA = null; toast('PIN incorrecto. Vuelve a escribirlo.', 'bad');
    await pedirPinCaja();   // la próxima vez que toque el botón, ya tiene PIN fresco
    return true;
  }
  if (err === 'pin_caja_requerido') { PIN_CAJA = null; toast('Falta tu PIN.', 'bad'); await pedirPinCaja(); return true; }
  if (err === 'pin_caja_bloqueado') {
    var s = Math.ceil((j.faltan_s || 0));
    toast('Demasiados intentos. Espera ' + Math.ceil(s / 60) + ' min.', 'bad'); return true;
  }
  if (err === 'pin_caja_no_configurado') { toast('La caja todavía no tiene PIN configurado. Avisa a Alberto.', 'bad'); return true; }
  return false;
}
async function postCaja(body) {
  var base = BORDE[LOCAL];   // sin ripiego a rsc: arrancar() garantiza un LOCAL, y un local sin URL falla fuerte abajo
  if (!base) return { ok:false, error:'local_sin_bordo' };
  var url = base + '/caja/' + encodeURIComponent(LOCAL) + '?t=' + encodeURIComponent(TOKEN);
  var conPin = Object.assign({ pin_caja: PIN_CAJA }, body, PROVA ? { dia_prueba: DIA_HOY } : {});   // [05-ott] en modo prueba el «hoy» es de prueba, y lo dice el vetro
  try {
    var r = await fetch(url, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(conPin) });
    var j = await r.json();
    if (await esRespuestaPin(j)) return { ok:false, motivo: j.error, pin:true };
    if (!r.ok || j.ok === false) return { ok:false, motivo: j.motivo || j.error || ('http_' + r.status) };
    /* `accodato:true` = en cola de Postgres, que es el exito de este verbo (el bordo lo dice con dos palabras distintas a proposito: «accodato NO es scritto»). Leerlo como fallo hizo repetir el toque. */
    if (j.scritto === false && !j.accodato && !j.ya) return { ok:false, motivo: j.motivo || 'no_escrito' };
    /* el cuerpo puede traer más que ok/scritto — p.ej. reserva_sobre
       responde {sobre_nro} en la MISMA escritura (verbo síncrono, no
       encolado: ver cajaAtto2FilaReservaSobre en el bordo). */
    return Object.assign({ ok:true }, j);
  } catch (e) {
    /* sin red: no sabemos si el PIN es válido, pero encolar el pin_caja
       junto al gesto es lo correcto — se verifica cuando el bordo responda. */
    colaEncolar(conPin);
    return { ok:true, encolado:true };
  }
}
async function flushCola() {
  var c = leerCola();
  if (!c.length) return;
  var resto = [];
  for (var i=0;i<c.length;i++) {
    var r = await postCaja(c[i]);
    if (!r.ok) resto.push(c[i]);
  }
  guardarCola(resto);
  if (resto.length < c.length) toast((c.length-resto.length) + ' envíos pendientes se enviaron', 'ok');
}
async function getCaja(path) {
  var base = BORDE[LOCAL];   // sin ripiego a rsc: arrancar() garantiza un LOCAL, y un local sin URL falla fuerte abajo
  if (!base) return { ok:false, error:'local_sin_bordo' };
  var url = base + '/caja/' + encodeURIComponent(LOCAL) + '/' + path +
    (path.indexOf('?') >= 0 ? '&' : '?') + 't=' + encodeURIComponent(TOKEN);
  try {
    /* el PIN nunca en la URL: header X-Caja-Pin, como pide BKP */
    var r = await fetch(url, { headers: { 'X-Caja-Pin': PIN_CAJA || '' } });
    var j = await r.json();
    if (await esRespuestaPin(j)) return { ok:false, error: j.error, pin:true };
    if (!r.ok || j.ok === false) return { ok:false, error: j.error || ('http_' + r.status) };
    return Object.assign({ ok:true }, j);
  } catch (e) { return { ok:false, error:'sin_red' }; }
}

/* ═══ 2 · ESTADO ══════════════════════════════════════════════════════════ */
var SES = null;          // { user, role, local, turno }
var DIA_HOY = hoyOperativo();
var DIA_NOCHE = diaAnterior(DIA_HOY);
/* ═══ [05-ott · MARCIA BIANCA · modo de collaudo] `?prova=1` ═══════════════════════════════════════════
   Los días de prueba son 2099-…: un día que no existe para los datos reales. El bordo deja operar ese día SOLO al
   PIN COLLAUDO, y cierra el día real a ese PIN (y el día de prueba a los PIN reales): el collaudo no ve datos
   verdaderos y los datos verdaderos no ven el collaudo. Sin `?prova=1` la app es la de siempre, byte por byte. */
var PROVA = (function () { try { return new URLSearchParams(location.search).get('prova') === '1'; } catch (e) { return false; } })();
if (PROVA) { DIA_HOY = '2099-12-31'; DIA_NOCHE = '2099-12-30'; }
var PASO = 1;            // 1 caja fuerte · 2 conteo · 3 cortes pos · 4 deposito
var MANANA = null;        // respuesta de /manana (o, en modo MULTI, la de /pendientes con la misma forma)
/* [08-ott · AUT-0613 · el depósito en VARIOS días] los depósitos se hacen en días elegidos al azar, nunca fijos (orden de Alberto): los sobres se acumulan
   en varias noches y el depósito dice qué días contiene. MULTI = la lectura `pendientes` (todas las noches sin depósito). Si el bordo todavía no la tiene
   (404 / 502 / sin la vista), la app sigue como antes: UNA noche, la de ayer — sin romperse. La app NO sugiere ningún día: muestra cuánto se acumuló. */
var MULTI = false;
var NOCHES = [];          // las noches (YYYY-MM-DD) de los sobres pendientes, en MULTI
var SOBRE_IDX = 0;        // qué sobre se está contando
var CORTES = null;        // respuesta de /cortes_pos
var DEPOSITO_PENDIENTE = null;

/* ═══ 3 · RENDER ══════════════════════════════════════════════════════════ */
var app = document.getElementById('app');
function barra(titulo) {
  return (PROVA ? '<div class="note bad" style="margin:0 0 8px;text-align:center"><b>🧪 MODO PRUEBA</b> · día de prueba 2099 · nada de esto es real</div>' : '') +
    '<div class="bar"><span>' + new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}) +
    '</span><span>· <b>Caja</b> · ' + (SES ? esc(SES.user) : '') + ' <small id="ver" style="opacity:.45;font-size:.7em">caja 1.4.0</small></span></div>' +
    (titulo ? '<div class="pasos">' + [1,2,3,4].map(function(i){return '<i class="' + (i<=PASO?'on':'') + '"></i>';}).join('') + '</div>' : '');
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

/* [05-ott · modo prueba] planta una caja_sobre de PRUEBA (día 2099) para poder contar y depositar hoy */
async function plantarBustaPrueba() {
  var nro = (document.getElementById('psNro').value || '').replace(/[^0-9]/g, '');
  var monto = parseInt((document.getElementById('psMonto').value || '').replace(/[^0-9]/g, ''), 10);

/* ═══ [10-ott · V28 · collaudo con Mayra] LA BUSTA «NO ENCONTRADA» ══════════════════════════════════════════════════════
   Una busta que no existe fisicamente NO se cuenta 0: eso obligaba a declarar un sello — un hecho falso. Ahora hay un estado suyo: «no encontrado · motivo», sin sello y sin contado, y
   «la encontré» para deshacerlo. El bordo lo escribe por una puerta de la base de datos y RESPONDE el resultado: aquí se lee y se DICE (nunca un «creada» que despues no llego).

var NOENC_ON = null, NOENC_TS = 0;
async function noEncOn() {

    var base = BORDE[LOCAL];
    var r = await fetch(base + '/salud', { cache: 'no-store' });
    var j = await r.json();
    NOENC_ON = !!(j && j.flags && String(j.flags.caja_no_encontrada_on) === '1');
  } catch (e) { NOENC_ON = false; }   // /salud mudo = apagado: ningún botón sin que el bordo lo diga
  return NOENC_ON;

var NOENC_TXT = {
  gia_contata: 'Ese sobre ya tiene un conteo — no se puede marcar como no encontrado.',
  busta_assente: 'Ese sobre no existe en el sistema.',
  non_no_encontrada: 'Ese sobre no estaba marcado como no encontrado.',
  no_encontrada_spento: 'Esto todavía no está activado. Avisa a Alberto.',
  porta_non_installata: 'Falta instalar una pieza en la base de datos. Avisa a Alberto.',
  porta_ha_rifiutato: 'La base de datos rechazó el gesto. Avisa a Alberto.',
  motivo_troppo_corto: 'Escribe el motivo con un poco más de detalle (mínimo 8 letras).',
  pg_no_responde: 'La base de datos no responde. Reintenta en un minuto.'

async function marcarNoEncontrada(sobre, evento, motivo) {
  var dia = sobre.dia || DIA_NOCHE;
  var clave = 'ne|' + evento + '|' + dia + '|' + sobre.sobre_nro + '|' + motivo;
  var r = await postCaja({ verbo: 'sobre_no_encontrada', uid_gesto: uidGestoEstable(clave, 'ne'),
    sobre_dia_op: dia, sobre_nro: sobre.sobre_nro, evento: evento, motivo: motivo, fuente: 'app_caja' });
  /* [10-ott · EL GIRO «UNA RIGA»] el uid nace del CONTENUTO (un reintento e' lo STESSO fatto), e UIDS_GESTO non si svuota mai: sulla stessa pagina, con lo stesso motivo,
     «persa → ritrovata → persa di nuovo» daba el MISMO uid y la puerta contestaba «gia»: no se escribia nada, la busta quedaba «encontrada» y la cajera leia «ya estaba anotado».
     Il uid vive SOLO finche' la risposta e' incerta (sin señal, base que no responde): con una risposta DEFINITIVA (ok o rifiuto) il fatto e' chiuso e il prossimo gesto e' nuovo. */
  var incerta = r.encolado || r.error === 'pg_no_responde' || r.motivo === 'pg_no_responde' || r.motivo === 'sin_red' || r.error === 'sin_red';

  MANANA.dejadas = MANANA.sobres.filter(function(s){ return DEJADAS[claveSobre(s)]; });

function pantalla7() {

}

/* ✏️ 09-ott · V28 (`CORTES SEI POINT GIORNO DEL SERVIZIO SOMMA`, `CORTES SN IN POSTGRES TOLLERANZA ZERO`): SEI Point, «Caja 1 … Caja 6» (el S/N vive en Postgres: tabla `caja_point`),
   el corte lleva el DIA QUE CIERRA (por defecto ayer, con la eleccion visible) y la comparacion es la JORNADA contra la SUMA de las maquinas: `pagos` no sabe que Point cobro.
   Tolerancia CERO, mostrada: toda diferencia ≠ 0 sale en ambar con la cifra y NO bloquea. Una fila vacia = esa maquina no se escribe (0 es un corte declarado). */
var DIA_CORTE = null;   // el dia que cierra el corte (null = ayer, DIA_NOCHE)
/* [10-ott · Alberto, via V28] las casillas de las maquinas en pesos con el separador de miles MIENTRAS se escribe (1.802.361). Solo se da formato a lo que ya es una cifra
   (digitos, $ . , espacios): lo demas se deja como esta, para que siga siendo INVALIDO y no un cero (punto (e) de BKP del 09-ott). */
function miles(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function milesDe(raw) {
  var r = String(raw == null ? '' : raw);
  if (!/^[\s$]*\d[\d.,\s]*$/.test(r)) return r;
  return miles(r.replace(/[^0-9]/g, '').replace(/^0+(?=\d)/, ''));
}
function milesInput(el) {
  el.addEventListener('input', function(){ var f = milesDe(el.value); if (f !== el.value) el.value = f; });
}
function diasDeCorte() { return [DIA_NOCHE, diaAnterior(DIA_NOCHE), DIA_HOY]; }
async function pantalla8() {
  if (!DIA_CORTE) DIA_CORTE = DIA_NOCHE;
  var dia = DIA_CORTE;
  app.innerHTML = barra(true) + '<p style="text-align:center;color:var(--ink2);padding:40px 0">Cargando cortes POS…</p>';
  CORTES = await getCaja('cortes_pos?dia=' + dia);
  if (!CORTES.ok) { renderError('Los cortes POS', CORTES.error); return; }
  /* el bordo viejo no entiende `dia_op` y escribiria el corte con el dia de HOY: la marca `puntos_fonte` dice que es el nuevo. Sin ella, no se guarda (se avisa). */
  var bordoNuevo = CORTES.puntos_fonte != null;
  var puntos = (CORTES.puntos && CORTES.puntos.length) ? CORTES.puntos : [1,2,3,4,5,6].map(function(n){ return { caja_n: n, nombre: 'Caja ' + n, sn: null }; });
  var filas = puntos.map(function(pt, i){
    var prev = (CORTES.guardado||[]).find(function(g){ return g.maquina === pt.nombre; });
    return '<p class="lb">' + esc(pt.nombre) + (pt.sn ? ' <small>S/N ' + esc(pt.sn) + '</small>' : '') + '</p>' +
      '<input class="inp" data-maq-corte="' + i + '" placeholder="$ (déjalo vacío si no se usó)" inputmode="numeric" value="' + (prev ? miles(prev.corte) : '') + '">';
  }).join('');
  var opcionesDia = diasDeCorte().filter(function(d, k, a){ return a.indexOf(d) === k; }).map(function(d){
    return '<option value="' + esc(d) + '"' + (d === dia ? ' selected' : '') + '>' + (d === DIA_NOCHE ? 'Ayer · ' : d === DIA_HOY ? 'Hoy · ' : '') + esc(fechaCorta(d)) + '</option>';
  }).join('');
  app.innerHTML = barra(true) +
    '<div class="kick">Los cortes POS</div><h1>Las máquinas</h1><p class="sd">Un número por máquina, para el día que cierra</p>' +
    '<p class="lb">Día del corte</p><select class="inp" id="diaCorte">' + opcionesDia + '</select>' +
    (bordoNuevo ? '' : '<div class="note bad"><b>El sistema todavía no acepta el día del corte</b><br>No se puede guardar hasta que se actualice. Avisa a Alberto.</div>') +
    filas +
    '<div id="comparacion"></div>' +
    '<div class="note ok">El corte de la máquina es <b>el único testigo que no somos nosotros.</b></div>' +
    '<button class="btn acc" id="guardar"' + (bordoNuevo ? '' : ' disabled') + '>Guardar</button>' +
    '<button class="btn gh" id="siguiente">Ir al depósito</button>';
  function valores() {
    return puntos.map(function(pt, i){
      var raw = String(document.querySelector('[data-maq-corte="' + i + '"]').value || '').trim();
      /* [09-ott · BKP (e) `un «-» o un «.» se volvia corte 0`] vacio = no se escribe; algo ESCRITO que no es una cifra (solo «-», solo «.», con letras o con signo menos) es INVALIDO (NaN): ya no se
         convierte en un 0 declarado. Aceptado: digitos con $ . , y espacios (separadores de miles). */
      var valida = raw !== '' && /^[\s$]*\d[\d.,\s]*$/.test(raw);
      return { pt: pt, raw: raw, v: raw === '' ? null : (valida ? Number(raw.replace(/[^0-9]/g, '')) : NaN) };
    });
  }
  /* la JORNADA contra la SUMA de las maquinas — tolerancia cero, ambar y sin bloquear */
  function comparar() {
    var vals = valores(), suma = 0, alguna = false;
    vals.forEach(function(x){ if (x.v !== null && Number.isFinite(x.v)) { suma += x.v; alguna = true; } });
    var box = document.getElementById('comparacion');
    if (CORTES.libro == null) { box.innerHTML = ''; return; }
    var dif = suma - CORTES.libro;
    box.innerHTML = '<div class="rows"><div class="r"><span class="n">Suma de las máquinas</span><span class="v">' + fmt(suma) + '</span></div>' +
      '<div class="r"><span class="n">Dice nuestro libro</span><span class="v">' + fmt(CORTES.libro) + '</span></div></div>' +
      (alguna && dif !== 0 ? '<div class="note ambar"><b>Diferencia ' + (dif > 0 ? '+' : '−') + fmt(Math.abs(dif)) + '</b><br>La suma de las máquinas no es igual al libro. Se guarda igual; queda para mirar.</div>' : '');
  }
  puntos.forEach(function(pt, i){ var el = document.querySelector('[data-maq-corte="' + i + '"]'); milesInput(el); el.addEventListener('input', comparar); });   // el formato va PRIMERO: comparar() lee el valor ya formateado (y lo parsea igual)
  comparar();
  document.getElementById('diaCorte').addEventListener('change', function(){ DIA_CORTE = document.getElementById('diaCorte').value; pantalla8(); });
  unTocoUnHecho(document.getElementById('guardar'), async function(){
    var vals = valores().filter(function(x){ return x.v !== null; });
    if (!vals.length) { toast('Escribe al menos un corte', 'bad'); return; }
    /* se validan TODAS antes de escribir la primera: una fila invalida no deja a medias a las demas */
    var mala = vals.filter(function(x){ return !Number.isFinite(x.v) || x.v < 0; })[0];
    if (mala) { toast('El corte de ' + mala.pt.nombre + ' no es un número', 'bad'); return; }
    for (var k = 0; k < vals.length; k++) {
      var x = vals[k];
      if (!Number.isFinite(x.v) || x.v < 0) { toast('Falta el corte de ' + x.pt.nombre, 'bad'); return; }
      var r = await postCaja({ verbo:'pos_corte', uid_gesto: uidGestoEstable('pos|' + dia + '|' + x.pt.nombre + '|' + x.v, 'pos'), maquina: x.pt.nombre, dia_op: dia,
        corte: x.v, firma_caja: SES.user, firma_caja_tipo:'pin', fuente:'app_caja' });
      if (!r.ok) { toast('No se guardó ' + x.pt.nombre + ': ' + r.motivo, 'bad'); return; }
    }
    /* [08-ott · V28 `CORTES GUARDAR NON AVANZA`] un guardado que no cambia de pantalla parece no haber funcionado: tras guardar todo, sigue sola al deposito. */
    toast('Cortes guardados', 'ok');
    PASO = 4; pantalla9();
  });
  document.getElementById('siguiente').onclick = function(){ PASO = 4; pantalla9(); };
}

async function pantalla9() {
  app.innerHTML = barra(true) + '<p style="text-align:center;color:var(--ink2);padding:40px 0">Cargando el depósito…</p>';
  var pend = await getCaja('deposito_pendiente?dia=' + DIA_HOY);
  DEPOSITO_PENDIENTE = pend.ok ? pend.salida_pendiente : null;

  /* 🔴 LIMITE DICHIARATO, non nascosto: si ella cierra la app entre la
     salida (ya escrita) y el sello de la reserva (reserva_sobre), al volver
     esta pantalla la manda directo a "De vuelta del banco" — la busta R
     queda pendiente y nadie lo avisa. Arreglarlo pide que
     /deposito_pendiente diga también si la reserva_sobre de esa salida ya
     existe. Lo declaro en vez de fingir que no puede pasar. */
  if (DEPOSITO_PENDIENTE) {
    app.innerHTML = barra(true) +
      '<div class="kick">El depósito</div><h1>De vuelta del banco</h1><p class="sd">Escribe el número cuando lo tengas</p>' +
      '<div class="rows"><div class="r tot"><span class="n">Depositaste</span><span class="v">' + fmt(DEPOSITO_PENDIENTE.a_depositar) + '</span></div></div>' +
      '<p class="lb">N° de depósito</p><input class="inp" id="nro" placeholder="Lo escribes cuando vuelves">' +
      '<button class="btn acc" id="cerrar">Guardar número de depósito</button>';
    unTocoUnHecho(document.getElementById('cerrar'), async function(){
      var nro = document.getElementById('nro').value.trim();
      if (!nro) { toast('Escribe el número de depósito', 'bad'); return; }
      var r = await postCaja({ verbo:'deposito', uid_gesto: uidGestoEstable('depv|' + DEPOSITO_PENDIENTE.uid_gesto + '|' + nro, 'dep'), evento:'vuelta',
        referencia_uid: DEPOSITO_PENDIENTE.uid_gesto, nro_deposito: nro,
        firma_caja: SES.user, firma_caja_tipo:'pin', fuente:'app_caja' });
      if (!r.ok) { toast('No se guardó: ' + r.motivo, 'bad'); return; }
      toast('Depósito cerrado', 'ok');
      PASO = 1; pantalla6();
    });
    return;
  }

  /* ✏️ 03-ott · _DECISIONI_PRESE.md «LA RITENUTA DEL 5% — BASE UNICA»: «il 5%
     si ritiene SOLO sul monto propinas NO efectivo» — tolto dal contante
     PRIMA del depósito (busta numerada a la caja fuerte ROJA, pieza aparte
     y no decidida todavía — pregunta ③ de DESIGN, responde Alberto). La
     base NUNCA es el contado: con los números reales la diferencia es de
     decenas de miles ($17.190 contra $41.290 en el ejemplo real).
     El "depósito al 100%" del 02-ott sigue siendo cierto para los gastos
     de propinas (se retiran del banco aparte): las dos órdenes conviven. */
  var RESERVA;
  if (MULTI && NOCHES.length) {
    /* la retención de cada noche se calcula como siempre (la propina NO efectivo de ESA noche, base única); el depósito junta las noches que contiene */
    RESERVA = { ok: true, reserva: 0, reserva_pct: null };
    for (var iN = 0; iN < NOCHES.length; iN++) {
      var rN = await getCaja('reserva?dia=' + NOCHES[iN]);
      if (!rN.ok || rN.reserva == null) { RESERVA = rN.ok ? { ok: true, reserva: null } : rN; break; }
      RESERVA.reserva += rN.reserva; RESERVA.reserva_pct = rN.reserva_pct;
    }
  } else {
    RESERVA = await getCaja('reserva?dia=' + DIA_NOCHE);
  }
  if (!RESERVA.ok || RESERVA.reserva == null) {
    app.innerHTML = barra(true) + '<div class="kick bad">El depósito</div><h1>Falta un parámetro</h1>' +
      '<div class="note bad">caja sin parámetro <b>propina_desc_no_efectivo_pct</b> — no se puede calcular la retención sin inventarlo. Avisa a MIGRACIÓN.</div>';
    return;
  }
  var contadoTotal = (MANANA && MANANA.sobres || []).reduce(function(a,s){ return a + (s.conteo ? s.conteo.contado : (s.declarado||0)); }, 0);
  /* [06-ott · pregunta de EL GIRO `ATTO II A MERCOLEDÌ 06:00`] una mañana SIN SOBRES (la noche anterior ATTO I estaba apagado o nadie
     retiró): no hay nada que depositar. Antes la pantalla ofrecía «Antes de salir» con contado 0 y una reserva > 0 ⇒ «Vas a
     depositar −$800» y un botón que salía al banco con un número negativo. Ahora lo dice y termina; el flujo NO se detiene. */
  if (!(contadoTotal > 0)) {
    app.innerHTML = barra(true) + '<div class="kick ok">El depósito</div><h1>Nada que depositar</h1>' +
      '<p class="sd">No hubo sobres que contar: no sale nada al banco.</p>' +
      '<button class="btn acc" id="finSinSobres">Listo</button>';
    document.getElementById('finSinSobres').onclick = function(){ PASO = 1; pantalla6(); };
    return;
  }
  app.innerHTML = barra(true) +
    '<div class="kick">El depósito</div><h1>Antes de salir</h1><p class="sd">Los dos números se escriben ahora</p>' +
    '<p class="lb">Contado (editable si hace falta)</p><input class="inp" id="contado" inputmode="numeric" value="' + contadoTotal + '">' +
    '<div id="calc"></div>' +
    ((((MANANA.noEnc || []).length + (MANANA.dejadas || []).length) > 0) ? '<div class="note bad"><b>' + ((MANANA.noEnc || []).length + (MANANA.dejadas || []).length) + ' sobre(s) NO van en este depósito</b><br>No encontrados o dejados para después. Si en realidad los llevas, vuelve y cuéntalos.</div>' : '') +
    '<div class="note">El camino al banco es el único tramo sin testigo. Por eso los números quedan escritos <b>antes</b> de que salgas.</div>' +
    '<button class="btn acc" id="salir">Salir al banco</button>';
  function recalc() {
    var c = Number(document.getElementById('contado').value || '') || 0;
    /* la retención es un PESO FIJO (de la propina no efectivo de anoche), no
       un porcentaje del contado: si ella ajusta el contado, cambia cuánto
       deposita, nunca cuánto se retiene. */
    var reserva = RESERVA.reserva;
    var aDep = c - reserva;
    document.getElementById('calc').innerHTML =
      '<div class="rows">' + (MULTI ? '<div class="r"><span class="n">Sobres que lleva</span><span class="v">' + (MANANA.sobres || []).length + ' · ' + NOCHES.length + (NOCHES.length === 1 ? ' noche' : ' noches') + '</span></div>' : '') +
      '<div class="r"><span class="n">A la reserva (' + RESERVA.reserva_pct + '% de la propina no efectivo' + (MULTI && NOCHES.length > 1 ? ' de esas noches' : '') + ')</span><span class="v">' + fmt(reserva) + '</span></div>' +
      '<div class="r tot"><span class="n">Vas a depositar</span><span class="v">' + fmt(aDep) + '</span></div></div>';
    /* [06-ott · pregunta de EL GIRO `ATTO II A MERCOLEDÌ 06:00`] un depósito NEGATIVO no existe: si el contado no cubre la
       reserva, el botón se apaga y la pantalla lo dice (el bordo lo rechazaría igual, `a_depositar_negativo`, pero DESPUÉS de que
       ella haya salido al banco sin saber por qué). */
    var btnSalir = document.getElementById('salir');
    if (btnSalir) btnSalir.disabled = aDep < 0;
    if (aDep < 0) document.getElementById('calc').innerHTML += '<div class="note bad"><b>El contado no cubre la reserva.</b><br>Revisa el contado: un depósito no puede ser negativo.</div>';
    return { c: c, reserva: reserva, aDep: aDep };
  }
  var ultimo = recalc();
  document.getElementById('contado').addEventListener('input', function(){ ultimo = recalc(); });
  unTocoUnHecho(document.getElementById('salir'), async function(){
    var depositoUid = uidGestoEstable('deps|' + DIA_HOY + '|' + ultimo.c + '|' + ultimo.reserva + '|' + ultimo.aDep, 'dep');
    var cuerpoSalida = { verbo:'deposito', uid_gesto: depositoUid, evento:'salida',
      contado: ultimo.c, reserva: ultimo.reserva, a_depositar: ultimo.aDep,
      firma_caja: SES.user, firma_caja_tipo:'pin', fuente:'app_caja' };
    /* en MULTI el depósito DICE qué sobres lleva (el bordo rechaza uno que ya está en otro depósito) */
    if (MULTI) cuerpoSalida.sobres = (MANANA.sobres || []).map(function (x) { return { nro: x.sobre_nro, dia: x.dia }; });
    var r = await postCaja(cuerpoSalida);
    if (!r.ok) { toast('No se guardó: ' + r.motivo, 'bad'); return; }
    /* ✏️ 03-ott · bacheca SPECIFICA BUSTA R-nnnn CAJA ROJA (DESIGN, orden de
       Alberto): si reserva === 0 la pantalla NO aparece — una busta vacía
       es peor que ninguna busta. Si hay reserva, se confirma AQUÍ, antes de
       salir, y pantalla9() se llama recién DESPUÉS de confirmada. */
    if (ultimo.reserva > 0) pantallaReservaSobre(depositoUid, ultimo.reserva);
    else { toast('Registrado. Escribe el N° de depósito cuando vuelvas', 'ok'); pantalla9(); }
  });
}

/* ② la pantalla de la busta R — tres cosas, cero mensajes (DESIGN): kick ·
   h1 · big · sobre, un solo botón. El sobre_nro lo EMITE el servidor en la
   misma respuesta del verbo 'reserva_sobre' (no una lectura antes): si lo
   coniara el cliente, un reintento generaría otro y la busta física
   llevaría un número que el libro no tiene. Por eso el número no puede
   estar en pantalla ANTES del toque — se escribe recién cuando llega,
   persistente (no un toast que se borra antes de que ella lo copie). */
function pantallaReservaSobre(depositoUid, monto) {
  app.innerHTML = barra(true) +
    '<div class="kick">La reserva</div><h1>A la caja fuerte ROJA</h1>' +
    '<p class="big acc">' + fmt(monto) + '</p>' +
    '<button class="btn acc" id="sellarRoja">A la caja fuerte ROJA</button>';
  unTocoUnHecho(document.getElementById('sellarRoja'), async function(){
    /* ✏️ 03-ott sera · EL GIRO (L1, `BANCO BUSTA R 7f2159c UN ROSSO LA RIGA`):
       un uid al azar a cada toque rompe el retry — si la primera respuesta
       se pierde pero la fila ya quedó escrita, un segundo toque con OTRO
       uid no se reconoce como el mismo gesto (gia_presenti): cae en la
       unicidad de negocio (segunda busta para la misma salida) y ella ve
       un rechazo confuso sobre una busta que ya existe. Derivado de
       depositoUid: el mismo depósito siempre pide la MISMA busta. */
    var r = await postCaja({ verbo:'reserva_sobre', uid_gesto: 'res-' + depositoUid,
      dia_op: (MULTI && NOCHES.length ? NOCHES[NOCHES.length - 1] : DIA_NOCHE), monto: monto, referencia_uid: depositoUid,
      firma_caja: SES.user, firma_caja_tipo:'pin', fuente:'app_caja' });
    if (!r.ok) { toast('No se guardó: ' + r.motivo, 'bad'); return; }
    app.innerHTML = barra(true) +
      '<div class="kick">La reserva</div><h1>A la caja fuerte ROJA</h1>' +
      '<p class="big acc">' + fmt(monto) + '</p>' +
      '<div class="rows"><div class="r tot"><span class="n">Sobre</span><span class="v">' + esc(r.sobre_nro || '—') + '</span></div></div>' +
      '<button class="btn acc" id="listo">Listo</button>';
    unTocoUnHecho(document.getElementById('listo'), async function(){ pantalla9(); });
  });
}

function renderError(titulo, error) {
  app.innerHTML = barra(false) + '<div class="kick bad">' + esc(titulo) + '</div><h1>No se pudo cargar</h1>' +
    '<div class="note bad">' + esc(error || 'sin_red') + '<br>Esta pantalla aún no tiene su lectura en el bordo — contrato pendiente, no es un error del teléfono.</div>' +
    '<button class="btn gh" id="retry">Reintentar</button>';
  document.getElementById('retry').onclick = async function(){
    if (!PIN_CAJA) await pedirPinCaja();
    [pantalla6,null,pantalla8,pantalla9][PASO-1]();
  };
}

/* ✏️ 03-ott · el PIN de la caja (BKP, `INTEGRACIÓN CAJA b50beda`): se pide
   UNA vez al abrir, vive solo en memoria (nunca localStorage — misma
   disciplina que el PIN del JL), y una respuesta pin_caja_invalido lo
   borra para que esta pantalla lo vuelva a pedir, nunca reintenta a ciegas. */
function pedirPinCaja() {
  return new Promise(function (resolve) {
    app.innerHTML = barra(false) +
      '<div class="kick">Tu PIN</div><h1>Antes de entrar</h1><p class="sd">El PIN de la caja, el mismo que usas en el panel</p>' +
      '<input class="inp" id="pin" inputmode="numeric" type="password" placeholder="••••" maxlength="8" autofocus>' +
      '<button class="btn acc" id="pinGo">Entrar</button>';
    function ir() {
      var v = document.getElementById('pin').value.trim();
      if (!v) { toast('Escribe tu PIN', 'bad'); return; }
      PIN_CAJA = v; resolve();
    }
    document.getElementById('pinGo').onclick = ir;
    document.getElementById('pin').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') ir(); });
  });
}

/* ¿En qué local estás? — solo los que tienen caja. Nunca elige por ti. */
function preguntarLocal() {
  return new Promise(function (resolve) {
    var ids = Object.keys(LOCALES_CAJA);
    app.innerHTML = barra(false) +
      '<div class="kick">Tu local</div><h1>¿En qué local estás?</h1><p class="sd">Elige el local de esta caja</p>' +
      ids.map(function (id) { return '<button class="btn acc" data-loc="' + id + '">' + esc(LOCALES_CAJA[id]) + '</button>'; }).join('');
    ids.forEach(function (id) {
      var b = app.querySelector('[data-loc="' + id + '"]');
      if (b) b.onclick = function () { resolve(id); };
    });
  });
}

/* ═══ 4 · ARRANQUE ══════════════════════════════════════════════════════ */
async function arrancar() {
  SES = (window.PinsitaAuth && PinsitaAuth.sesion && PinsitaAuth.sesion()) || { user:'?', role:'CAJA' };
  if (!LOCAL) {
    var delUsuario = String(SES.local || '').toLowerCase().trim();
    LOCAL = LOCALES_CAJA[delUsuario] ? delUsuario : await preguntarLocal();
  }
  await pedirPinCaja();
  flushCola();
  pantalla6();
}
if (window.PinsitaAuth) {
  PinsitaAuth.init({ local: 'todos', accent: '#8c6a20' });   // [08-ott · CAJERA LINK DIRETTO LOGIN SENZA MAYRA] con '*' la lista era solo la corporate (AAG, DC, KELE...): Mayra non c'era. 'todos' = la lista intera, ogni utente col suo local (come il portale); il PIN vero della caja e quello del bordo
  // init() de-rendering el overlay de login cuando hay sesión; arrancamos
  // igual: si no hay sesión, init() ya muestra el login y bloquea la UI.
  setTimeout(arrancar, 50);
} else {
  app.innerHTML = '<p style="color:var(--bad)">No se pudo cargar pinsita_auth.js</p>';
}
window.addEventListener('online', flushCola);
})();
</script>
