<!doctype html>
<!-- DEVICE-CLASS: 1 · cattura in movimento — è il TELEFONO DEL CLIENTE, mai un PC.
     ═══════════════════════════════════════════════════════════════════════════
     ⚡ PAGO EXPRESS · la pagina del cliente · SALA V18 · 31-ago-2026
     Ci si arriva SOLO dal QR che il mesero mostra in COBRAR (`sala.html`, passo
     `qr`, dietro `EXPRESS_ON` che oggi è SPENTO). Nessun link, nessun menù,
     nessuna porta dal portale: questa pagina non è un posto dove si passa.

     🔴 QUESTA PAGINA NON PUÒ ANCORA MOSTRARE UN CONTO VERO, ED È VOLUTO.
     Per leggere il conto servirebbe un verbo che non esiste (`getCuentaExpress`)
     e un token **emesso e verificato dal server**. Quello che il QR porta oggi
     nasce sul telefono del mesero: identifica un tavolo, **non lo difende**.
     ⇒ La via reale **fallisce chiusa**: dice che non è disponibile e finisce lì.
     ⇒ Con `?demo=1` gira tutta, su dati finti, per provarla sul telefono.
     *Una pagina che indovina il conto da ciò che c'è nell'indirizzo sarebbe una
     pagina che chiunque può far dire quello che vuole.*  -->

<style>
:root{
  --f:#0B1016; --f2:#111A22; --card:#16212B; --line:#243441;
  --ink:#F2F7FB; --ink2:#B9C7D4; --mut:#6E8093;
  --cy:#4FE8F8; --wa:#25D366; --am:#E0A94A; --gr:#3DD68C;
  --hueso:#EDEBE6; --hueso-ink:#1E2A33;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--f);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
body{min-height:100dvh;display:flex;flex-direction:column}
.bar{padding:12px 16px calc(12px + env(safe-area-inset-top));background:var(--f2);
  border-bottom:1px solid var(--line)}
.bar .top{font-size:11px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
.bar .mesa{font-size:19px;font-weight:700;margin-top:2px}
.bar .mesa b{color:var(--cy)}
main{flex:1;padding:16px;overflow-y:auto}
footer{padding:12px 16px calc(16px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--f2)}
h1{font-size:24px;font-weight:700;line-height:1.15;margin:0}
.lab{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mut);margin:16px 0 6px}
.lab:first-child{margin-top:0}
.sub{font-size:13.5px;color:var(--ink2)}
.gran{font-size:38px;font-weight:800;text-align:center;margin:10px 0 2px;
  font-variant-numeric:tabular-nums}
.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;
  font-size:15px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .p{font-variant-numeric:tabular-nums;color:var(--ink2)}
.res{background:rgba(224,169,74,.13);border:1.5px solid var(--am);border-radius:12px;
  padding:11px 13px;margin-top:12px;font-variant-numeric:tabular-nums}
.res .r{display:flex;justify-content:space-between;gap:10px;padding:2px 0;
  font-size:14px;color:var(--ink2)}
.res .r b{color:var(--ink);font-weight:600}
.res .fin{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px;
  padding-top:8px;border-top:1px solid rgba(224,169,74,.35)}
.res .fin span{font-size:14px;color:var(--ink2)}
.res .fin b{font-size:22px;font-weight:700;color:var(--am)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:1 1 calc(33% - 8px);background:var(--hueso);color:var(--hueso-ink);
  border:none;border-radius:12px;padding:12px 6px;text-align:center;font-size:16px;
  font-weight:600;min-height:56px;font-family:inherit;
  display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.chip small{display:block;font-size:12px;font-weight:500;color:#4A5A67;margin-top:2px}
.chip.dom{flex:1 1 calc(50% - 8px);min-height:0;padding:9px 6px;font-size:14px}
.chip.on{outline:2px solid var(--cy);outline-offset:1px}
.chip.oscuro{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.pick{width:100%;display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;
  color:var(--ink);font-size:15px;font-family:inherit;text-align:left;cursor:pointer}
.pick .tick{width:22px;height:22px;flex:0 0 22px;border-radius:6px;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent}
.pick.on .tick{background:var(--cy);border-color:var(--cy);color:#06222A}
.pick .nm{flex:1}
.pick .p{font-variant-numeric:tabular-nums;color:var(--ink2)}
.inp{width:100%;background:#0d1020;border:1.5px solid var(--line);border-radius:12px;
  color:var(--ink);padding:12px 14px;font-size:16px;outline:none;margin-top:7px;
  font-family:inherit;display:block}
.inp:focus{border-color:var(--cy)}
.cta{width:100%;background:var(--hueso);color:var(--hueso-ink);border:none;border-radius:13px;
  padding:15px;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer;
  display:block;margin-bottom:8px}
.cta small{display:block;font-size:13px;font-weight:500;opacity:.72;margin-top:2px}
.cta.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.cta[disabled]{opacity:.45}
.mini{background:rgba(79,232,248,.14);border:1px solid var(--line);color:var(--cy);
  border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;font-family:inherit;
  cursor:pointer;white-space:nowrap}
.wa{color:var(--wa);font-weight:600}
.cerrado{text-align:center;padding:32px 8px;color:var(--ink2);line-height:1.5}
.cerrado .ico{font-size:40px;display:block;margin-bottom:10px}
.idi{display:flex;gap:6px;justify-content:center;margin-top:14px}
.idi button{background:transparent;border:1px solid var(--line);color:var(--mut);
  border-radius:8px;padding:5px 10px;font-size:12px;font-family:inherit;cursor:pointer}
.idi button.on{color:var(--ink);border-color:var(--cy)}
.ver{text-align:center;font-size:11px;color:var(--mut);margin-top:18px}
</style>
<body>
<div class="bar">

<script>
/* la targhetta di versione: SOLO «nome vX.Y», niente altro. Serve a sapere se
   quello che si sta guardando è quello che abbiamo appena mandato. */
var VER = 'pago v0.1';

var QS = new URLSearchParams(location.search);
var LOC = (QS.get('l') || '').trim().toUpperCase();
var MESA = (QS.get('m') || '').trim();
var TOK = (QS.get('t') || '').trim();
var DEMO = QS.get('demo') === '1';

/* ═══ 🌐 LA LINGUA LA DETTA L'APPARECCHIO DEL CLIENTE ════════════════════════
   Il 44,9% dei telefoni che aprono la carta col QR sono brasiliani: un locale
   cileno non implica un cliente cileno. Il default esce da `navigator.language`,
   e resta un modo di cambiarla a mano — *un default automatico che non si può
   correggere è peggio di una domanda.* */
var L = (function () {
  try {
    var n = (navigator.language || 'es').toLowerCase();
    if (n.indexOf('pt') === 0) return 'pt';
    if (n.indexOf('en') === 0) return 'en';
  } catch (e) {}
  return 'es';
})();

var T = {
  es: { cuenta:'Tu cuenta', quePagas:'¿Qué pagas?', todo:'Pago todo', lomio:'👆 Pago lo mío',
        lomioSub:'elijo mis productos', iguales:'➗ Partes iguales', igualesSub:'dividimos entre varios',
        tocaTuyo:'Toca lo que es tuyo', tuParte:'Tu parte', entreCuantos:'¿Entre cuántos dividimos?',
        seguir:'Seguir', volver:'‹ Volver', tocaAlgo:'Toca al menos un producto',
        propina:'Propina', prop10:'10%', propOtro:'Otro', propNo:'Sin propina',
        propLab:'¿Dejas propina?', montoProp:'Monto de propina',
        datos:'¿Dónde te mandamos la boleta?', oCorreo:'o al correo',
        celPh:'tu celular', mailPh:'Email (opcional)', nomPh:'Tu nombre (opcional)',
        faltan:'faltan dígitos', continuar:'Continuar',
        comoPagas:'¿Cómo pagas?', banco:'Paga con tu banco', bancoSub:'transferencia · un toque',
        tarjeta:'Paga con tarjeta', tarjetaSub:'débito o crédito',
        totalPagar:'Total a pagar', consumo:'Consumo',
        listo:'Listo', pagaste:'Pagaste', boleta:'Tu boleta te llega', wa:'por WhatsApp',
        graciasV:'Gracias por visitarnos nuevamente', holaCon:'Hola',
        confirma:'¿Confirmas este número?', cambiar:'Cambiar', ok:'Listo',
        faltaMesa:'Falta de la mesa', noCerrar:'La mesa sigue abierta',
        cerradoTit:'Esta cuenta no está disponible',
        cerradoTxt:'Pídele al mesero que te muestre la cuenta. Puedes pagar con él como siempre.',
        vez2:'Gracias por visitarnos nuevamente' },
  pt: { cuenta:'Sua conta', quePagas:'O que você paga?', todo:'Pago tudo', lomio:'👆 Pago o meu',
        lomioSub:'escolho meus itens', iguales:'➗ Partes iguais', igualesSub:'dividimos entre vários',
        tocaTuyo:'Toque no que é seu', tuParte:'Sua parte', entreCuantos:'Entre quantos dividimos?',
        seguir:'Seguir', volver:'‹ Voltar', tocaAlgo:'Toque em pelo menos um item',
        propina:'Gorjeta', prop10:'10%', propOtro:'Outro', propNo:'Sem gorjeta',
        propLab:'Deixa gorjeta?', montoProp:'Valor da gorjeta',
        datos:'Para onde mandamos sua nota?', oCorreo:'ou para o e-mail',
        celPh:'seu celular', mailPh:'E-mail (opcional)', nomPh:'Seu nome (opcional)',
        faltan:'faltam dígitos', continuar:'Continuar',
        comoPagas:'Como você paga?', banco:'Pague com seu banco', bancoSub:'transferência · um toque',
        tarjeta:'Pague com cartão', tarjetaSub:'débito ou crédito',
        totalPagar:'Total a pagar', consumo:'Consumo',
        listo:'Pronto', pagaste:'Você pagou', boleta:'Sua nota chega', wa:'pelo WhatsApp',
        graciasV:'Obrigado por nos visitar novamente', holaCon:'Olá',
        confirma:'Confirma este número?', cambiar:'Alterar', ok:'Pronto',
        faltaMesa:'Falta da mesa', noCerrar:'A mesa continua aberta',
        cerradoTit:'Esta conta não está disponível',
        cerradoTxt:'Peça ao garçom para mostrar a conta. Você pode pagar com ele como sempre.',
        vez2:'Obrigado por nos visitar novamente' },
  en: { cuenta:'Your bill', quePagas:'What are you paying?', todo:'I pay everything', lomio:'👆 Just mine',
        lomioSub:'I pick my items', iguales:'➗ Split evenly', igualesSub:'between several of us',
        tocaTuyo:'Tap what is yours', tuParte:'Your share', entreCuantos:'How many ways?',
        seguir:'Continue', volver:'‹ Back', tocaAlgo:'Tap at least one item',
        propina:'Tip', prop10:'10%', propOtro:'Other', propNo:'No tip',
        propLab:'Leaving a tip?', montoProp:'Tip amount',
        datos:'Where do we send your receipt?', oCorreo:'or by email',
        celPh:'your phone', mailPh:'Email (optional)', nomPh:'Your name (optional)',
        faltan:'digits missing', continuar:'Continue',
        comoPagas:'How are you paying?', banco:'Pay with your bank', bancoSub:'transfer · one tap',
        tarjeta:'Pay by card', tarjetaSub:'debit or credit',
        totalPagar:'Total to pay', consumo:'Order',
        listo:'Done', pagaste:'You paid', boleta:'Your receipt is on its way', wa:'by WhatsApp',
        graciasV:'Thanks for coming back', holaCon:'Hi',
        confirma:'Is this number right?', cambiar:'Change', ok:'Done',
        faltaMesa:'Left on the table', noCerrar:'The table stays open',
        cerradoTit:'This bill is not available',
        cerradoTxt:'Ask your server to show you the bill. You can pay with them as always.',
        vez2:'Thanks for coming back' }
};
function t() { return T[L] || T.es; }

/* ═══ 📇 IL RICONOSCIMENTO VIVE NEL TELEFONO DEL CLIENTE ═════════════════════
   Non in una nostra tabella: **nel suo apparecchio**. È la forma più onesta di
   ciò che Alberto ha chiesto tutto il giorno — il riconoscimento si vede nel
   FARE (campi già pieni) e non si dichiara mai a parole. E se cancella i dati
   del browser, semplicemente non lo riconosciamo: nessun danno, nessuna traccia
   che sopravvive a un gesto suo.
   ⚠️ Questo NON sostituisce ciò che serve a 🎟 LA LISTA lato server: qui si
   decide solo COME DISEGNARE la schermata, non chi è il cliente per il locale. */
var YO = (function () {
  try { return JSON.parse(localStorage.getItem('pinsita_cli') || 'null') || null; }
  catch (e) { return null; }
})();
function guardaYo(o) {
  try { localStorage.setItem('pinsita_cli', JSON.stringify(o)); } catch (e) {}
}

/* ─── stato della sesión ─────────────────────────────────────────────────── */
var CUENTA = null;         // { items:[{n,q,pu}], total } — del servidor o del demo
var CERRADO = '';          // motivo por el que no se puede mostrar nada
var P = 0;                 // 0 cuenta · 1 lomio · 2 iguales · 3 propina · 4 datos · 5 pagar · 6 listo
var MODO = '';             // todo | lomio | iguales
var SEL = {};              // kk → true
var PARTES = 0;
var PROP = 10;             // 10 · 0 · número
var PROP_OTRO = 0;
var TEL = '', MAIL = '', NOM = '';
var PAIS = (L === 'pt') ? 'br' : 'cl';
var EDIT_TEL = false;

var PAISES = [{ k:'cl', f:'🇨🇱', c:'+56', cc:'56', n:9 },
              { k:'br', f:'🇧🇷', c:'+55', cc:'55', n:11 },
              { k:'ot', f:'🌎', c:'otro', cc:'', n:0 }];
function paisDe(k){ for (var i=0;i<PAISES.length;i++) if (PAISES[i].k===k) return PAISES[i]; return PAISES[0]; }

/* i tre helper già validati sul mockup, portati IDENTICI: il numero comanda
   sulla bandiera, e si legge come l'abbiamo capito prima di andare avanti. */
function normTel(v){
  var d = String(v||'').replace(/[^0-9]/g,'');
  if(!d) return { d:'', pais:PAIS, ok:false };
  var p = PAIS;
  for(var i=0;i<PAISES.length;i++){
    var x=PAISES[i];
    if(x.cc && d.indexOf(x.cc)===0 && d.length > x.cc.length + 6){ p=x.k; d=d.slice(x.cc.length); break; }
  }
  var pd = paisDe(p);
  if(pd.n) d = d.slice(-pd.n);
  return { d:d, pais:p, ok: pd.n ? d.length===pd.n : d.length>=7 };
}
function telBonito(x){
  var pd=paisDe(x.pais);
  if(!x.d) return '';
  if(x.pais==='cl' && x.d.length===9) return '+56 '+x.d[0]+' '+x.d.slice(1,5)+' '+x.d.slice(5);
  if(x.pais==='br' && x.d.length===11) return '+55 ('+x.d.slice(0,2)+') '+x.d.slice(2,7)+'-'+x.d.slice(7);
  return (pd.cc?'+'+pd.cc+' ':'')+x.d;
}
function telMasc(v){ var d=String(v||'').replace(/\D/g,''); return d.length<4 ? v : '•••• '+d.slice(-4); }

var DOMS=['gmail.com','hotmail.com','outlook.com','icloud.com'];
function locDe(m){ m=String(m||'').trim(); var i=m.lastIndexOf('@');
  return i<0 ? m : m.slice(0,i).replace(/@+$/,''); }
function domDe(m){ m=String(m||'').trim(); var i=m.lastIndexOf('@');
  return i<0 ? '' : m.slice(i+1).toLowerCase(); }

function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function clp(n){ return '$'+Math.round(n||0).toLocaleString('es-CL'); }

/* ─── los números ────────────────────────────────────────────────────────── */
function items(){ return (CUENTA && CUENTA.items) || []; }
function total(){ return (CUENTA && CUENTA.total) || 0; }
function mio(){
  var s=0; items().forEach(function(it){ if (SEL[it.kk]) s += (it.pu||0)*(it.q||1); });
  return s;
}
function parte(){
  if (MODO==='lomio')   return mio();
  if (MODO==='iguales') return PARTES ? Math.round(total()/PARTES) : 0;
  return total();
}
function propina(){
  if (PROP===0)  return 0;
  if (PROP==='otro') return PROP_OTRO;
  return Math.round(parte()*0.10);
}
function aPagar(){ return parte() + propina(); }

/* ═══════════════════════════════════════════════════════════════════════════
   🔴 DE DÓNDE SALE LA CUENTA — y por qué hoy no sale
   ───────────────────────────────────────────────────────────────────────────
   El verbo `getCuentaExpress` **no existe** todavía, y el token que trae el QR
   nace en el teléfono del mesero: sirve para *identificar* una mesa, no para
   *defenderla*. Mientras el servidor no emita y verifique ese token, esta
   página **no puede mostrar un consumo real** — y no lo va a inventar desde la
   URL, porque entonces cualquiera podría hacerle decir lo que quiera.
   ⇒ Falla CERRADA: dice que no está disponible y manda de vuelta al mesero,
   que es la vía que funciona siempre.                                        */
function cargaCuenta(cb) {
  if (DEMO) {
    CUENTA = { total: 47600, items: [
      { kk:'a', n:'Pinsa Trilogía',      q:1, pu:14900 },
      { kk:'b', n:'Pinsa Diavola',       q:1, pu:13200 },
      { kk:'c', n:'Negroni',             q:2, pu:6900  },
      { kk:'d', n:'Agua mineral',        q:1, pu:2800  },
      { kk:'e', n:'Tiramisú',            q:1, pu:2900  }
    ]};
    return cb();
  }
  if (!LOC || !MESA || !TOK) { CERRADO = 'falta'; return cb(); }
  CERRADO = 'sinverbo';
  cb();
}

/* ─── el dibujo ──────────────────────────────────────────────────────────── */
function pinta() {
  var b = '', f = '', ti = t();
  $('barMesa').innerHTML = CERRADO ? 'Pinsita'
    : (MESA ? 'Mesa <b>' + esc(MESA) + '</b>' : 'Pinsita');

  if (CERRADO) {
    b = '<div class="cerrado"><span class="ico">🙋</span>' +
        '<b style="color:var(--ink);font-size:17px">' + ti.cerradoTit + '</b><br>' +
        '<span style="font-size:14.5px">' + ti.cerradoTxt + '</span></div>';
    $('body').innerHTML = b; $('foot').innerHTML = ''; pintaIdi(); return;
  }

  /* ═══ 🔁 LA SEGUNDA VEZ ES UNA SOLA PANTALLA ══════════════════════════════
     Aprobada por Alberto el 31-ago: saludo · la cuenta desglosada · la pregunta
     por el número · pagar. Sin ninguna frase que diga que lo reconocimos: el
     reconocimiento se ve en los campos ya llenos, no se anuncia. */
  if (YO && YO.tel && P === 0) {
    var cons = total(), pr = Math.round(cons * 0.10);
    b = '<h1>' + (YO.nom ? ti.holaCon + ' ' + esc(YO.nom) : ti.graciasV) + '</h1>' +
        (YO.nom ? '<div class="sub" style="margin-top:4px">' + ti.graciasV + '</div>'
                : '<input class="inp" id="nom2" autocapitalize="words" autocomplete="given-name" ' +
                  'placeholder="' + ti.nomPh + '" onchange="dejaNombre(this.value)">') +
        '<div class="res">' +
          '<div class="lab" style="margin:0 0 6px">' + ti.cuenta + '</div>' +
          '<div class="r"><span>' + ti.consumo + '</span><b>' + clp(cons) + '</b></div>' +
          '<div class="r"><span>' + ti.propina + ' · 10%</span><b>' + clp(pr) + '</b></div>' +
          '<div class="fin"><span>' + ti.totalPagar + '</span><b>' + clp(cons + pr) + '</b></div>' +
        '</div>' +
        '<div class="res" style="background:rgba(79,232,248,.08);border-color:var(--line)">' +
          '<div class="lab" style="margin:0 0 6px">' + ti.confirma + '</div>' +
          '<div class="r"><span>🧾 ' + ti.boleta + '</span>' +
            '<b><span class="wa">✆ ' + ti.wa + '</span></b></div>' +
          (EDIT_TEL
            ? '<div class="r" style="gap:8px;padding-top:6px">' +
                '<input id="telIn" class="inp" type="tel" inputmode="tel" ' +
                  'style="flex:1;min-width:0;margin-top:0;padding:8px 10px" ' +
                  'value="' + esc(YO.tel) + '"><button class="mini" onclick="okTel()">' +
                  ti.ok + '</button></div>'
            : '<div class="r"><span>' + esc(telMasc(YO.tel)) + '</span>' +
                '<b><button class="mini" onclick="editTel()">' + ti.cambiar + '</button></b></div>') +
        '</div>';
    f = botonesPago();
    $('body').innerHTML = b; $('foot').innerHTML = f; pintaIdi();
    if (EDIT_TEL) { var e0 = $('telIn'); if (e0) { e0.focus(); } }
    return;
  }

  if (P === 0) {
    b = '<div class="lab">' + ti.cuenta + '</div><div class="rows">' +
        items().map(function (it) {
          return '<div class="row"><span>' + (it.q > 1 ? it.q + 'x ' : '') + esc(it.n) +
                 '</span><span class="p">' + clp((it.pu||0)*(it.q||1)) + '</span></div>';
        }).join('') + '</div>' +
        '<div class="gran">' + clp(total()) + '</div>' +
        '<div class="lab">' + ti.quePagas + '</div><div class="chips">' +
        '<button class="chip" onclick="ponModo(\'todo\')">' + ti.todo +
          '<small>' + clp(total()) + '</small></button>' +
        '<button class="chip" onclick="ponModo(\'lomio\')">' + ti.lomio +
          '<small>' + ti.lomioSub + '</small></button>' +
        '<button class="chip" onclick="ponModo(\'iguales\')">' + ti.iguales +
          '<small>' + ti.igualesSub + '</small></button></div>';
  }

  else if (P === 1) {
    b = '<div class="lab">' + ti.tocaTuyo + '</div>' +
        items().map(function (it) {
          return '<button class="pick' + (SEL[it.kk] ? ' on' : '') + '" onclick="tog(\'' + it.kk + '\')">' +
            '<span class="tick">✓</span><span class="nm">' + (it.q>1 ? it.q+'x ' : '') + esc(it.n) +
            '</span><span class="p">' + clp((it.pu||0)*(it.q||1)) + '</span></button>';
        }).join('') +
        '<div class="gran" style="font-size:30px">' + clp(mio()) + '</div>' +
        '<div class="sub" style="text-align:center">' + ti.faltaMesa + ' ' + clp(total()-mio()) + '</div>';
    f = '<button class="cta" onclick="ir(3)"' + (mio()>0 ? '' : ' disabled') + '>' +
          (mio()>0 ? ti.seguir + ' · ' + clp(mio()) : ti.tocaAlgo) + '</button>' +
        '<button class="cta sec" onclick="ir(0)">' + ti.volver + '</button>';
  }

  else if (P === 2) {
    b = '<div class="lab">' + ti.entreCuantos + '</div><div class="chips">' +
        [2,3,4,5,6,8].map(function (n) {
          return '<button class="chip' + (PARTES===n ? ' on' : '') + '" ' +
            'style="flex:1 1 calc(33% - 8px);font-size:20px" onclick="ponPartes(' + n + ')">' + n + '</button>';
        }).join('') + '</div>' +
        (PARTES ? '<div class="lab">' + ti.tuParte + '</div>' +
                  '<div class="gran" style="margin-top:0">' + clp(parte()) + '</div>' +
                  '<div class="sub" style="text-align:center">' + clp(total()) + ' ÷ ' + PARTES + '</div>' : '');
    f = '<button class="cta" onclick="ir(3)"' + (PARTES ? '' : ' disabled') + '>' +
          (PARTES ? ti.seguir + ' · ' + clp(parte()) : ti.entreCuantos) + '</button>' +
        '<button class="cta sec" onclick="ir(0)">' + ti.volver + '</button>';
  }

  else if (P === 3) {
    /* ═══ 🔴 «SI EL CLIENTE EMPIEZA A PONER CERO ESTAMOS PERDIDOS» ═══════════
       Orden de Alberto, 31-ago: **«Otro» va en el blanco y «Sin propina» en el
       negro.** Las tres puertas no pesan lo mismo y no deben parecer iguales:
       la que lleva a cero es la más angosta y la más apagada. No está
       escondida — está *disponible*, que es distinto. */
    b = '<div class="lab">' + ti.propLab + '</div>' +
        '<div class="gran">' + clp(parte()) + '</div>' +
        '<div class="sub" style="text-align:center">' + ti.tuParte + '</div>' +
        '<div class="chips" style="margin-top:16px">' +
          '<button class="chip' + (PROP===10 ? ' on' : '') + '" style="flex:1 1 calc(50% - 8px)" ' +
            'onclick="ponProp(10)">' + ti.prop10 + '<small>' + clp(Math.round(parte()*0.10)) + '</small></button>' +
          '<button class="chip' + (PROP==='otro' ? ' on' : '') + '" style="flex:1 1 calc(50% - 8px)" ' +
            'onclick="ponProp(\'otro\')">' + ti.propOtro + '</button>' +
          /* più stretta e centrata, non solo più scura: *«lasciando gli altri due
             più predominanti»*. La porta che porta a zero resta **disponibile e
             non nascosta** — ma non pesa quanto le altre. Nascondere una scelta
             legittima è peggio che offrirla piano: chi la cerca e non la trova
             chiama il mesero, e il canale express muore lì. */
          '<div style="flex:0 0 100%;display:flex;justify-content:center;margin-top:2px">' +
          '<button class="chip oscuro' + (PROP===0 ? ' on' : '') + '" ' +
            'style="flex:0 0 58%;min-height:0;padding:9px;font-size:14px" ' +
            'onclick="ponProp(0)">' + ti.propNo + '</button></div>' +
        '</div>' +
        (PROP==='otro'
          ? '<input class="inp" id="propIn" inputmode="numeric" placeholder="' + ti.montoProp + '" ' +
            'value="' + (PROP_OTRO||'') + '" oninput="escribeProp(this.value)">'
          : '');
    f = '<button class="cta" onclick="ir(4)">' + ti.continuar + ' · ' + clp(aPagar()) + '</button>';
  }

  else if (P === 4) {
    b = '<div class="lab">' + ti.datos + '</div>' +
        '<div class="sub"><span class="wa">✆ ' + ti.wa + '</span> ' + ti.oCorreo + '</div>' +
        '<div class="chips" style="margin:8px 0 2px">' +
          PAISES.map(function (p, i) {
            return '<button class="chip dom' + (PAIS===p.k ? ' on' : '') + '" ' +
              'style="flex:1 1 0;min-height:0;padding:8px 4px;font-size:13.5px" ' +
              'onclick="ponPais(\'' + p.k + '\')">' + p.f + ' ' + p.c + '</button>';
          }).join('') + '</div>' +
        '<input class="inp" id="tel" inputmode="tel" autocomplete="tel" placeholder="' + ti.celPh + '" ' +
          'value="' + esc(TEL) + '" oninput="ponTel(this.value)">' +
        '<div id="telEco" style="font-size:13px;margin-top:5px;min-height:18px;' +
          'font-variant-numeric:tabular-nums"></div>' +
        '<input class="inp" id="mail" inputmode="email" autocomplete="email" autocapitalize="off" ' +
          'spellcheck="false" placeholder="' + ti.mailPh + '" value="' + esc(MAIL) + '" ' +
          'oninput="escribeMail(this.value)">' +
        '<div class="chips" id="doms" style="margin-top:8px;display:' + (locDe(MAIL)?'flex':'none') + '">' +
          DOMS.map(function (d) {
            return '<button class="chip dom' + (domDe(MAIL)===d ? ' on' : '') + '" ' +
              'onclick="ponDom(\'' + d + '\')">@' + d + '</button>';
          }).join('') + '</div>' +
        '<input class="inp" id="nom" style="margin-top:10px" autocapitalize="words" ' +
          'autocomplete="given-name" placeholder="' + ti.nomPh + '" value="' + esc(NOM) + '" ' +
          'oninput="escribeNom(this.value)">';
    f = '<button class="cta" id="ctaDatos" onclick="ir(5)"' + (normTel(TEL).ok ? '' : ' disabled') + '>' +
          ti.continuar + '</button>';
  }

  else if (P === 5) {
    b = '<div class="gran">' + clp(aPagar()) + '</div>' +
        '<div class="sub" style="text-align:center">' + ti.propina + ' ' + clp(propina()) + '</div>' +
        '<div class="lab" style="margin-top:18px">' + ti.comoPagas + '</div>';
    f = botonesPago();
  }

  else if (P === 6) {
    /* ═══ 🔴 UN PAGO PARCIAL NO CIERRA LA MESA ══════════════════════════════
       Alberto, 31-ago: *«ho fatto un pago parcial, non si può chiudere il
       tavolo»*. La pantalla del cliente **no puede decir «mesa pagada»** cuando
       queda plata en el aire: los demás siguen sentados. */
    var falta = total() - parte();
    b = '<div style="text-align:center;padding:20px 0">' +
          '<div style="font-size:44px">✅</div>' +
          '<h1 style="margin-top:8px">' + ti.pagaste + ' ' + clp(aPagar()) + '</h1>' +
          '<div class="sub" style="margin-top:6px">🧾 ' + ti.boleta +
            ' <span class="wa">✆ ' + ti.wa + '</span></div>' +
          (falta > 0
            ? '<div class="res" style="margin-top:18px;text-align:left">' +
                '<div class="r"><span>' + ti.noCerrar + '</span>' +
                '<b>' + ti.faltaMesa + ' ' + clp(falta) + '</b></div></div>'
            : '') +
        '</div>';
  }

  $('body').innerHTML = b;
  $('foot').innerHTML = f;
  pintaIdi();
  if (P === 4) { pintaEco(); }
}

function botonesPago() {
  var ti = t();
  /* ═══ 🔴 FINTOC CONECTA BANCOS CHILENOS ═════════════════════════════════════
     A quien no tiene uno, «paga con tu banco» no le falla después: **no puede
     funcionar nunca**. El brasileño de la mesa de al lado no tiene cuenta acá.
     ⇒ la vía del banco se ofrece solo a 🇨🇱 y a «otro»; al resto, tarjeta.
     ⚠️ Hoy NINGUNA de las dos cobra: Fintoc no está conectado. El botón lo dice
     en vez de fingir — *un botón que no hace nada enseña que la función no
     sirve, y esa lección no se borra después.* */
  var banco = (PAIS === 'cl' || PAIS === 'ot');
  return '<button class="cta" onclick="paga()">' +
           (banco ? ti.banco + '<small>' + ti.bancoSub + '</small>'
                  : ti.tarjeta + '<small>' + ti.tarjetaSub + '</small>') +
         '</button>';
}

function pintaIdi() {
  var f = $('foot');
  if (P === 6 || CERRADO) return;
  f.innerHTML += '<div class="idi">' +
    [['es','ES'],['pt','PT'],['en','EN']].map(function (x) {
      return '<button class="' + (L===x[0]?'on':'') + '" onclick="setL(\'' + x[0] + '\')">' + x[1] + '</button>';
    }).join('') + '</div>' +
    '<div class="ver" id="ver">' + VER + '</div>';
}

/* ═══ ⌨️ AQUÍ NO SE REDIBUJA MIENTRAS SE ESCRIBE ═════════════════════════════
   Bug encontrado por Alberto en el mockup: escribir el correo borraba el
   teléfono. No era el estado — era el REDIBUJO: `innerHTML` destruye el input
   y con él todo lo que el navegador le había puesto dentro (autocompletado,
   composición del teclado, foco). Se enciende y se apaga lo que cambia. */
function pintaEco() {
  var e = $('telEco'); if (!e) return;
  var x = normTel(TEL);
  e.innerHTML = x.d ? (x.ok
    ? '<span style="color:var(--wa)">✆ ' + telBonito(x) + '</span>'
    : '<span style="color:var(--mut)">' + telBonito(x) + ' · ' + t().faltan + '</span>') : '';
  var c = $('ctaDatos'); if (c) { if (x.ok) c.removeAttribute('disabled'); else c.setAttribute('disabled',''); }
}
function pintaDoms() {
  var d = $('doms'); if (!d) return;
  d.style.display = locDe(MAIL) ? 'flex' : 'none';
  var actual = domDe(MAIL);
  [].forEach.call(d.children, function (b, i) {
    b.className = 'chip dom' + (DOMS[i] === actual ? ' on' : '');
  });
}
function ponTel(v){ TEL = v; var x = normTel(v); if (x.pais !== PAIS) { PAIS = x.pais; pintaPaises(); } pintaEco(); }
function ponPais(k){ PAIS = k; pintaPaises(); pintaEco(); }
function pintaPaises(){
  var c = document.querySelectorAll('.chip.dom');
  /* las banderas son los 3 primeros `.chip.dom` de la pantalla de datos */
  for (var i = 0; i < PAISES.length && i < c.length; i++) {
    c[i].className = 'chip dom' + (PAIS === PAISES[i].k ? ' on' : '');
  }
}
function escribeMail(v){ MAIL = v; pintaDoms(); }
function escribeNom(v){ NOM = v; }
function escribeProp(v){ PROP_OTRO = parseInt(String(v).replace(/\D/g,''),10) || 0; }
function ponDom(d){
  var loc = locDe(MAIL); if (!loc) return;      // nunca fabricar «@gmail.com»
  MAIL = loc + '@' + d;
  var e = $('mail'); if (e) e.value = MAIL;
  pintaDoms();
}
function setL(x){ L = x; pinta(); }
function ponModo(m){ MODO = m; SEL = {}; PARTES = 0; P = (m==='lomio') ? 1 : (m==='iguales' ? 2 : 3); pinta(); }
function tog(k){ SEL[k] = !SEL[k]; pinta(); }
function ponPartes(n){ PARTES = n; pinta(); }
function ponProp(p){ PROP = p; pinta(); }
function ir(p){ P = p; pinta(); }
function editTel(){ EDIT_TEL = true; pinta(); }
function okTel(){ var e = $('telIn'); if (e && normTel(e.value).ok) { YO.tel = e.value; guardaYo(YO); }
  EDIT_TEL = false; pinta(); }
function dejaNombre(v){ v = (v||'').trim(); if (!v) return; YO.nom = v; guardaYo(YO); pinta(); }

/* ═══ 🔴 EL PAGO NO EXISTE TODAVÍA — Y LO DICE ══════════════════════════════
   Fintoc no está conectado y no hay verbo que registre el pago. Este botón
   **no finge**: avisa y deja al cliente en manos del mesero, que es la vía que
   sí funciona. En demo salta a la pantalla final para poder mirarla.
   ⚠️ Cuando se conecte, aquí van juntos los tres campos que 💰 DINERO tiene
   pendientes — `pago_uid` (la llave de idempotencia, que **nace en el cliente**,
   nunca en el servidor) · `monto` · `parcial` — y se encienden **a la vez**:
   uno sin los otros escribe pagos que nadie puede reconciliar. */
function paga() {
  if (DEMO) {
    guardaYo({ tel: TEL || (YO && YO.tel) || '', nom: NOM || (YO && YO.nom) || '' });
    P = 6; pinta(); return;
  }
  alert(t().cerradoTxt);
}

/* ─── arranque ───────────────────────────────────────────────────────────── */
cargaCuenta(function () { pinta(); });
</script>
