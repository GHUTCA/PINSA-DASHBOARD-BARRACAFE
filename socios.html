<script>
(function () {
'use strict';
var BORDE = 'https://pinsita-borde.alberto-agostini.workers.dev';
var CARGOS = ['SOCIO', 'GG'];
var DEMO = /[?&]demo=1\b/.test(location.search);
var HIST_2025 = { '01':250054470,'02':194157027,'03':237826547,'04':214927080,'05':222119098,'06':224763740,
  '07':378198057,'08':404119601,'09':214083609,'10':208564834,'11':202753468,'12':168168505 }; // BKS Control, cifra mensual
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DOW = ['dom','lun','mar','mié','jue','vie','sáb'];
var DOWL = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var app = document.getElementById('app');

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function peso(n){ return '$' + Math.round(n).toLocaleString('es-CL'); }
function mill(n){ return '$' + (n/1e6).toLocaleString('es-CL',{minimumFractionDigits:1,maximumFractionDigits:1}) + 'M'; }
function pct(a,b){ if(!(b>0)) return null; var p=Math.round((a/b-1)*100); return p; }
function dpct(a,b,lbl){ var p=pct(a,b); if(p===null) return ''; var c=p>0?'up':(p<0?'down':''); return '<span class="'+c+'">'+(p>0?'+':'')+(p===0?'=':p+'%')+' '+lbl+'</span>'; }
// fechas: 'AAAA-MM-DD' en UTC puro (aritmética de calendario, sin husos)
function ymd(d){ return d.toISOString().slice(0,10); }
function addDias(s,n){ var d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return ymd(d); }
function dow(s){ return new Date(s+'T00:00:00Z').getUTCDay(); }
function diaOperativoHoy(){ // el día operativo en curso en Santiago (06:00→06:00)
  return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Santiago',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(Date.now()-6*3600e3));
}
function diasDelMes(mes){ var y=+mes.slice(0,4), m=+mes.slice(5,7); return new Date(Date.UTC(y,m,0)).getUTCDate(); }
function fechaLarga(s){ return DOWL[dow(s)] + ' ' + s.slice(8,10) + '-' + s.slice(5,7); }

// ── DEMO · números reales del 04-nov-2026 (PG, 05-nov) ──
var DEMO_HOY = '2026-11-05';
var DEMO_RES = { ok:true, local:'BKS', dia:'2026-11-04', righe:[
  {k:'sem', dia:'2026-10-28', pedidos:212, venta:4043260, venta_am:1810930, mesas:50, boletas:98, cobrado:3709676, propina:369267},
  {k:'ayer',dia:'2026-11-03', pedidos:221, venta:4059590, venta_am:1445010, mesas:53, boletas:94, cobrado:3723224, propina:363810},
  {k:'hoy', dia:'2026-11-04', pedidos:195, venta:3848410, venta_am:1734120, mesas:48, boletas:98, cobrado:3725112, propina:366745}]};
var DEMO_MES = { ok:true, local:'BKS', mes:'2026-11', righe:{ meta:240000000,
  normal:[5328188,2950448,2926109,4182664,6415939,11060032,14000790],
  dias:[{dia:'2026-10-29',total:6415939},{dia:'2026-10-30',total:11330784},{dia:'2026-10-31',total:14882414},
        {dia:'2026-11-01',n:114,total:5581476},{dia:'2026-11-02',n:82,total:3500712},{dia:'2026-11-03',n:89,total:3723224},{dia:'2026-11-04',n:95,total:3725112}],
  meses:[{mes:'2026-08',total:33047184},{mes:'2026-09',total:232192344},{mes:'2026-10',total:221743862}] } };
// demo: 1→7 de octubre (4 semanas antes de 29-oct→4-nov), boletas por día operativo puro (soci_mes de octubre)
var DEMO_SOMBRA = {'2026-10-01':6541508,'2026-10-02':10883104,'2026-10-03':14077302,'2026-10-04':4833540,
  '2026-10-05':2114326,'2026-10-06':1899530,'2026-10-07':4426868};
// Las boletas en PG empiezan el 29-ago-2026: un mes anterior a éste es PARCIAL y no se compara (🚚 MIGRA, 05-nov).
var PRIMER_MES_COMPLETO = { BKS:'2026-09' };
// la respuesta de /socios/mes (righe = el jsonb de soci_mes) en la forma que pinta tarjetasMes
function leerMes(r, hoy){
  var o=(r&&r.righe)||{};
  if(Array.isArray(o) || typeof o!=='object') throw {code:'forma_mes'};   // otra forma: no se pinta a medias
  var normal=o.normal;
  if(typeof normal==='string'){ try{ normal=JSON.parse(normal.replace(/^\{/,'[').replace(/\}$/,']')); }catch(e){ normal=null; } }
  if(!(Array.isArray(normal) && normal.length===7)) normal=null;
  var dias=(o.dias||[]).map(function(x){ return {dia:String(x.dia).slice(0,10), n:+x.n, total:+x.total}; })
    .filter(function(d){ return d.dia<hoy; });
  var meses=(o.meses||[]).map(function(x){ return {mes:String(x.mes).slice(0,7), total:+x.total}; })
    .filter(function(x){ var p=PRIMER_MES_COMPLETO[String(r.local||'').toUpperCase()]; return x.mes<hoy.slice(0,7) && !(p && x.mes<p); });
  return { ok:true, local:r.local, mes:r.mes||hoy.slice(0,7), meta:(o.meta==null?null:+o.meta), normal:normal, dias:dias, meses:meses };
}

function pedir(ruta){
  var f = (window.PinsitaAuth && PinsitaAuth.firma()) || '';
  if (!f) return Promise.reject({code:'firma'});
  var ctl = window.AbortController ? new AbortController() : null;
  var tm = setTimeout(function(){ if(ctl) ctl.abort(); }, 8000);
  return fetch(BORDE + ruta, { headers:{'X-Firma':f}, cache:'no-store', signal: ctl?ctl.signal:undefined })
    .then(function(r){ clearTimeout(tm); return r.json().catch(function(){ return {ok:false,error:'http_'+r.status}; })
      .then(function(j){ if(!r.ok || !j || j.ok===false) throw {code:(j&&j.error)||('http_'+r.status)}; return j; }); });
}

function tarjetaAyer(res){
  var R={}; (res.righe||[]).forEach(function(r){ R[r.k]=r; });
  var h=R.hoy;
  if(!h || !(+h.pedidos>0) || !(+h.boletas>0)) return '<div class="card"><h2>Ayer</h2><div class="mute">Datos incompletos para '+esc(res.dia)+': no muestro cifras a medias.</div></div>';
  function ok(r){ return r && +r.pedidos>0 && +r.boletas>0 ? r : null; }
  var a=ok(R.ayer), s=ok(R.sem), omit=[];
  if(!a) omit.push('ayer'); if(!s) omit.push('la semana pasada');
  function cmp(campo, f){ var v=f?f(h):+h[campo]; return [a?dpct(v, f?f(a):+a[campo],'vs ayer'):'', s?dpct(v, f?f(s):+s[campo],'vs '+DOW[dow(s.dia)]+'. pasado'):''].filter(Boolean).join(' · '); }
  var tk=function(r){ return +r.boletas? +r.cobrado/+r.boletas : 0; };
  return '<div class="card"><h2>Ayer · '+esc(fechaLarga(h.dia))+'</h2>'
    +'<div class="big">'+peso(+h.cobrado)+'</div><div class="mute">Cobrado (boletas) · '+cmp('cobrado')+'</div>'
    +'<div style="margin-top:10px">'
    +'<div class="row"><span>Consumo (pedidos)<br><span class="mute">'+cmp('venta')+'</span></span><b>'+peso(+h.venta)+'</b></div>'
    +'<div class="row"><span>Consumo almuerzo (hasta 19:00)</span><b>'+peso(+h.venta_am)+'</b></div>'
    +'<div class="row"><span>Consumo noche</span><b>'+peso(+h.venta - +h.venta_am)+'</b></div>'
    +'<div class="row"><span>Boletas · ticket medio<br><span class="mute">'+cmp(null,tk)+'</span></span><b>'+(+h.boletas)+' · '+peso(tk(h))+'</b></div>'
    +'<div class="row"><span>Propina</span><b>'+peso(+h.propina)+' · '+(+h.cobrado? (100*h.propina/h.cobrado).toLocaleString('es-CL',{maximumFractionDigits:1}) : '—')+'%</b></div>'
    +'<div class="row"><span>Pedidos · mesas</span><b>'+(+h.pedidos)+' · '+(+h.mesas)+'</b></div>'
    +'</div>'+(omit.length?'<div class="mute" style="margin-top:6px">Sin comparación con '+omit.join(' ni ')+': ese día tiene datos incompletos.</div>':'')+'</div>';
}

function tarjetasMes(m, hoy){
  var mes=m.mes, nd=diasDelMes(mes), act={}, out='';
  (m.dias||[]).forEach(function(d){ act[d.dia]=+d.total; });
  var dias=[]; for(var i=1;i<=nd;i++) dias.push(mes+'-'+(i<10?'0':'')+i);
  var hechos=dias.filter(function(d){ return d<hoy; }), faltan=dias.filter(function(d){ return d>=hoy; });
  var sinDato=hechos.filter(function(d){ return !(d in act); });
  var vendido=hechos.reduce(function(s,d){ return s+(act[d]||0); },0);
  var N=m.normal && m.normal.length===7 ? m.normal : null;
  var normalDe=function(d){ return N? +N[dow(d)] : 0; };
  var restoNormal=faltan.reduce(function(s,d){ return s+normalDe(d); },0);
  var meta=+m.meta||0, factor= (meta && restoNormal) ? Math.max(0,(meta-vendido)/restoNormal) : null;
  var aviso= sinDato.length ? '<div class="mute" style="margin-top:6px">⚠️ Sin datos de '+sinDato.map(function(d){return d.slice(8);}).join(', ')+': el vendido es parcial.</div>' : '';
  // ② el mes contra la meta
  var c='<div class="card"><h2>'+MESES[+mes.slice(5,7)-1]+(meta?' · meta '+mill(meta):'')+'</h2>'
    +'<div class="big">'+mill(vendido)+' <span class="mute" style="font-size:14px;font-weight:400">'+(hechos.length?'al '+hechos[hechos.length-1].slice(8)+'-'+mes.slice(5):'aún sin días cerrados')+'</span></div>';
  if(meta){
    var debido = N ? meta*hechos.reduce(function(s,d){return s+normalDe(d);},0)/dias.reduce(function(s,d){return s+normalDe(d);},0) : meta*hechos.length/nd;
    c+='<div class="prog"><i style="width:'+Math.min(100,100*vendido/meta).toFixed(1)+'%"></i><em style="left:'+Math.min(99.5,100*debido/meta).toFixed(1)+'%"></em></div>'
      +'<div class="mute">Barra = vendido · línea = dónde deberíamos estar hoy para llegar a la meta ('+mill(debido)+')</div>';
  }
  c+='<div style="margin-top:10px">';
  if(N) c+='<div class="row"><span>Si seguimos como un día normal</span><b>'+mill(vendido+restoNormal)+'</b></div>';
  if(meta) c+='<div class="row"><span>Meta</span><b>'+mill(meta)+'</b></div>';
  if(factor!==null && faltan.length) c+='<div class="row"><span>Hoy '+DOWL[dow(hoy)]+' hay que vender</span><b>'+mill(normalDe(hoy)*factor)+'</b></div>';
  if(factor!==null && faltan.length) c+='<div class="row"><span>Cada día, sobre un día normal</span><b>'+(factor>=1?'+':'')+Math.round((factor-1)*100)+'%</b></div>';
  c+='</div>'+aviso+(N?'':'<div class="mute" style="margin-top:6px">Sin «día normal» cargado: no hay proyección.</div>')+'</div>';
  out+=c;
  // ③ semanas (lunes→domingo) dentro del mes
  if(meta && N){
    var sem=[], cur=null;
    dias.forEach(function(d){ if(!cur || dow(d)===1){ cur={desde:d,hasta:d,v:0,nv:0,meta:0}; sem.push(cur);} cur.hasta=d;
      if(d<hoy){ cur.v+=act[d]||0; cur.nv++; cur.meta+=act[d]||0; } else cur.meta+=normalDe(d)*factor; });
    var t='<div class="card"><h2>Semanas de '+MESES[+mes.slice(5,7)-1]+'</h2><table><tr><th>Semana</th><th>Vendido</th><th>Meta</th></tr>';
    sem.forEach(function(s){ var n=dias.indexOf(s.hasta)-dias.indexOf(s.desde)+1;
      t+='<tr><td>'+(+s.desde.slice(8))+(s.desde===s.hasta?'':'–'+(+s.hasta.slice(8)))+'</td><td>'+(s.nv?mill(s.v)+(s.nv<n?' <span class="mute">('+s.nv+' d)</span>':''):'—')+'</td><td>'+mill(s.meta)+'</td></tr>'; });
    out+=t+'</table></div>';
  }
  // ④ últimos 7 días operativos, cada uno contra el MISMO día de la semana 4 semanas antes (Alberto, 05-nov:
  //    «non si capisce quanto si vende»). Mié contra mié: un sábado contra un martes miente.
  //    Los días de 4 semanas antes vienen de soci_mes de su mes (m.sombra, pedido aparte en pintar).
  var u=[]; for(var k=7;k>=1;k--) u.push(addDias(hoy,-k));
  var sb=m.sombra||{};
  var vals=[]; u.forEach(function(d){ if(act[d]!=null) vals.push(act[d]); var s=sb[addDias(d,-28)]; if(s!=null) vals.push(s); });
  var mx=Math.max.apply(null,vals.concat([1]));
  var col=function(d){
    var v=act[d], d4=addDias(d,-28), s=sb[d4], p=(v!=null&&s>0)?pct(v,s):null;
    var h=function(x){ return (x==null?0:Math.max(2,100*x/mx)).toFixed(0)+'%'; };
    return '<div class="dcol">'
      +'<div class="dval">'+(v==null?'—':mill(v).slice(1))+'</div>'
      +'<div class="dbars">'
        +(v==null?'<i class="nd" style="height:100%" title="sin dato"></i>':'<i class="'+((dow(d)===5||dow(d)===6)?'hi':'')+'" style="height:'+h(v)+'" title="'+esc(fechaLarga(d))+' · '+peso(v)+'"></i>')
        +(s==null?'<i class="nd" style="height:100%" title="sin dato hace 4 semanas"></i>':'<i class="sh" style="height:'+h(s)+'" title="'+esc(fechaLarga(d4))+' · '+peso(s)+'"></i>')
      +'</div>'
      +'<div class="dlbl">'+DOW[dow(d)]+' '+(+d.slice(8))+'</div>'
      +'<div class="dpct '+(p>0?'up':(p<0?'down':''))+'">'+(p===null?'—':(p>0?'+':'')+(p===0?'=':p+'%'))+'</div>'
      +'</div>'; };
  var tv=u.reduce(function(a,d){return a+(act[d]||0);},0), ts=u.reduce(function(a,d){return a+(sb[addDias(d,-28)]||0);},0);
  var completa=u.every(function(d){ return act[d]!=null && sb[addDias(d,-28)]!=null; });
  out+='<div class="card"><h2>Últimos 7 días · contra 4 semanas antes</h2>'
    +'<div class="d7">'+u.map(col).join('')+'</div>'
    +'<div class="mute" style="margin-top:8px"><span class="sw"></span> el día · <span class="sw sh"></span> el mismo día de la semana, 4 semanas antes · cifras en millones</div>'
    +(completa?'<div class="row" style="margin-top:6px"><span>La semana: '+mill(tv)+' contra '+mill(ts)+'</span><b class="'+(tv>ts?'up':(tv<ts?'down':''))+'">'+(pct(tv,ts)>0?'+':'')+pct(tv,ts)+'%</b></div>'
      :'<div class="mute" style="margin-top:6px">Faltan días para comparar la semana entera.</div>')
    +'</div>';
  // ⑤ meses cerrados contra 2025
  var ms=(m.meses||[]).slice(-3);
  if(ms.length){
    var tb='<div class="card"><h2>Meses</h2><table><tr><th>Mes</th><th>2026</th><th>2025</th><th>Var.</th></tr>';
    ms.forEach(function(x){ var h=HIST_2025[x.mes.slice(5,7)], p=x.mes.slice(0,4)==='2026'&&h?pct(+x.total,h):null;
      tb+='<tr><td>'+MESES[+x.mes.slice(5,7)-1]+'</td><td>'+mill(+x.total)+'</td><td>'+(h?mill(h):'—')+'</td><td class="'+(p>0?'up':(p<0?'down':''))+'">'+(p===null?'—':(p>0?'+':'')+p+'%')+'</td></tr>'; });
    var h1=HIST_2025[mes.slice(5,7)];
    tb+='<tr><td>'+MESES[+mes.slice(5,7)-1]+'</td><td>en curso</td><td>'+(h1?mill(h1):'—')+'</td><td>—</td></tr></table>'
      +'<div class="mute" style="margin-top:6px">2026 = boletas emitidas, día de 06:00 a 06:00. 2025 = cifra mensual de BKS Control (otra fuente).</div></div>';
    out+=tb;
  }
  return out;
}

// ── HOY · el panel del día (v1.2.0, 08-nov · mockup validado por Alberto: REPORTES/MOCKUP_SOCIOS_HOY_08NOV2026.html) ──
// Lee GET /socios/hoy (una fila de pinsita.soci_hoy). Pinta SOLO los campos que llegan: por_cobrar, venta_sp, boletas(_sp),
// cierre_sp y curva son de soci_hoy v2 — sin ellos el panel sale con lo que hay, nunca con un número inventado.
// Leva apagada (404 leva_spenta) => el panel no aparece y el resto de Socios queda igual.
var DEMO_HOYP = { ok:true, local:'BKS', dia:'2026-11-07', leido_ts:'2026-11-08T01:00:00.000Z', righe:[{ // sábado 7-nov a las 22:00 (PG, 08-nov)
  venta:'4723716', cuentas_hoy:136, vivas:22, vivas_viejas:6, cerradas:113, pagado_cerradas:'4723716', max4s:83, max4s_estimado:true,
  por_cobrar:'821540', venta_sp:'3609932', boletas:129, boletas_sp:83, cierre_sp:'15393784',
  curva:{hoy:[0,0,0,0,0,0,0,300630,619168,1372938,1917078,2472324,3196306,3660976,4364476,4723716,5238546,6671066,7964686,9697856,11847806,11847806,11847806,11847806],
         sp:[0,0,0,0,0,0,0,66740,471494,1441664,1811712,2206698,2627642,2889282,3229112,3609932,4783864,7223214,8574874,9953144,13760704,14438704,15393784,15393784]} }]};
function num(v){ return v==null||v===''? null : +v; }
function hhmm(iso){ return new Date(iso).toLocaleTimeString('es-CL',{timeZone:'America/Santiago',hour:'2-digit',minute:'2-digit',hour12:false}); }
function horasDesde6(iso){ var p=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Santiago',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(iso)).split(':');
  var h=(+p[0]+24-6)%24; return h + (+p[1])/60; }
function anillo(p){ var r=22,c=2*Math.PI*r,f=Math.max(0,Math.min(1,p/100));
  return '<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="7"/>'
   +'<circle cx="28" cy="28" r="'+r+'" fill="none" stroke="var(--hot)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(c*f)+' '+c+'" transform="rotate(-90 28 28)"/></svg>'; }
function curvaOk(c){ return c && Array.isArray(c.hoy) && Array.isArray(c.sp) && c.hoy.length===24 && c.sp.length===24; }
function graficoHoy(cv, venta, el, lblSp){
  var HOY=cv.hoy.map(Number), SP=cv.sp.map(Number);
  var W=520,H=170,L=8,R=8,T=12,B=22,n=24, top=Math.max(SP[23],venta,1)*1.08;
  function x(i){return L+(W-L-R)*(i+1)/n;} function xh(hr){return L+(W-L-R)*hr/n;} function y(v){return T+(H-T-B)*(1-v/top);}
  var k=Math.max(0,Math.min(24,Math.floor(el)));   // horas completas desde las 06:00
  var paso=top>12e6?5e6:(top>6e6?2e6:1e6), g='';
  for(var v=paso; v<top; v+=paso) g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--grid)"/><text x="'+L+'" y="'+(y(v)-3)+'" font-size="10" fill="var(--mute)">'+(v/1e6)+'M</text>';
  [3,7,11,15,19,23].forEach(function(i){ g+='<text x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="var(--mute)">'+String((7+i)%24).padStart(2,'0')+'h</text>'; });
  var pts=['L'+xh(0)+','+y(0)]; for(var i=0;i<k && i<24;i++) pts.push(x(i)+','+y(HOY[i]));
  var ex=xh(Math.min(24,el)), ey=y(venta); pts.push(ex+','+ey);
  var linea=pts.join(' ').replace(/^L/,'');
  g+='<defs><linearGradient id="gaH" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--hot)" stop-opacity=".30"/><stop offset="1" stop-color="var(--hot)" stop-opacity="0"/></linearGradient></defs>';
  g+='<polyline points="'+xh(0)+','+y(0)+' '+SP.map(function(v,i){return x(i)+','+y(v);}).join(' ')+'" fill="none" stroke="var(--ghost)" stroke-width="2" stroke-dasharray="5 4"/>';
  g+='<path d="M'+linea.split(' ').join(' L')+' L'+ex+','+y(0)+' Z" fill="url(#gaH)"/>';
  g+='<polyline points="'+linea+'" fill="none" stroke="var(--hot)" stroke-width="2.5" stroke-linejoin="round"/>';
  g+='<circle cx="'+ex+'" cy="'+ey+'" r="5" fill="var(--hot)" stroke="var(--card)" stroke-width="2"/>';
  g+='<text x="'+(ex>W*0.25?ex-8:ex+8)+'" y="'+(ey-9)+'" text-anchor="'+(ex>W*0.25?'end':'start')+'" font-size="11" font-weight="700" fill="var(--ink)">hoy '+mill(venta)+'</text>';
  g+='<text x="'+(W-R-4)+'" y="'+(y(SP[23])-7)+'" text-anchor="end" font-size="10" fill="var(--mute)">'+esc(lblSp)+' · '+mill(SP[23])+'</text>';
  g+='<line class="cx" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--mute)" opacity="0"/>';
  return { svg:'<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Cobrado acumulado de hoy contra '+esc(lblSp)+'">'+g+'</svg>',
    W:W, L:L, R:R, n:n, x:x, HOY:HOY, SP:SP, k:k };
}
function panelHoy(res){
  var r=(res.righe||[])[0]||{}, venta=num(r.venta);
  if(venta==null) return '<div class="card"><div class="mute">Hoy: los números llegaron con otra forma, no muestro cifras a medias.</div></div>';
  var dia=String(res.dia||'').slice(0,10)||diaOperativoHoy(), leido=res.leido_ts||new Date().toISOString(), hora=hhmm(leido);
  var pc=num(r.por_cobrar), vsp=num(r.venta_sp), cie=num(r.cierre_sp), nb=num(r.boletas), nbsp=num(r.boletas_sp);
  var vivas=+r.vivas||0, mx=+r.max4s||0, oc=mx? Math.round(vivas/mx*100) : null;
  var sp=DOWL[dow(dia)]+' pasado', spc=DOW[dow(dia)]+'. pasado';
  var el=horasDesde6(leido), cerrado = el>=23.98;
  var tot = venta + (pc||0);
  var h='<div class="hero"><div class="htop"><span>Hoy · '+esc(fechaLarga(dia))+'</span>'
   +'<button class="live" id="hoyRef" title="Actualizar"><span class="dot'+(cerrado?' off':'')+'"></span>'+(DEMO?'demo · ':'')+'dato '+hora+' ↻</button></div>'
   +'<div class="hnum">'+peso(tot)+'</div><div class="hsub">'+(pc!=null?'Venta de hoy · cobrado + por cobrar':'Cobrado hasta las '+hora+' (boletas, sin propina)')+'</div>';
  if(vsp>0){ var dv=Math.round((venta/vsp-1)*100), up=dv>=0;
    h+='<div class="badge '+(up?'u':'d')+'"><span class="ar">'+(up?'▲':'▼')+'</span>'+(up?'+':'')+dv+'% cobrado vs '+esc(sp)+' a esta hora</div>'; }
  if(pc!=null){ var fc=tot? venta/tot*100 : 100;
    h+='<div class="split"><div class="sbar"><i class="c" style="width:'+fc+'%"></i>'+(pc>0?'<i class="p" style="width:'+(100-fc)+'%"></i>':'')+'</div>'
     +'<div class="slbl"><span><span class="sw" style="background:#fff3e6"></span>Cobrado<b>'+peso(venta)+'</b></span>'
     +'<span style="text-align:right"><span class="sw" style="background:rgba(255,243,230,.45)"></span>Por cobrar · '+vivas+' mesas<b>'+peso(pc)+'</b></span></div></div>'; }
  h+='</div><div class="tiles">';
  if(oc!=null) h+='<div class="tile"><div class="k">Ocupación</div><div class="ring">'+anillo(oc)+'<div><div class="v">'+(oc>=100?'<span class="full">FULL</span>':oc+'%')+'</div>'
     +'<div class="s">'+vivas+' de '+mx+' mesas'+(oc>100?' · récord':'')+'</div></div></div>'
     +'<div class="s" style="margin-top:4px">máx. 4 semanas'+(r.max4s_estimado?' (antes del 2-nov, estimado)':'')+'</div></div>';
  if(vsp!=null) h+='<div class="tile"><div class="k">'+esc(sp)+'</div><div class="v">'+peso(vsp)+'</div><div class="s">a esta hora'+(cie!=null?' · cerró en '+mill(cie):'')+'</div></div>';
  if(nb>0){ var t=venta/nb, ts=nbsp>0? vsp/nbsp : null, pt=ts? Math.round((t/ts-1)*100) : null;
    h+='<div class="tile"><div class="k">Ticket por boleta</div><div class="v">'+peso(t)+'</div><div class="s">'
     +(ts?esc(spc)+' '+peso(ts)+' · <span class="'+(pt>=0?'up':'down')+'">'+(pt>=0?'▲ +':'▼ ')+pt+'%</span>':nb+' boletas')+'</div></div>'; }
  else if(+r.cerradas>0) h+='<div class="tile"><div class="k">Ticket por cuenta</div><div class="v">'+peso(num(r.pagado_cerradas)/(+r.cerradas))+'</div><div class="s">promedio de '+(+r.cerradas)+' cerradas</div></div>';
  h+='<div class="tile"><div class="k">Cuentas de hoy</div><div class="v">'+(+r.cuentas_hoy||0)+'</div><div class="s">'+(+r.cerradas||0)+' cerradas · '+vivas+' abiertas</div></div>';
  h+='</div>';
  var G=null;
  if(curvaOk(r.curva)){ G=graficoHoy(r.curva, venta, el, DOW[dow(dia)]+' '+addDias(dia,-7).slice(8,10));
    h+='<div class="chart"><h3>Cómo va el día · cobrado acumulado</h3><div class="leg"><span><i></i>Hoy</span><span><i class="g"></i>'+esc(sp)+'</span></div>'
     +'<div class="cw" id="hoyCw">'+G.svg+'<div class="tip" id="hoyTip"></div></div></div>'; }
  h+='<div class="foot">Dato de las '+hora+' · se actualiza al abrir y con ↻</div>';
  return { html:'<div class="hoy">'+h+'</div>', G:G };
}
function enganchaGrafico(G){
  var cw=document.getElementById('hoyCw'); if(!G||!cw) return;
  var svg=cw.querySelector('svg'), tip=document.getElementById('hoyTip'), cx=svg.querySelector('.cx');
  function mv(ev){ var b=svg.getBoundingClientRect(), px=((ev.touches?ev.touches[0].clientX:ev.clientX)-b.left)/b.width*G.W;
    var i=Math.max(0,Math.min(23,Math.round((px-G.L)/(G.W-G.L-G.R)*G.n)-1)), X=G.x(i);
    cx.setAttribute('x1',X); cx.setAttribute('x2',X); cx.setAttribute('opacity','.5');
    tip.innerHTML=String((7+i)%24).padStart(2,'0')+':00<br>Hoy <b>'+(i<G.k?peso(G.HOY[i]):'—')+'</b><br>Antes <b>'+peso(G.SP[i])+'</b>';
    tip.style.left=(X/G.W*100)+'%'; tip.style.top='30px'; tip.style.opacity=1; }
  svg.addEventListener('mousemove',mv); svg.addEventListener('touchmove',mv,{passive:true});
  svg.addEventListener('mouseleave',function(){ tip.style.opacity=0; cx.setAttribute('opacity','0'); });
}
function cargarHoy(q){
  var box=document.getElementById('hoyBox'); if(!box) return;
  (DEMO ? Promise.resolve(DEMO_HOYP) : pedir('/socios/hoy'+q)).then(function(res){
    var p=panelHoy(res); box.innerHTML = typeof p==='string'? p : p.html;
    if(p.G) enganchaGrafico(p.G);
    var b=document.getElementById('hoyRef'); if(b) b.onclick=function(){ b.style.opacity=.5; cargarHoy(q); };
  }).catch(function(e){
    var c=e&&e.code||'';
    box.innerHTML = (c==='leva_spenta'||c==='http_404') ? '' : '<div class="card"><h2>Hoy</h2><div class="mute">'+mensajeError(e)+'</div></div>';
  });
}

function mensajeError(e){
  var c=e&&e.code||'';
  if(c==='firma'||/^firma_/.test(c)||c==='http_401') return 'Tu sesión no trae la firma o ya venció: sal y vuelve a entrar con tu PIN.';
  if(c==='cargo_no_autorizado'||c==='local_fuera_de_alcance'||c==='http_403') return 'Tu acceso no incluye este local.';
  if(c==='leva_spenta'||c==='http_404') return 'Esta sección aún no está encendida.';
  if(c==='forma_mes'||c==='pg_forma') return 'Los números llegaron con otra forma: no muestro cifras a medias. Avisa a Alberto.';
  return 'No pude leer los números ('+esc(c||'sin red')+'). Vuelve a intentar en un minuto.';
}

function pintar(ses){
  var rol=String(ses&&ses.role||'').toUpperCase();
  document.getElementById('quien').textContent = DEMO ? 'DEMO' : ((ses&&ses.user)||'') + ' · ' + rol;
  if(!DEMO && CARGOS.indexOf(rol)<0){ app.innerHTML='<div class="card"><div class="mute">Esta sección es sólo para los socios.</div></div>'; return; }
  var hoy = DEMO ? DEMO_HOY : diaOperativoHoy(), ayer = addDias(hoy,-1);
  if(DEMO){ var av=document.getElementById('aviso'); av.textContent='DEMO · números reales y fijos (Hoy: sábado 07-11 a las 22:00 · Ayer y meses: miércoles 04-11). No es la página viva.'; av.classList.remove('hidden'); }
  var loc = ((location.search.match(/[?&]loc=([a-z*,]+)/i)||[])[1]||'BKS').toUpperCase();
  var q = '?loc='+encodeURIComponent(loc);
  // los días de 4 semanas antes de los últimos 7 caen en 1 o 2 meses anteriores: se piden aparte a la
  // misma ruta (soci_mes de ese mes). Si fallan, las barras salen sin su sombra — nunca tumban la página.
  var mesesSombra=[]; for(var k=7;k>=1;k--){ var mm=addDias(addDias(hoy,-k),-28).slice(0,7); if(mm!==hoy.slice(0,7) && mesesSombra.indexOf(mm)<0) mesesSombra.push(mm); }
  var sombra = DEMO ? Promise.resolve(DEMO_SOMBRA)
    : Promise.all(mesesSombra.map(function(mm){ return pedir('/socios/mes'+q+'&mes='+mm).then(function(r){ return leerMes(r, hoy).dias; }).catch(function(){ return []; }); }))
        .then(function(ls){ var o={}; ls.forEach(function(l){ l.forEach(function(d){ o[d.dia]=d.total; }); }); return o; });
  var pr = Promise.all([ DEMO ? DEMO_RES : pedir('/socios/resumen'+q+'&dia='+ayer),
                         (DEMO ? Promise.resolve(DEMO_MES) : pedir('/socios/mes'+q+'&mes='+hoy.slice(0,7)))
                           .then(function(r){ return leerMes(r, hoy); }),
                         sombra ])
    .then(function(r){ var m=r[1], o={}; (m.dias||[]).forEach(function(d){ o[d.dia]=d.total; });
      Object.keys(r[2]).forEach(function(k){ if(!(k in o)) o[k]=r[2][k]; }); m.sombra=o; return [r[0], m]; });
  // Hoy va por su cuenta: aparece apenas llega y nunca tumba el resto de la página
  app.innerHTML = '<div class="tabs"><span>'+esc(loc)+'</span></div><div id="hoyBox"></div><div id="resto"><div class="card"><div class="mute">Cargando…</div></div></div>';
  cargarHoy(q);
  var resto=document.getElementById('resto');
  pr.then(function(r){
    resto.innerHTML = tarjetaAyer(r[0]) + tarjetasMes(r[1], hoy);
    document.getElementById('edad').textContent = 'Leído: ' + new Date().toLocaleString('es-CL',{timeZone:'America/Santiago',dateStyle:'short',timeStyle:'short'});
  }).catch(function(e){ resto.innerHTML='<div class="card"><div class="mute">'+mensajeError(e)+'</div></div>'; });
}

if (DEMO) { pintar(null); return; }
if (!window.PinsitaAuth) { app.innerHTML='<div class="card"><div class="mute">No se pudo cargar el acceso (pinsita_auth.js).</div></div>'; return; }
var ses = PinsitaAuth.sesion();
if (ses) { pintar(ses); return; }
PinsitaAuth.init({ local:'*', accent:'#8a5a2b' });           // sin sesión: el PIN de siempre
var espera = setInterval(function(){ var s=PinsitaAuth.sesion(); if(s){ clearInterval(espera); pintar(s); } }, 400);
})();
