<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Lista">
<meta name="theme-color" content="#0a0a0e">
<title>Mi tarjeta · La Lista de Backstage</title>
<!-- DEVICE-CLASS: 1 · il TELEFONO del cliente, pagina PUBBLICA da aggiungere alla schermata home -->
<!-- 🎟 LA LISTA V35 · D-567 · «Mi tarjeta», il ripiego del wallet (bacheca «IL WALLET VERO NON REGGE LUN 30»).
     La tarjeta dice CHI SEI, non un saldo: Backstage · La Lista · il nome (prima parola) · il QR del tuo link (menu.pinsita.cl/menu.html?l=&member=).
     · l'id: da ?member= oppure dal telefono (`pinsita_member_<LOCAL>`, scritto da unete.html, stesso dominio).
     · il nome: dal telefono (`pinsita_member_nombre_<LOCAL>`, scritto da unete.html) e, se il bordo risponde, da GET /member/<LOCAL>?id=
       (la rotta che esiste, leva MEMBER_PG_ON). Nessun altro dato del cliente: mai telefono, correo o data.
     · Il QR è lo stesso che la Puerta leggerà alla porta («entra sin hacer fila», gio 26).
     · ?demo=1 → nessuna rete, una tarjeta di prova. Nessuna lettura né scrittura su Google. -->
<style>
  :root{ --ink:#f7f0e2; --ink2:#c9c0b0; --ink3:#8f8779; --oro:#e0a94a; --oro-hi:#f2c274;
    --vetro:rgba(255,255,255,.045); --filo:rgba(255,255,255,.085); --page:#0a0a0e; color-scheme:dark; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--page);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 62% at 50% -12%,rgba(224,169,74,.22) 0%,rgba(190,80,160,.08) 42%,transparent 72%),linear-gradient(180deg,#17121d,#0a0a0e)}
  .wrap{max-width:430px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
  .hide{display:none!important}
  .demo{background:rgba(224,169,74,.12);border:1px dashed rgba(224,169,74,.55);color:var(--oro);border-radius:12px;padding:8px 12px;font-size:12px;margin-bottom:12px}
  .card{position:relative;border-radius:24px;padding:22px 20px 20px;overflow:hidden;
    background:linear-gradient(150deg,#241b2c 0%,#141018 55%,#0d0b10 100%);border:1px solid rgba(224,169,74,.45);
    box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
  .card::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(224,169,74,.25),transparent 70%)}
  .marca{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--oro);font-weight:700}
  .lista{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 0 14px}
  .chi{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  .chi i{display:block;font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
  .chi b{font-size:22px;font-weight:750}
  .qr{background:#fff;border-radius:16px;padding:10px;width:200px;height:200px;margin:18px auto 6px}
  .qr svg{width:100%;height:100%}
  .sotto{text-align:center;font-size:12px;color:var(--ink2)}
  .vb{display:block;width:100%;border:none;border-radius:18px;font-weight:700;font-size:16px;padding:15px 10px;margin-top:12px;text-align:center;text-decoration:none;color:var(--ink);font-family:inherit;cursor:pointer}
  .vb.pieno{background:linear-gradient(180deg,var(--oro-hi),var(--oro));color:#241503}
  .vb.filo{background:#2a2117;color:var(--oro);border:1px solid rgba(224,169,74,.45)}
  .como{margin-top:18px;padding:13px 14px;border-radius:15px;background:var(--vetro);border:1px solid var(--filo);font-size:13.5px;color:var(--ink2)}
  .como b{color:var(--ink)} .como ol{margin:6px 0 0 18px} .como li{margin:3px 0}
  .vacia{text-align:center;padding-top:14vh} .vacia .e{font-size:46px} .vacia b{display:block;font-size:20px;margin:10px 0 6px} .vacia span{font-size:13.5px;color:var(--ink2)}
  .foot{margin-top:24px;font-size:10px;color:var(--ink3);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div id="demo" class="demo hide">Prueba · tarjeta de ejemplo.</div>

  <section id="vCard" class="hide">
    <div class="card">
      <div class="marca">Backstage</div>
      <div class="lista">La Lista</div>
      <div class="chi"><div><i>Miembro</i><b id="nom">—</b></div><div style="text-align:right"><i>Local</i><b id="loc" style="font-size:15px"></b></div></div>
      <div class="qr" id="qr"></div>
      <div class="sotto">Muéstrala en la puerta y al pedir</div>
    </div>
    <a class="vb pieno" id="bCarta" href="#">Ver la carta con mi precio</a>
    <div class="como" id="como"></div>
  </section>

  <section id="vVacia" class="hide vacia">
    <div class="e">🎟</div><b>Todavía no tienes tu tarjeta</b>
    <span>Únete a La Lista y aquí aparece.</span>
    <a class="vb pieno" id="bUnete" href="#">Unirme a La Lista</a>
  </section>

  <div class="foot"><span id="ver">mi_tarjeta v0.1.1 · 25nov · ramo</span></div>
</div>
<script>
'use strict';
const QS = new URLSearchParams(location.search);
const LOCAL = String(QS.get('loc') || QS.get('l') || 'BKS').trim().toUpperCase().replace(/[^A-Z]/g, '').slice(0, 12) || 'BKS';
const DEMO = QS.get('demo') === '1';
const BORDE = { URL: 'https://pinsita-borde.alberto-agostini.workers.dev', T: '7QvreCN5fzM40GW2Me8vfvNwIwcA9RDnTceXMwgZ' };   // il token di lettura dei vetri
const MENU_URL = 'https://menu.pinsita.cl/menu.html';
const SK_ID = 'pinsita_member_' + LOCAL + (DEMO ? '_demo' : ''), SK_NOM = 'pinsita_member_nombre_' + LOCAL + (DEMO ? '_demo' : '');
const $ = id => document.getElementById(id);
const okId = x => /^[A-Za-z0-9_-]{2,30}$/.test(x || '');
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) { return ''; } }
const primaParola = s => String(s || '').trim().split(/\s+/)[0] || '';

let ID = QS.get('member') || '';
if (okId(ID)) ls(SK_ID, ID); else ID = ls(SK_ID);
if (DEMO && !okId(ID)) { ID = 'mdemo1234abcd'; ls(SK_NOM, 'Ana'); }

function como() {
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  $('como').innerHTML = '<b>Tenla siempre a mano:</b>' + (ios
    ? '<ol><li>Toca <b>Compartir</b> (el cuadrado con la flecha).</li><li>Elige <b>«Agregar a inicio»</b>.</li></ol>'
    : '<ol><li>Toca el menú <b>⋮</b> del navegador.</li><li>Elige <b>«Agregar a la pantalla de inicio»</b>.</li></ol>') +
    '<div style="margin-top:6px">Así queda como una app: la abres y muestras tu tarjeta.</div>';
}
async function nombreDelBorde() {
  if (DEMO) return '';
  try {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 4000);
    /* il token di lettura nell'HEADER (index.js, rotta `member`: segretoUguale su X-Borde-Token): in query la rotta risponde 401 token_invalido */
    const r = await fetch(BORDE.URL + '/member/' + encodeURIComponent(LOCAL) + '?id=' + encodeURIComponent(ID), { headers: { 'X-Borde-Token': BORDE.T }, cache: 'no-store', signal: ctrl.signal });
    clearTimeout(to);
    const j = await r.json();
    return j && j.ok === true && j.nombre ? primaParola(j.nombre) : '';
  } catch (e) { return ''; }   // il bordo spento o lento: resta il nome del telefono
}
function qrLib() {
  if (typeof qrcode === 'function') return Promise.resolve(qrcode);
  return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'shared/qr_pinsita.js'; s.async = true;
    s.onload = () => typeof qrcode === 'function' ? ok(qrcode) : ko(new Error('qr')); s.onerror = () => ko(new Error('qr')); document.head.appendChild(s); });
}
(async function avvio() {
  if (DEMO) $('demo').classList.remove('hide');
  if (!okId(ID)) { $('bUnete').href = 'unete.html?loc=' + LOCAL.toLowerCase(); $('vVacia').classList.remove('hide'); return; }
  const link = MENU_URL + '?l=' + encodeURIComponent(LOCAL) + '&member=' + encodeURIComponent(ID);
  $('bCarta').href = link;
  $('loc').textContent = LOCAL === 'BKS' ? 'BKS' : LOCAL;
  $('nom').textContent = primaParola(ls(SK_NOM)) || 'Tu tarjeta';
  como();
  $('vCard').classList.remove('hide');
  try { const q = (await qrLib())(0, 'M'); q.addData(link); q.make(); $('qr').innerHTML = q.createSvgTag(6, 0); }
  catch (e) { $('qr').innerHTML = '<span style="color:#241503;font-size:12px">No pude dibujar el código. Recarga la página.</span>'; }
  const n = await nombreDelBorde();
  if (n) { ls(SK_NOM, n); $('nom').textContent = n; }
})();
</script>
</body>
</html>
