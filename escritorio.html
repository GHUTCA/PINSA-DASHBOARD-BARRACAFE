     Dal mockup di 🎨 (`4_CANTIERE_ADMINISTRACION/MOCKUP_SCRIVANIA_MAYRA_28NOV2026.html`) e dal brief di 🧾 (`BRIEF_SCRIVANIA_MAYRA_28NOV2026.md`).
     Ogni mattina: cosa manca da caricare, in ordine di denaro. Mayra lascia cadere il file SULLA RIGA e vede subito una di quattro risposte
     (Llegó · Ya estaba · Rechazado · Leyendo). Una riga sparisce quando la sua fonte diventa automatica.
     · nasce su bordo + PG, niente Google: il login è `/auth` (ruolo `carga`), il carico è `POST /carga/<cartella>` (⚙️ 21-nov, 🖐 QUARTA il verbo);
     · il file lo LEGGE IL PC (il verbo non interpreta niente): CSV qui, `.xlsx` con SheetJS da cdnjs caricato solo quando arriva un .xlsx.
       Lo sha256 è dei byte del file (`crypto.subtle`): lo stesso file due volte ⇒ «Ya estaba», 0 righe;
     · LEVA `carga_cartelle_on` di /salud, la stessa del verbo; `?carga=1|0` sul PC (0 vince). Spenta: la pagina lo dice e non chiama niente.
     · `?demo=1`: il bordo finto, coi numeri del presidio dell'età del 28-nov 17:20 (mockup di 🎨). Niente esce da questo PC.
     🔴 I NOMI DEI CONTRATTI non ancora fissati (la lista della mattina, il login, `cuenta4`) vivono tutti in `ESC_API` qui sotto: un posto solo. -->
<html lang="es">
<head>
<meta charset="utf-8">

<title>Tu escritorio</title>
<style>
:root{--bg:#eef0f3;--card:#fff;--ink:#1c2230;--soft:#5b6475;--line:#dfe3ea;--rojo:#c0392b;--rojo-bg:#fdecea;--ambar:#b7791f;--ambar-bg:#fdf3e1;--verde:#1e8449;--verde-bg:#e8f6ee;--azul:#2457a6;--azul-bg:#eaf1fb;--gris-bg:#f4f5f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
.pantalla{max-width:1120px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);overflow:hidden}

.tarea{display:grid;grid-template-columns:150px 1fr 280px;gap:14px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px;background:#fff}

.tarea.med{border-left:5px solid var(--ambar)}
.tarea.sobre{outline:2px solid var(--azul);outline-offset:-2px;background:var(--azul-bg)}
.emp{font-weight:700}

.btn{display:inline-block;background:var(--azul);color:#fff;border:0;border-radius:8px;padding:10px 22px;font:600 14px system-ui;cursor:pointer}

.aviso{color:var(--rojo);font-size:13px;margin-top:10px;min-height:18px}

@media (max-width:820px){.tarea{grid-template-columns:1fr}}

<div id="app"></div>
<script>
'use strict';
var ESC_VER = 'escritorio v0.1.0';
var CFG = { BORDE: 'https://pinsita-borde.alberto-agostini.workers.dev' };
var QS = new URLSearchParams(location.search);
var DEMO = QS.get('demo') === '1';
/* ═══ ESC_API · i nomi dei contratti, in un posto solo ═══
   · login: `POST /auth/login` {pin, rol:'carga'} → {ok, token, nombre}  (PROPOSTO, ⚙️ dice il nome vero: ramo `auth.js` mar 1)
   · lista: `GET /carga/pendientes` (Authorization: Bearer) → {ok, datos_al, filas:[…], hoy:{archivos, filas}, proximos:[texto]}  (PROPOSTO, 🖐 QUARTA/⚙️)
       fila = {id, grupo:'cartolas'|'casa', empresa, en_juego, sub, tipo, cartella, cuenta4, titulo, desde, hasta, ultimo, dias, urgencia:'r'|'a',
               por_mes:[…], detalle, se_carga_solo, espera, ejemplo, acepta:'archivo'|'foto'}
   · carga: `POST /carga/<cartella>` {nombre, sha256, bytes, filas, cuenta4} → {esito:'caricato'|'gia_caricato'|'rifiutato', nuove, gia, scarto, motivo, mensaje, desde, hasta}
       (⚙️ 21-nov + 🚚; `cuenta4`, `desde`/`hasta` e `mensaje` sono la mia domanda a 🖐 QUARTA) */
var ESC_API = {
  login: function () { return CFG.BORDE + '/auth/login'; },
  lista: function () { return CFG.BORDE + '/carga/pendientes'; },
  carga: function (cartella) { return CFG.BORDE + '/carga/' + encodeURIComponent(cartella); },
  salud: function () { return CFG.BORDE + '/salud'; }
};
var S = { token: '', nombre: '', lev: null, lista: null, err: '', res: {}, hoy: { archivos: 0, filas: 0 }, cargando: false, pinErr: '', entrando: false };
try { S.token = sessionStorage.getItem('esc_token') || ''; S.nombre = sessionStorage.getItem('esc_nombre') || ''; } catch (e) {}
var CARGA_QS = (function () { var q = QS.get('carga'); try { if (q === '1' || q === '0') localStorage.setItem('esc_carga_qs', q); return localStorage.getItem('esc_carga_qs') || ''; } catch (e) { return q || ''; } })();
function escLevaOn() { if (DEMO) return true; if (CARGA_QS === '0') return false; if (S.lev != null) return S.lev; return CARGA_QS === '1'; }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pesos(n) { n = Math.round(Number(n) || 0); return (n < 0 ? '−$' : '$') + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
var MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function fdia(d) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || '')); return m ? (+m[3]) + '-' + MESES[+m[2] - 1] : esc(d || ''); }
function fmes(m) { var k = /^(\d{4})-(\d{2})/.exec(String(m || '')); return k ? MESES_L[+k[2] - 1] : esc(m || ''); }
function hora(ts) { var d = ts ? new Date(ts) : new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function lista3(a) { return a.length <= 1 ? a.join('') : a.slice(0, -1).join(', ') + ' y ' + a[a.length - 1]; }

/* ── la rete (il bordo finto in demo) ── */
async function escFetch(url, op, ms) {
  var ctrl = new AbortController(), to = setTimeout(function () { ctrl.abort(); }, ms || 10000);
  try { var r = await fetch(url, Object.assign({ cache: 'no-store', signal: ctrl.signal }, op || {})); var j = await r.json().catch(function () { return null; }); clearTimeout(to); return j ? Object.assign({ _status: r.status }, j) : { _rete: true, _status: r.status }; }
  catch (e) { clearTimeout(to); return { _rete: true }; }
}
function escAuth() { return S.token ? { Authorization: 'Bearer ' + S.token } : {}; }
async function escLeva() {
  if (DEMO) { S.lev = true; return; }
  var j = await escFetch(ESC_API.salud(), null, 6000); if (!j || j._rete) return;
  var v = j.flags && j.flags.carga_cartelle_on; if (v == null) return;   // senza la chiave decide `?carga=`
  v = String(v).trim().toUpperCase(); S.lev = !!v && v !== '0' && v !== 'FALSE';
}
async function escEntra(pin) {
  if (DEMO) return { ok: true, token: 'demo', nombre: 'Mayra' };
  return escFetch(ESC_API.login(), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ pin: pin, rol: 'carga' }) }, 8000);
}
async function escLista() {
  if (DEMO) return JSON.parse(JSON.stringify(ESC_DEMO.lista));
  return escFetch(ESC_API.lista(), { headers: escAuth() }, 10000);
}
async function escCarga(cartella, body) {
  if (DEMO) return escDemoCarga(cartella, body);
  return escFetch(ESC_API.carga(cartella), { method: 'POST', headers: Object.assign({ 'content-type': 'application/json' }, escAuth()), body: JSON.stringify(body) }, 30000);
}

/* ── leggere il file: lo sha dei byte, le righe come {intestazione: valore} (stringhe, così come escono) ── */
async function escSha(buf) { var h = await crypto.subtle.digest('SHA-256', buf); return Array.from(new Uint8Array(h)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join(''); }
function escCsv(txt) {
  txt = txt.replace(/^﻿/, '');
  var prima = (txt.split(/\r?\n/).filter(function (l) { return l.trim(); })[0]) || '';
  var sep = [';', ',', '\t'].reduce(function (a, s) { return prima.split(s).length > prima.split(a).length ? s : a; }, ',');
  var righe = [], cur = [], f = '', q = false;
  for (var i = 0; i < txt.length; i++) {
    var c = txt[i];
    if (q) { if (c === '"') { if (txt[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === sep) { cur.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && txt[i + 1] === '\n') i++; cur.push(f); f = ''; if (cur.some(function (x) { return x.trim(); })) righe.push(cur); cur = []; }
    else f += c;
  }
  cur.push(f); if (cur.some(function (x) { return x.trim(); })) righe.push(cur);
  return escOggetti(righe);
}
function escOggetti(righe) {
  if (righe.length < 2) return [];
  var head = righe[0].map(function (h, i) { h = String(h || '').trim(); return h || ('col' + (i + 1)); });
  return righe.slice(1).map(function (r) { var o = {}; head.forEach(function (h, i) { o[h] = r[i] == null ? '' : String(r[i]).trim(); }); return o; });
}
var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function escXlsxLib() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise(function (ok, ko) { var s = document.createElement('script'); s.src = XLSX_URL; s.onload = function () { window.XLSX ? ok(window.XLSX) : ko(new Error('xlsx')); }; s.onerror = function () { ko(new Error('xlsx')); }; document.head.appendChild(s); });
}
async function escLeggi(file) {
  var buf = await file.arrayBuffer(), nome = String(file.name || ''), ext = (/\.([a-z0-9]+)$/i.exec(nome) || [])[1];
  ext = String(ext || '').toLowerCase();
  var sha = await escSha(buf), filas;
  if (ext === 'csv' || ext === 'txt') filas = escCsv(new TextDecoder('utf-8').decode(buf));
  else if (ext === 'xlsx' || ext === 'xls') {
    var X = await escXlsxLib(), wb = X.read(new Uint8Array(buf), { type: 'array' }), ws = wb.Sheets[wb.SheetNames[0]];
    filas = escOggetti(X.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' }));
  } else return { ok: false, motivo: 'formato', sha: sha };
  return { ok: true, nombre: nome, sha256: sha, bytes: buf.byteLength, filas: filas };
}

/* ── le quattro risposte ── */
var ESC_MOTIVO = {
  formato: ['No pudimos leerlo', 'Súbelo como Excel (.xlsx) o CSV, como lo baja el banco o el SII.'],
  vacio: ['No pudimos leerlo', 'El archivo no tiene filas. ¿Es el archivo correcto? Inténtalo de nuevo; si vuelve a fallar, avísale a Alberto.'],
  cuenta_otra: ['No es la cuenta de esta fila', 'Bájalo de nuevo desde la cuenta que dice la fila.'],
  cartella_sin_tabla: ['Esta fila todavía no recibe archivos', 'Avísale a Alberto: no se guardó nada.'],
  columnas: ['No pudimos leerlo', 'Faltan columnas que esperamos. ¿Lo bajaste en Excel desde el banco? Inténtalo de nuevo; si vuelve a fallar, avísale a Alberto.'],
  sesion: ['Tu sesión se cerró', 'Vuelve a entrar con tu PIN y suelta el archivo de nuevo.'],
  apagado: ['La carga está apagada', 'Hoy no se puede subir: avísale a Alberto. No se guardó nada.']
};
function escResDe(r, f, lido) {
  if (!r || r._rete) return { k: 'no', t: '✗ No sé si llegó', s: 'Vuelve a soltar el mismo archivo: si ya llegó, no se carga dos veces.' };
  if (r._status === 401 || r._status === 403) return { k: 'no', t: '✗ ' + ESC_MOTIVO.sesion[0], s: ESC_MOTIVO.sesion[1] };
  var e = r.esito || (r.ok === false ? 'rifiutato' : '');
  if (e === 'caricato') {
    var per = (r.desde || r.hasta) ? ' · del ' + fdia(r.desde) + ' al ' + fdia(r.hasta) : '';
    return { k: 'ok', t: '✓ Llegó · ' + (Number(r.nuove) || 0).toLocaleString('es-CL') + ' filas' + (Number(r.gia) > 0 ? ' · ' + Number(r.gia).toLocaleString('es-CL') + ' ya estaban' : ''), s: lido.nombre + ' · ' + hora() + per, n: Number(r.nuove) || 0 };
  }
  if (e === 'gia_caricato') return { k: 'ya', t: 'Ya estaba', s: 'Ese mismo archivo ya lo subiste' + (r.caricato_ts ? ' a las ' + hora(r.caricato_ts) : '') + '. No se cargó dos veces.' };
  var m = ESC_MOTIVO[r.motivo] || null;
  if (r.motivo === 'cuenta_otra' && f && f.cuenta4) m = ['No es la cuenta ···' + f.cuenta4, r.mensaje || ESC_MOTIVO.cuenta_otra[1]];
  return { k: 'no', t: '✗ ' + (m ? m[0] : 'No pudimos guardarlo'), s: (m && !r.mensaje) ? m[1] : (r.mensaje || 'Inténtalo de nuevo; si vuelve a fallar, avísale a Alberto. No se guardó nada.') };
}
async function escSuelta(id, files) {
  var f = (S.lista && S.lista.filas || []).filter(function (x) { return String(x.id) === String(id); })[0]; if (!f || f.espera || f.acepta === 'foto') return;
  if (!escLevaOn()) { S.res[id] = { k: 'no', t: '✗ ' + ESC_MOTIVO.apagado[0], s: ESC_MOTIVO.apagado[1] }; pinta(); return; }
  for (var i = 0; i < files.length; i++) {
    var file = files[i]; S.res[id] = { k: 'va', t: 'Leyendo el archivo…', s: file.name + ' · no cierres la página' }; pinta();
    var lido; try { lido = await escLeggi(file); } catch (e) { lido = { ok: false, motivo: 'formato' }; }
    if (!lido.ok) { S.res[id] = { k: 'no', t: '✗ ' + ESC_MOTIVO[lido.motivo][0], s: ESC_MOTIVO[lido.motivo][1] }; pinta(); continue; }
    if (!lido.filas.length) { S.res[id] = { k: 'no', t: '✗ ' + ESC_MOTIVO.vacio[0], s: ESC_MOTIVO.vacio[1] }; pinta(); continue; }
    var body = { nombre: lido.nombre, sha256: lido.sha256, bytes: lido.bytes, filas: lido.filas }; if (f.cuenta4) body.cuenta4 = String(f.cuenta4);
    var r = await escCarga(f.cartella, body);
    var res = escResDe(r, f, lido); if (res.k === 'ok') { S.hoy.archivos++; S.hoy.filas += res.n; }
    if (files.length > 1) res.s = (i + 1) + ' de ' + files.length + ' · ' + res.s;
    S.res[id] = res; pinta();
  }
}

/* ── il disegno ── */
function escDettaglio(f) {
  if (f.detalle) return esc(f.detalle);
  var verbo = /cartola/i.test(f.titulo || '') ? 'Bájala' : 'Bájalo';
  var h = '';
  if (f.por_mes && f.por_mes.length) h = verbo + ' por mes: <b>' + lista3(f.por_mes.map(fmes)) + '</b>.';
  else if (f.mes) h = 'Baja el registro de compras de <b>' + fmes(f.mes) + '</b>.';
  else if (f.desde) h = verbo + ' del <b>' + fdia(f.desde) + '</b> al <b>' + fdia(f.hasta) + '</b>.';
  if (f.ultimo) h += ' Lo último que tenemos es del ' + fdia(f.ultimo) + '.';
  return h;
}
function escZona(f) {
  if (f.espera) return '<div class="zona off">Esperando a ' + esc(f.espera) + '</div>';
  if (f.acepta === 'foto') return '<div class="zona off">Pronto: las fotos y los PDF todavía no se suben aquí</div>';
  var r = S.res[f.id];
  if (r) return '<div class="res ' + r.k + '" data-elige="' + esc(f.id) + '" title="' + (r.k === 'va' ? '' : 'Soltar otro archivo') + '"><b>' + esc(r.t) + '</b><small>' + esc(r.s) + '</small></div>';
  var cosa = /cartola/i.test(f.titulo || '') ? 'la cartola' : /RCV|compras/i.test(f.titulo || '') ? 'el RCV' : 'el archivo';
  return '<div class="zona" data-elige="' + esc(f.id) + '">Arrastra aquí ' + cosa + (f.por_mes && f.por_mes.length > 1 ? '<br>(puedes soltar varias juntas)' : '<br>o <b>elige el archivo</b>') + '</div>';
}
function escFila(f) {
  var urg = f.espera ? '' : (f.urgencia || (Number(f.dias) >= 14 ? 'r' : 'a'));
  var dias = f.ejemplo ? '<span class="dias a">ejemplo</span>' : (f.dias != null ? '<span class="dias ' + (urg === 'r' ? 'r' : 'a') + '">' + Number(f.dias) + ' días</span>' : '');
  var tit = esc(f.titulo || '') + (f.cuenta4 ? ' ···' + esc(f.cuenta4) : '');
  return '<div class="tarea ' + (f.espera ? 'espera' : urg === 'r' ? 'urg' : 'med') + '" data-fila="' + esc(f.id) + '">' +
    '<div class="emp">' + esc(f.empresa || '') + '<small>' + (f.en_juego != null ? pesos(f.en_juego) + ' en juego' : esc(f.sub || '')) + '</small></div>' +
    '<div class="que"><b>' + tit + '</b>' + dias + '<div class="det">' + escDettaglio(f) + '</div>' + (f.se_carga_solo ? '<span class="auto">' + esc(f.se_carga_solo) + '</span>' : '') + '</div>' +
    escZona(f) + '</div>';
}
/* l'ordine è il denaro (regola 2): per empresa il saldo «en juego», dentro l'empresa le righe più vecchie prima; quelle che aspettano in fondo */
function escOrdina(a) {
  return a.slice().sort(function (x, y) {
    if (!!x.espera !== !!y.espera) return x.espera ? 1 : -1;
    var d = (Number(y.en_juego) || 0) - (Number(x.en_juego) || 0); if (d) return d;
    return (Number(y.dias) || 0) - (Number(x.dias) || 0);
  });
}
function escBarra() {

    '<span class="ver" id="ver">' + ESC_VER + '</span></div>' + (DEMO ? '<div class="prueba">Prueba · datos de ejemplo del 28-nov · nada sale de este computador</div>' : '');
}
function escLogin() {
  return '<div class="pantalla login">' + escBarra() + '<div class="cuerpo">' +
    '<div style="font-weight:700;font-size:17px">Tu escritorio</div><div style="color:var(--soft);font-size:13px;margin-top:4px">Escribe tu PIN</div>' +
    '<form data-a="entrar"><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" autofocus><br>' +
    '<button class="btn" type="submit"' + (S.entrando ? ' disabled' : '') + '>' + (S.entrando ? 'Entrando…' : 'Entrar') + '</button></form>' +
    '<div class="aviso">' + esc(S.pinErr) + '</div>' +
    '<div style="color:var(--soft);font-size:12px;margin-top:14px">¿Olvidaste tu PIN? Pídele uno nuevo a Alberto.</div></div></div>';
}
function pinta() {
  var app = document.getElementById('app');
  if (!S.token) { app.innerHTML = escLogin(); var p = document.getElementById('pin'); if (p) p.focus(); return; }
  var h = '<div class="pantalla">' + escBarra() + '<div class="cuerpo">';
  if (!escLevaOn()) { app.innerHTML = h + '<div class="vacio"><div class="ic">⏸</div><div style="font-weight:700;font-size:16px;margin-top:6px">Tu escritorio todavía no está encendido</div><div style="color:var(--soft);font-size:13px;margin-top:6px">Alberto te avisa cuando puedas subir archivos aquí.</div></div></div></div>'; return; }
  if (!S.lista) { app.innerHTML = h + '<p class="leyenda">' + (S.err ? esc(S.err) : 'Leyendo lo que falta…') + '</p>' + (S.err ? '<p class="pie"><a data-a="recarga">Intentar de nuevo</a></p>' : '') + '</div></div>'; return; }
  var L = S.lista, fil = escOrdina(L.filas || []), act = fil.filter(function (f) { return !f.espera && (f.grupo || 'cartolas') === 'cartolas'; });   // si contano le righe che il presidio dà sopra soglia; «lo de la casa» c'è sempre
  var hoyA = (Number(L.hoy && L.hoy.archivos) || 0) + S.hoy.archivos, hoyF = (Number(L.hoy && L.hoy.filas) || 0) + S.hoy.filas;
  var nom = String(S.nombre || '').split(' ')[0];
  if (!act.length) {
    h += '<div class="vacio"><div class="ic">✓</div><div style="font-weight:700;font-size:16px;margin-top:6px">Hoy no te falta nada</div>' +
      '<div style="color:var(--soft);font-size:13px;margin-top:6px">Las empresas tienen cartolas de hasta 3 días y compras de hasta 7.</div>' +
      (hoyA ? '<div style="color:var(--soft);font-size:12px;margin-top:14px">Subiste hoy: ' + hoyA + (hoyA === 1 ? ' archivo' : ' archivos') + ' · ' + hoyF.toLocaleString('es-CL') + ' filas</div>' : '') + '</div>';
    var casa = fil.filter(function (f) { return f.grupo === 'casa'; }); if (casa.length) h += '<div class="bloque"><h3>Lo de la casa · esto siempre es tuyo</h3>' + casa.map(escFila).join('') + '</div>';
  } else {
    h += '<div class="saludo"><h2>Buenos días' + (nom ? ', ' + esc(nom) : '') + '</h2><span class="cuenta">Te quedan <b>' + act.length + (act.length === 1 ? ' fila' : ' filas') + '</b>. Empieza por arriba: es donde hay más plata en juego.</span></div>' +
      '<p class="leyenda">Cada fila dice qué bajar y desde qué fecha. Arrastra el archivo a su fila: te decimos al tiro si llegó. Cuando una fila se carga sola, desaparece de aquí.</p>';
    var gr = [['cartolas', 'Cartolas y compras · hasta que Emisso las lea solo'], ['casa', 'Lo de la casa · esto siempre es tuyo']];
    gr.forEach(function (g) { var fs = fil.filter(function (f) { return (f.grupo || 'cartolas') === g[0]; }); if (fs.length) h += '<div class="bloque"><h3>' + g[1] + '</h3>' + fs.map(escFila).join('') + '</div>'; });
  }
  h += '<div class="pie">' + (hoyA ? '<span class="hecho">✓ Hoy subiste ' + hoyA + (hoyA === 1 ? ' archivo' : ' archivos') + ' · ' + hoyF.toLocaleString('es-CL') + ' filas</span>' : '') +
    (L.proximos || []).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') +
    (L.datos_al ? '<span>Datos al ' + fdia(L.datos_al) + ', ' + esc(String(L.datos_al).slice(11, 16)) + '</span>' : '') + '<span><a data-a="recarga">Actualizar</a></span></div>';
  app.innerHTML = h + '</div></div><input id="archivo" type="file" accept=".csv,.txt,.xlsx,.xls" multiple hidden>';
}
async function escCarica() {
  S.err = ''; S.lista = null; pinta();
  var j = await escLista();
  if (j && (j._status === 401 || j._status === 403)) { escEsci('Tu sesión se cerró: vuelve a entrar con tu PIN.'); return; }
  if (!j || j._rete || !Array.isArray(j.filas)) { S.err = 'No pudimos leer lo que falta. Revisa la conexión e inténtalo de nuevo.'; pinta(); return; }
  S.lista = j; pinta();
}
function escEsci(msg) { S.token = ''; S.nombre = ''; S.lista = null; S.res = {}; S.pinErr = msg || ''; try { sessionStorage.removeItem('esc_token'); sessionStorage.removeItem('esc_nombre'); } catch (e) {} pinta(); }

/* ── i gesti ── */
var ESC_SCELTA = null;
document.addEventListener('submit', async function (ev) {
  if (!ev.target || ev.target.getAttribute('data-a') !== 'entrar') return; ev.preventDefault();
  var pin = String((document.getElementById('pin') || {}).value || '').replace(/\D/g, '');
  if (pin.length < 4) { S.pinErr = 'El PIN tiene al menos 4 números.'; pinta(); return; }
  S.entrando = true; S.pinErr = ''; pinta();
  var r = await escEntra(pin); pin = '';
  S.entrando = false;
  if (r && r.ok && r.token) { S.token = String(r.token); S.nombre = String(r.nombre || ''); try { sessionStorage.setItem('esc_token', S.token); sessionStorage.setItem('esc_nombre', S.nombre); } catch (e) {} await escLeva(); escCarica(); return; }
  S.pinErr = r && r._rete ? 'Sin conexión: inténtalo de nuevo.' : 'Ese PIN no entra. ¿Lo escribiste bien? Si lo olvidaste, pídele uno nuevo a Alberto.'; pinta();
});
document.addEventListener('click', function (ev) {
  var a = ev.target.closest && ev.target.closest('[data-a]'); if (a) { var k = a.getAttribute('data-a'); if (k === 'salir') escEsci(''); else if (k === 'recarga') { S.res = {}; escCarica(); } return; }
  var z = ev.target.closest && ev.target.closest('[data-elige]'); if (!z) return;
  var id = z.getAttribute('data-elige'); if (S.res[id] && S.res[id].k === 'va') return;
  ESC_SCELTA = id; var inp = document.getElementById('archivo'); if (inp) { inp.value = ''; inp.click(); }
});
document.addEventListener('change', function (ev) { if (ev.target && ev.target.id === 'archivo' && ESC_SCELTA && ev.target.files.length) escSuelta(ESC_SCELTA, Array.from(ev.target.files)); });
/* il file si lascia cadere SULLA RIGA (regola 4): fuori da una riga non succede niente, e il browser non apre il file */
function escRigaDi(ev) { var t = ev.target.closest && ev.target.closest('[data-fila]'); return t; }
document.addEventListener('dragover', function (ev) { ev.preventDefault(); document.querySelectorAll('.tarea.sobre').forEach(function (x) { x.classList.remove('sobre'); }); var t = escRigaDi(ev); if (t && !t.classList.contains('espera')) t.classList.add('sobre'); });
document.addEventListener('dragleave', function (ev) { var t = escRigaDi(ev); if (t && !t.contains(ev.relatedTarget)) t.classList.remove('sobre'); });
document.addEventListener('drop', function (ev) { ev.preventDefault(); document.querySelectorAll('.tarea.sobre').forEach(function (x) { x.classList.remove('sobre'); }); var t = escRigaDi(ev); if (!t || !ev.dataTransfer || !ev.dataTransfer.files.length) return; var id = t.getAttribute('data-fila'); if (S.res[id] && S.res[id].k === 'va') return; escSuelta(id, Array.from(ev.dataTransfer.files)); });

/* risponde come `pinsita.carga`: stesso sha ⇒ gia_caricato; un file vuoto o senza la colonna «Fecha» in una cartola ⇒ rifiutato */
function escDemoCarga(cartella, b) {
  if (ESC_DEMO.visti[b.sha256]) return { esito: 'gia_caricato', nuove: 0, gia: b.filas.length, caricato_ts: ESC_DEMO.visti[b.sha256] };
  if (cartella === 'santander' && b.filas.length && !Object.keys(b.filas[0]).some(function (k) { return /fecha/i.test(k); })) return { esito: 'rifiutato', motivo: 'columnas', mensaje: 'Falta la columna «Fecha». ¿Lo bajaste en Excel desde el banco? Inténtalo de nuevo; si vuelve a fallar, avísale a Alberto.' };
  ESC_DEMO.visti[b.sha256] = Date.now();
  return { esito: 'caricato', nuove: b.filas.length, gia: 0, scarto: 0 };
}
