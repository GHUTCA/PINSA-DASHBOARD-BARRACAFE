var QS = new URLSearchParams(location.search);
var DEMO = QS.get('demo') === '1';
/* ═══ ESC_API · i contratti, in un posto solo ═══

       {esito:'caricato'|'gia_caricato'|'rifiutato', nuove, gia, scarto, motivo, mensaje, desde, hasta}. `cuenta4` e `desde/hasta`: sì del 🎛.
       Rifiuti noti: cartella_no_permitida · archivo_grande (2 MB / 20.000 righe) · cuenta_otra. */
var ESC_API = {
  auth: function () { return CFG.BORDE + '/auth'; },
  lista: function () { return CFG.BORDE + '/carga/pendientes'; },

var S = { token: '', nombre: '', lev: null, lista: null, err: '', res: {}, hoy: { archivos: 0, filas: 0 }, cargando: false, pinErr: '', entrando: false, usuarios: null, chi: null, primo: false };
try { S.token = sessionStorage.getItem('esc_token') || ''; S.nombre = sessionStorage.getItem('esc_nombre') || ''; } catch (e) {}

function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pesos(n) { n = Math.round(Number(n) || 0); return (n < 0 ? '−$' : '$') + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
var MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function fdia(d) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || '')); return m ? (+m[3]) + '-' + MESES[+m[2] - 1] : esc(d || ''); }
function fmes(m) { var k = /^(\d{4})-(\d{2})/.exec(String(m || '')); return k ? MESES_L[+k[2] - 1] : esc(m || ''); }
function hora(ts) { var d = ts ? new Date(ts) : new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

/* ── la rete (il bordo finto in demo) ── */
async function escFetch(url, op, ms) {
  var ctrl = new AbortController(), to = setTimeout(function () { ctrl.abort(); }, ms || 10000);
  try { var r = await fetch(url, Object.assign({ cache: 'no-store', signal: ctrl.signal }, op || {})); var j = await r.json().catch(function () { return null; }); clearTimeout(to); return j ? Object.assign({ _status: r.status }, j) : { _rete: true, _status: r.status }; }
  catch (e) { clearTimeout(to); return { _rete: true }; }
}
function escAuth() { return S.token ? { Authorization: 'Bearer ' + S.token } : {}; }

}

}

}
/* la lista di 🧾 (`lista_mattina.mjs --json`) → le righe della pagina. Un posto solo: se cambia un nome, cambia qui. */
var ESC_CARTELLA = { mp_estado: 'mp' };   // 🚚 «ⓐ, GIÀ DENTRO 73ab45d144»: le cartelle della porta sono bancos · sii · mp · caja · rrhh
function escCart(c) { return ESC_CARTELLA[c] || c; }

  if (!j || j._rete || j._status === 401 || j._status === 403 || !Array.isArray(j.filas)) return j;

/* ── leggere il file: lo sha dei byte, le righe come {intestazione: valore} (stringhe, così come escono) ── */
async function escSha(buf) { var h = await crypto.subtle.digest('SHA-256', buf); return Array.from(new Uint8Array(h)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join(''); }
function escCsv(txt) {
  txt = txt.replace(/^﻿/, '');
  var prima = (txt.split(/\r?\n/).filter(function (l) { return l.trim(); })[0]) || '';
  var sep = [';', ',', '\t'].reduce(function (a, s) { return prima.split(s).length > prima.split(a).length ? s : a; }, ',');
  var righe = [], cur = [], f = '', q = false;
  for (var i = 0; i < txt.length; i++) {
    var c = txt[i];
    if (q) { if (c === '"') { if (txt[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === sep) { cur.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && txt[i + 1] === '\n') i++; cur.push(f); f = ''; if (cur.some(function (x) { return x.trim(); })) righe.push(cur); cur = []; }
    else f += c;

function escOggetti(righe) {

  var head = righe[0].map(function (h, i) { h = String(h || '').trim(); return h || ('col' + (i + 1)); });

var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function escXlsxLib() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise(function (ok, ko) { var s = document.createElement('script'); s.src = XLSX_URL; s.onload = function () { window.XLSX ? ok(window.XLSX) : ko(new Error('xlsx')); }; s.onerror = function () { ko(new Error('xlsx')); }; document.head.appendChild(s); });

function escFechaIso(v) { v = String(v || '').trim(); var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v); if (m) return m[1] + '-' + m[2] + '-' + m[3];
  m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})\b/.exec(v); if (m && +m[2] >= 1 && +m[2] <= 12 && +m[1] >= 1 && +m[1] <= 31) return m[3] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0'); return null; }
function escPeriodo(filas) {   // la prima colonna che si chiama «Fecha…»: il giorno più vecchio e il più recente. Senza colonna o senza date chiare: niente
  var k = filas.length ? Object.keys(filas[0]).filter(function (h) { return /fecha/i.test(h); })[0] : null; if (!k) return {};
  var ds = filas.map(function (r) { return escFechaIso(r[k]); }).filter(Boolean).sort(); return ds.length ? { desde: ds[0], hasta: ds[ds.length - 1] } : {}; }

/* ── le quattro risposte ── */
var ESC_MOTIVO = {
  formato: ['No pudimos leerlo', 'Súbelo como Excel (.xlsx) o CSV, como lo baja el banco o el SII.'],
  vacio: ['No pudimos leerlo', 'El archivo no tiene filas. ¿Es el archivo correcto? Inténtalo de nuevo; si vuelve a fallar, avísale a Alberto.'],

  cartella_sin_tabla: ['Esta fila todavía no recibe archivos', 'Avísale a Alberto: no se guardó nada.'],
  columnas: ['No pudimos leerlo', 'Faltan columnas que esperamos. ¿Lo bajaste en Excel desde el banco? Inténtalo de nuevo; si vuelve a fallar, avísale a Alberto.'],
  sesion: ['Tu sesión se cerró', 'Vuelve a entrar con tu PIN y suelta el archivo de nuevo.'],

function escResDe(r, f, lido) {

  if (r._status === 401 || r._status === 403) return { k: 'no', t: '✗ ' + ESC_MOTIVO.sesion[0], s: ESC_MOTIVO.sesion[1] };

  ESC_DEMO.visti[b.sha256] = Date.now();
  return { esito: 'caricato', nuove: b.filas.length, gia: 0, scarto: 0 };
}

escLeva().then(function () { if (S.token) escCarica(); else escUsuarios().then(pinta); });
pinta();
</script>
