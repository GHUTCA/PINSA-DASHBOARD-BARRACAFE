<script>
'use strict';
var JL_VER = 'jl v0.1.2';
var QS = new URLSearchParams(location.search);
var CFG = {
  BORDE: 'https://pinsita-borde.alberto-agostini.workers.dev',
  T: '7QvreCN5fzM40GW2Me8vfvNwIwcA9RDnTceXMwgZ',
  LOCAL: ({ bks: 'BKS', rsc: 'RIESCO', cdl: 'CANDELARIA' })[String(QS.get('loc') || 'bks').toLowerCase()] || 'BKS'
};
var DEMO = QS.get('demo') === '1' || location.hash === '#demo';
/* le costanti PROVVISORIE del v16 (bacheca «SÌ AL PIANO» ⑦): si cambiano qui, con una riga, quando Alberto dà i numeri */
var JL_REFILL_MIN = 15;     // Entregado da 15′ senza un pedido nuovo ⇒ «Refill»
var JL_PIDIO_URGE_MIN = 10; // un pedido che aspetta da 10′ ⇒ «esperan tu acción»
var JL_POLL_MS = 20000;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pesos(n) { n = Math.round(Number(n) || 0); return (n < 0 ? '−' : '') + '$' + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function jlSlug(s) { var t = String(s || '').trim().toLowerCase(); try { t = t.normalize('NFD').replace(/[̀-ͯ]/g, ''); } catch (e) {} return t.replace(/[^a-z0-9]/g, ''); }
/* le mesas di una plaza: lista, oppure testo «20-24, 30» (stessa regola di vvMesasDePlaza della sala nueva) */
function jlMesasDePlaza(spec) {
  if (Array.isArray(spec)) return spec.map(String);
  var out = [];
  String(spec || '').split(/[,\s]+/).forEach(function (t) {
    if (!t) return;
    var r = t.match(/^(\d+)-(\d+)$/);
    if (r) { for (var i = +r[1]; i <= +r[2]; i++) out.push(String(i)); } else out.push(t);
  });
  return out;
}
function jlMinDe(it, ora) {
  if (it && typeof it.hace_s === 'number') return Math.max(0, Math.floor(it.hace_s / 60));
  var t = Number(it && (it.ts || it.t) || 0);
  if (t > 1e12) return Math.max(0, Math.floor((ora - t) / 60000));
  return null;
}
function jlItemsDe(it) {
  var a = []; try { a = JSON.parse((it && it.items_json) || '[]') || []; } catch (e) { a = []; }
  return a.map(function (i) {
    var q = Number(i.qty || i.q || i.cantidad || 1) || 1, p = Number(i.precio != null ? i.precio : i.p) || 0;
    var n = String(i.nombre || i.n || '').trim();
    return n ? { n: n + (i.op ? ' · ' + i.op : ''), q: q, p: p } : null;
  }).filter(Boolean);
}

/* ═══ IL VOCABOLARIO DEGLI STATI (validato il 15-nov, stesso nome in tutte le stanze) ═══
   «Pagando» non c'è: oggi nessun campo del bordo dice «il cobro è cominciato e non è finito» (bacheca, punto ③ di «SÌ AL PIANO»). */
var ESTADO = { aut: 'AUT QR', llamando: 'Llamando', cuenta: 'Cuenta pedida', refill: 'Refill', pidio: 'Pidió', entregado: 'Entregado', pagado: 'Pagado', libre: 'Libre' };
/* l'ordine d'urgenza del v16: chi blocca la vendita sta in cima. null = non aspetta un gesto adesso */
function jlPrioridad(x) {
  if (x.st === 'aut') return 0;
  if (x.st === 'llamando') return 1;
  if (x.st === 'cuenta') return 2;
  if (x.st === 'refill') return 4;
  if (x.st === 'pidio' && x.min != null && x.min >= JL_PIDIO_URGE_MIN) return 5;
  return null;
}
function jlUrgente(x) { return jlPrioridad(x) !== null; }

/* ═══ L'ADATTATORE: la sala del bordo (`datos` di sala_vista) → il modello del vetro. FUNZIONE PURA: niente rete, niente DOM. ═══
   Per ogni mesero (`meseros[slug]`): le mesas delle sue plazas (`plazas_detalle`), i conti (`mesas` con `items`/`total`), i pedidos vivi
   (`mios` = nel conto e non ancora entregados, `por_limpiar` = entregados), i QR che aspettano (`pendientes` della fetta + `qr_espera` in cima),
   le chiamate (`llamadas`), il già pagato (`mesas_pagadas[m].pagado_seduta`), la venta (`venta_turno.venta`). Pax e minuti seduti dall'anfitriona
   (`datos.anfitriona`, solo se il bordo la manda: leva ANFITRIONA_BORDE_ON). */
function jlModelo(dd, ora) {
  ora = ora || Date.now();
  var gente = [], dueno = {};
  var mese = (dd && dd.meseros && typeof dd.meseros === 'object') ? dd.meseros : {};
  var anf = {};
  ((dd && dd.anfitriona && dd.anfitriona.plazas) || []).forEach(function (p) {
    (p.mesas || []).forEach(function (m) { if (m && m.mesa != null) anf[String(m.mesa)] = m; });
  });
  Object.keys(mese).sort().forEach(function (slug) {
    var v = mese[slug]; if (!v || v.ok === false) return;
    var mapa = {}, orden = [];
    function mesa(m, plz) {
      m = String(m);
      if (!mapa[m]) { mapa[m] = { m: m, plz: plz || '', st: 'libre', min: null, tot: 0, pagado: 0, items: [], _vivo: false, pax: null, sentada: null }; orden.push(m); }
      if (plz && !mapa[m].plz) mapa[m].plz = plz;
      return mapa[m];
    }
    var plazas = (v.plazas_detalle || []).map(function (p) {
      var ms = jlMesasDePlaza(p.mesas); ms.forEach(function (m) { mesa(m, String(p.plaza)); });
      return { nombre: String(p.plaza), mesas: ms };
    });
    if (!plazas.length) (v.plazas || []).forEach(function (p) { plazas.push({ nombre: String(p), mesas: [] }); });
    (v.mesas || []).forEach(function (r) {
      var x = mesa(r.mesa, r.plaza ? String(r.plaza) : ''); x._vivo = true;
      x.tot = Math.round(Number(r.total) || 0);
      if (r.items && r.items.length) { x.items = r.items.map(function (i) { return { n: String(i.n || ''), q: Number(i.q) || 1, p: Number(i.p) || 0 }; }); x._daConto = true; }
    });
    /* le righe dai pedidos vivi quando la vista non porta il conto (stessa regola della sala nueva v0.8.5) */
    var ped = { mios: {}, limp: {} };
    (v.mios || []).forEach(function (it) {
      var x = mesa(it.mesa, String(it.plaza || '')); x._vivo = true; var mn = jlMinDe(it, ora);
      if (!x._daConto) { jlItemsDe(it).forEach(function (i) { x.items.push(i); }); }
      if (mn != null && (ped.mios[x.m] == null || mn > ped.mios[x.m])) ped.mios[x.m] = mn;   // il pedido che aspetta da più tempo
      if (ped.mios[x.m] == null) ped.mios[x.m] = -1;
    });
    (v.por_limpiar || []).forEach(function (it) {
      var x = mesa(it.mesa, String(it.plaza || '')); x._vivo = true; var mn = jlMinDe(it, ora);
      if (!x._daConto) { jlItemsDe(it).forEach(function (i) { x.items.push(i); }); }
      if (mn != null && (ped.limp[x.m] == null || mn < ped.limp[x.m])) ped.limp[x.m] = mn;   // l'ultimo entregado
      if (ped.limp[x.m] == null) ped.limp[x.m] = -1;
    });
    orden.forEach(function (k) {
      var x = mapa[k];
      if (!x._daConto && x.items.length) x.tot = x.items.reduce(function (a, i) { return a + i.q * i.p; }, 0);
    });
    var aut = {};
    (v.pendientes || []).forEach(function (it) {
      var x = mesa(it.mesa, String(it.plaza || '')); var mn = jlMinDe(it, ora);
      if (aut[x.m] == null || (mn != null && mn > aut[x.m])) aut[x.m] = mn == null ? -1 : mn;
      x.qrTot = (x.qrTot || 0) + Math.round(Number(it.total) || 0);
    });
    var llam = {};
    (v.llamadas || []).forEach(function (l) {
      var x = mesa(l.mesa, String(l.plaza || '')); var mn = jlMinDe(l, ora);
      var k = l.motivo === 'cuenta' ? 'cuenta' : 'llamando';
      if (!llam[x.m] || (k === 'llamando' && llam[x.m].k === 'cuenta')) llam[x.m] = { k: k, min: mn };
    });
    var mp = (v.mesas_pagadas && typeof v.mesas_pagadas === 'object' && !Array.isArray(v.mesas_pagadas)) ? v.mesas_pagadas : {};
    orden.forEach(function (k) {
      var x = mapa[k];
      x.pagado = Math.round(parseFloat((mp[k] || {}).pagado_seduta) || 0);
      var a = anf[k]; if (a && x._vivo) { if (a.pax != null && a.pax !== '') x.pax = Number(a.pax) || null; if (a.desde_iso) { var t = Date.parse(a.desde_iso); if (t > 0) x.sentada = Math.max(0, Math.floor((ora - t) / 60000)); } }
      function con(st, mn) { x.st = st; x.min = (mn == null || mn < 0) ? null : mn; }
      if (aut[k] != null) con('aut', aut[k]);
      else if (llam[k] && llam[k].k === 'llamando') con('llamando', llam[k].min);
      else if (llam[k]) con('cuenta', llam[k].min);
      else if (ped.mios[k] != null) con('pidio', ped.mios[k]);
      else if (ped.limp[k] != null) con(ped.limp[k] >= JL_REFILL_MIN ? 'refill' : 'entregado', ped.limp[k]);
      else if (x._vivo) con('entregado', null);
      /* [v0.1.2 · 🔴 K4 di 💵 EL GIRO «JLMODELO 8F09D05»] «Pagado» SOLO su una mesa senza pedidos vivi e con un pago nella seduta. Prima: `pagado >= tot`,
         ma `tot` sono i pedidos ANCORA APERTI e `pagado_seduta` TUTTI i pagos della seduta, anche quelli che hanno già chiuso i loro: sottratto due
         volte (lo stesso difetto dell'AUT-0460 in sala.html), una mesa che deve ancora pagare si leggeva pagata e usciva dal «$ en juego». */
      else if (x.pagado > 0) con('pagado', null);
      else con('libre', null);
      (dueno[k] || (dueno[k] = [])).push(slug);
    });
    var mesas = orden.map(function (k) { return mapa[k]; }).sort(function (a, b) {
      var na = parseInt(a.m, 10), nb = parseInt(b.m, 10);
      return (isNaN(na) || isNaN(nb)) ? (a.m < b.m ? -1 : 1) : na - nb;
    });
    if (!plazas.length && !mesas.some(function (x) { return x.st !== 'libre'; })) return;   // nessuna plaza e niente di vivo: non è in sala
    var vt = v.venta_turno || {};
    gente.push({ slug: slug, n: String(v.nombre || slug), plazas: plazas, mesas: mesas,
      venta: (typeof vt.venta === 'number') ? vt.venta : null });
  });
  /* i QR in cima alla lettura (`qr_espera`): se la mesa è di un garzón e la sua fetta non lo porta già, la sua scheda diventa AUT QR */
  var sinDueno = [];
  ((dd && dd.qr_espera) || []).forEach(function (q) {
    if (!q || q.mesa == null) return;
    var m = String(q.mesa), ss = dueno[m] || [], mn = jlMinDe(q, ora);
    var visti = gente.filter(function (g) { return ss.indexOf(g.slug) >= 0; }).map(function (g) { return g.mesas.filter(function (y) { return y.m === m; })[0]; }).filter(Boolean);
    if (!visti.length) { sinDueno.push({ m: m, min: mn, tot: Math.round(Number(q.total) || 0) }); return; }
    visti.forEach(function (x) { if (x.st !== 'aut') { x.st = 'aut'; x.min = mn; x.qrTot = Math.round(Number(q.total) || 0); } });
  });
  /* «$ en juego»: il conto della mesa, più ciò che il QR chiede e nessuno ha ancora accettato.
     [v0.1.2 · 🔴 K8 di 💵] il bordo mette la stessa mesa nella fetta di chi ha la plaza E di chi l'ha servita: la scheda si vede in tutte e due,
     il totale in cima si conta PER MESA, una volta sola (la scheda più urgente). Il «$ en juego» è il conto dei pedidos aperti, non il resto
     dopo un pago parziale (K3b, dichiarato: si decide con 🎨). */
  var perMesa = {};
  gente.forEach(function (g) { g.mesas.forEach(function (x) {
    if (!jlUrgente(x)) return;
    var p = perMesa[x.m], v = x.tot + (x.st === 'aut' ? (x.qrTot || 0) : 0);
    if (!p || jlPrioridad(x) < p.pr || (jlPrioridad(x) === p.pr && v > p.v)) perMesa[x.m] = { pr: jlPrioridad(x), v: v };
  }); });
  var nT = 0, tot = 0;
  Object.keys(perMesa).forEach(function (m) { nT++; tot += perMesa[m].v; });
  sinDueno.forEach(function (q) { nT++; tot += q.tot; });
  return { gente: gente, sinDueno: sinDueno, nUrg: nT, enJuego: tot };
}

/* ═══ LA SESSIONE DEL JL (fase 1: quella che app_jl ha già) ═══ */
var SES = (function () {
  var pin = '', user = '', codigo = '';
  try { pin = sessionStorage.getItem('jl_pin') || ''; user = sessionStorage.getItem('jl_user') || ''; codigo = sessionStorage.getItem('jl_codigo') || ''; } catch (e) {}
  if (!codigo) {
    try {
      var c = JSON.parse(localStorage.getItem('jl_cache_' + CFG.LOCAL) || 'null');
      /* un codigo di ieri non si filtra qui: il bordo risponde `codigo_invalid` e il vetro manda il JL alla sua app, che legge il turno nuovo */
      var cod = c && ((c.turno && c.turno.turno && c.turno.turno.codigo) || c.turnoCod);
      if (cod) codigo = String(cod);
      if (!user && c && c.user) user = String(c.user);
    } catch (e) {}
  }
  return { pin: pin, user: user, codigo: codigo };
})();
function jlAppUrl() { return 'app_jl.html?loc=' + ({ BKS: 'bks', RIESCO: 'rsc', CANDELARIA: 'cdl' })[CFG.LOCAL] + (DEMO ? '&demo=1' : ''); }

var VISTA = { mod: null, ts: 0, edadBordeS: null, err: '', filtro: false, exp: {}, tab: 0, aperta: null };

/* ═══ IL CODIGO DEL TURNO DAL BORDO (⚙️ ARQ, bacheca «A BKS IL TURNO SI APRE GIÀ SUL BORDO») ═══
   `POST /turno/admin/<local>` {pin_jl}: a BKS il turno si apre sul bordo (TURNO_ABRE_BORDE_ON) e la risposta `fuente:'borde'` porta
   `turno.codigo`. Prima dell'apertura: `gate_spento` ⇒ «Turno sin abrir» (senza turno non c'è sala). Un PIN rifiutato ⇒ si torna all'app.
   `fuente:'ponte'` (turno sul GAS, oggi spento a BKS) non ha il codigo: si resta col codigo della sessione di app_jl, se c'è. */
async function jlCodigoDalBordo() {
  var ctrl = new AbortController(), to = setTimeout(function () { ctrl.abort(); }, 6000);
  try {
    var r = await fetch(CFG.BORDE + '/turno/admin/' + encodeURIComponent(CFG.LOCAL === 'RIESCO' ? 'RSC' : CFG.LOCAL === 'CANDELARIA' ? 'CDL' : CFG.LOCAL),
      { method: 'POST', headers: { 'content-type': 'application/json', 'x-borde-token': CFG.T }, body: JSON.stringify({ pin_jl: SES.pin }), signal: ctrl.signal, cache: 'no-store' });
    var j = await r.json().catch(function () { return null; });
    clearTimeout(to);
    if (j && j.ok === true && j.scritto === false && j.motivo === 'gate_spento') { VISTA.err = 'turno_sin_abrir'; return; }
    if (j && j.ok === false && /^pin(_jl)?_bloqueado/.test(String(j.error || ''))) { VISTA.err = 'El PIN quedó bloqueado' + (+j.faltan_s ? ' · faltan ' + Math.ceil(+j.faltan_s / 60) + ' min' : ''); return; }
    if (j && j.ok === false && /^pin(_jl)?_/.test(String(j.error || ''))) { VISTA.err = 'pin_mal'; return; }
    var cod = j && j.ok === true && j.fuente === 'borde' && j.turno && j.turno.codigo;
    if (cod) { SES.codigo = String(cod); if (j.user && !SES.user) SES.user = String(j.user); try { sessionStorage.setItem('jl_codigo', SES.codigo); } catch (e) {} VISTA.err = ''; }
  } catch (e) { clearTimeout(to); }
}

/* ═══ LA LETTURA ═══ */
async function jlLeggi() {
  if (DEMO) { VISTA.mod = jlModelo(JL_DEMO, Date.now()); VISTA.ts = Date.now(); VISTA.err = ''; jlPinta(); return; }
  if (!SES.codigo && SES.pin) await jlCodigoDalBordo();
  if (!SES.codigo) { if (!VISTA.err || VISTA.err === 'codigo_invalid') VISTA.err = 'sin_codigo'; jlPinta(); return; }
  var ctrl = new AbortController(), to = setTimeout(function () { ctrl.abort(); }, 6000), http = 0;
  try {
    var u = CFG.BORDE + '/estado/' + encodeURIComponent(CFG.LOCAL) + '?t=' + encodeURIComponent(CFG.T) + '&seccion=sala_vista&codigo=' + encodeURIComponent(SES.codigo);
    var r = await fetch(u, { signal: ctrl.signal, cache: 'no-store' });
    http = r.status;
    var j = await r.json();
    clearTimeout(to);
    if (j && j.error === 'codigo_invalid') {   // il turno è cambiato: il codigo nuovo si chiede al bordo, al giro dopo
      VISTA.err = 'codigo_invalid'; SES.codigo = ''; try { sessionStorage.removeItem('jl_codigo'); } catch (e2) {}
      jlPinta(); return;
    }
    var dd = j && j.ok && j.datos && j.datos.datos;
    if (!dd || !dd.meseros) { VISTA.err = 'El bordo no trae la sala (HTTP ' + http + ')'; jlPinta(); return; }
    VISTA.mod = jlModelo(dd, Date.now()); VISTA.ts = Date.now(); VISTA.err = '';
    VISTA.edadBordeS = (typeof dd.edad_foto_s === 'number') ? dd.edad_foto_s : null;
  } catch (e) {
    clearTimeout(to);
    VISTA.err = (e && e.name === 'AbortError') ? 'Sin conexión con el bordo · tardó más de 6 s' : (http ? 'El bordo respondió algo que no se lee (HTTP ' + http + ')' : 'Sin conexión con el bordo');
  }
  jlPinta();
}

/* ═══ IL DISEGNO ═══ */
function jlEdad() {
  var el = document.getElementById('edad');
  if (DEMO) { el.className = 'edad'; el.textContent = 'Prueba · datos de ejemplo, no son del sistema'; return; }
  var ERR = { sin_codigo: 'Falta el código del turno', codigo_invalid: 'El código del turno cambió', turno_sin_abrir: 'Turno sin abrir', pin_mal: 'El PIN no vale' };
  var et = ERR[VISTA.err] || VISTA.err;
  if (VISTA.err && VISTA.ts) { el.className = 'edad mal'; el.textContent = '⚠️ ' + et + ' · lo que ves es de hace ' + Math.round((Date.now() - VISTA.ts) / 1000) + ' s'; return; }
  if (VISTA.err) { el.className = 'edad mal'; el.textContent = '⚠️ ' + et; return; }
  if (!VISTA.ts) { el.className = 'edad'; el.textContent = 'leyendo la sala…'; return; }
  var s = Math.round((Date.now() - VISTA.ts) / 1000) + (VISTA.edadBordeS || 0);
  el.className = 'edad'; el.textContent = 'Sala de hace ' + s + ' s';
}
function tarjeta(x, gi) {
  var lbl = ESTADO[x.st] + (x.min != null && jlUrgente(x) ? ' · ' + x.min + '′' : '');
  var px = x.pax ? '<small class="px">' + esc(x.pax) + ' pax</small>' : '';
  var mon = x.tot || (x.st === 'aut' ? (x.qrTot || 0) : 0);
  var inner = x.st === 'libre' ? '<small>libre</small>' : '<em class="mon">' + (mon ? pesos(mon) : '—') + '</em><small>' + esc(lbl) + '</small>';
  return '<div class="m ' + x.st + '" data-a="mesa" data-g="' + gi + '" data-m="' + esc(x.m) + '"><b>' + esc(x.m) + '</b>' + px + inner + '</div>';
}
function garzon(g, gi) {
  var abierto = VISTA.filtro ? true : !!VISTA.exp[g.slug];
  var urg = g.mesas.filter(jlUrgente).length;
  var chip = g.plazas.length > 1
    ? '<span class="chip">' + g.plazas.length + ' plazas</span>'
    : (g.plazas[0] ? '<span class="pill no">' + esc(g.plazas[0].nombre) + '</span>' : '<span class="pill no">sin plaza</span>');
  var h = '<div class="vetro gz"><div class="gz-h" data-a="gz" data-s="' + esc(g.slug) + '"><span class="dot"></span><b>' + esc(g.n) + '</b>' + chip + '<span class="chev">' + (abierto ? '▾' : '▸') + '</span></div>' +
    '<div class="gz-s"><span class="tc ok">en turno</span>' + (urg ? '<span class="tc bad">' + urg + ' esperan</span>' : '') +
    '<span class="num">venta ' + (g.venta == null ? 'sin dato' : pesos(g.venta)) + ' · obj. sin dato</span></div>';
  if (abierto) {
    var ms = g.mesas.filter(function (x) { return !VISTA.filtro || jlUrgente(x); });
    if (g.plazas.length > 1 && !VISTA.filtro) h += '<div class="sub">' + g.plazas.map(function (p) { return '<b>' + esc(p.nombre) + '</b> ' + esc(p.mesas.join(' · ')); }).join(' &nbsp;|&nbsp; ') + '</div>';
    h += '<div class="mesas">' + ms.map(function (x) { return tarjeta(x, gi); }).join('') + '</div>';
  }
  return h + '</div>';
}
function servicio() {
  var M = VISTA.mod;
  if (!M) {
    if (VISTA.err === 'sin_codigo') return '<div class="vetro alerta"><h4>Falta el código del turno</h4><p>Abre primero tu app de siempre: ella lee el turno. Después vuelve aquí.</p><a class="azione oro" href="' + esc(jlAppUrl()) + '">Ir a mi app</a></div>';
    if (VISTA.err === 'turno_sin_abrir') return '<div class="vetro lume"><h4>Turno sin abrir</h4><p>Cuando se abra el turno, aquí aparece la sala.</p></div>';
    if (VISTA.err === 'pin_mal') return '<div class="vetro alerta"><h4>El PIN no vale</h4><p>Entra de nuevo desde tu app.</p><a class="azione oro" href="' + esc(jlAppUrl()) + '">Ir a mi app</a></div>';
    if (VISTA.err === 'codigo_invalid') return '<div class="vetro alerta"><h4>El código del turno ya no vale</h4><p>Abre tu app de siempre para leer el turno nuevo.</p><a class="azione oro" href="' + esc(jlAppUrl()) + '">Ir a mi app</a></div>';
    return '<p class="vacio">' + (VISTA.err ? esc(VISTA.err) : 'Leyendo la sala…') + '</p>';
  }
  var h = M.nUrg
    ? '<button class="tira" data-a="filtro"><b>' + M.nUrg + ' esperan tu acción</b><span class="num">' + pesos(M.enJuego) + ' en juego · ' + (VISTA.filtro ? 'ver todas' : 'solo estas') + '</span></button>'
    : '<div class="tira ok"><b>Nadie espera tu acción</b></div>';
  if (M.sinDueno.length) h += '<div class="vetro alerta"><h4>QR sin garzón</h4>' + M.sinDueno.map(function (q) { return '<div class="riga"><span><b>Mesa ' + esc(q.m) + '</b><small>AUT QR' + (q.min != null ? ' · ' + q.min + '′' : '') + '</small></span><span class="st">' + (q.tot ? pesos(q.tot) : '—') + '</span></div>'; }).join('') + '</div>';
  M.gente.forEach(function (g, gi) {
    if (VISTA.filtro && !g.mesas.some(jlUrgente)) return;
    h += garzon(g, gi);
  });
  if (!M.gente.length) h += '<p class="vacio">No hay garzones en la sala de hoy.</p>';
  return h;
}
function detalle(gi, m) {
  var g = VISTA.mod && VISTA.mod.gente[gi]; var x = g && g.mesas.filter(function (y) { return y.m === m; })[0];
  if (!x) { VISTA.aperta = null; return servicio(); }
  var lin = x.items.map(function (i) { return '<div class="l"><span>' + i.q + ' × ' + esc(i.n) + '</span><b class="num">' + pesos(i.q * i.p) + '</b></div>'; }).join('');
  var sent = [];
  if (x.sentada != null) sent.push('Sentada hace ' + x.sentada + ' min');
  if (x.pax) sent.push(x.pax + ' pax');
  return '<span class="volver" data-a="volver">‹ Servicio</span>' +
    '<div class="conto"><div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:6px"><b>Mesa ' + esc(x.m) + ' · ' + esc(g.n) + '</b><span class="pill">' + esc(ESTADO[x.st]) + (x.min != null ? ' · ' + x.min + ' min' : '') + '</span></div>' +
    (lin || '<p class="vacio">Sin consumo todavía.</p>') +
    (x.tot ? '<div class="tot"><span>Total</span><span class="num">' + pesos(x.tot) + '</span></div>' : '') +
    (x.pagado > 0 ? '<div class="sub">Pagado ' + pesos(x.pagado) + '</div>' : '') +
    (sent.length ? '<div class="sub">' + esc(sent.join(' · ')) + '</div>' : '') + '</div>';
}
function local() { return '<div class="vetro"><h4>86 · reservas · turnos</h4><p>Todavía en tu app de siempre.</p><a class="azione" href="' + esc(jlAppUrl()) + '">Ir a mi app</a></div>'; }
function enApp() { return '<div class="vetro"><p>Esta parte sigue en tu app de siempre.</p><a class="azione" href="' + esc(jlAppUrl()) + '">Ir a mi app</a></div>'; }
var VIS = [servicio, local, enApp, enApp, enApp];
function jlPinta() {
  jlEdad();
  var b = document.getElementById('body'), y = b.scrollTop;
  b.innerHTML = (VISTA.tab === 0 && VISTA.aperta) ? detalle(VISTA.aperta.g, VISTA.aperta.m) : VIS[VISTA.tab]();
  b.scrollTop = y;
}
function ir(i) {
  VISTA.tab = i; VISTA.aperta = null;
  document.querySelectorAll('.tabs button').forEach(function (b, j) { b.setAttribute('aria-selected', j === i ? 'true' : 'false'); });
  jlPinta(); document.getElementById('body').scrollTop = 0;
}
document.getElementById('body').addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-a]'); if (!el) return;
  var a = el.getAttribute('data-a');
  if (a === 'filtro') { VISTA.filtro = !VISTA.filtro; jlPinta(); }
  else if (a === 'gz') { var s = el.getAttribute('data-s'); VISTA.exp[s] = !VISTA.exp[s]; jlPinta(); }
  else if (a === 'mesa') { VISTA.aperta = { g: +el.getAttribute('data-g'), m: el.getAttribute('data-m') }; jlPinta(); document.getElementById('body').scrollTop = 0; }
  else if (a === 'volver') { VISTA.aperta = null; jlPinta(); }
});
