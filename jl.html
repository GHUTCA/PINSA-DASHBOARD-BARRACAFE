<script>
'use strict';
var JL_VER = 'jl v0.4.2';
var QS = new URLSearchParams(location.search);
var CFG = {
  BORDE: 'https://pinsita-borde.alberto-agostini.workers.dev',
  T: '7QvreCN5fzM40GW2Me8vfvNwIwcA9RDnTceXMwgZ',
  LOCAL: ({ bks: 'BKS', rsc: 'RIESCO', cdl: 'CANDELARIA' })[String(QS.get('loc') || 'bks').toLowerCase()] || 'BKS'
};
var DEMO = QS.get('demo') === '1' || location.hash === '#demo';
/* le costanti PROVVISORIE del v16 (bacheca «SÌ AL PIANO» ⑦): si cambiano qui, con una riga, quando Alberto dà i numeri */
var JL_REFILL_MIN = 15;     // Entregado da 15′ senza un pedido nuovo ⇒ «Refill»
var JL_PIDIO_URGE_MIN = 10; // un pedido che aspetta da 10′ ⇒ «esperan tu acción»
var JL_POLL_MS = 20000;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pesos(n) { n = Math.round(Number(n) || 0); return (n < 0 ? '−' : '') + '$' + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function jlSlug(s) { var t = String(s || '').trim().toLowerCase(); try { t = t.normalize('NFD').replace(/[̀-ͯ]/g, ''); } catch (e) {} return t.replace(/[^a-z0-9]/g, ''); }
/* le mesas di una plaza: lista, oppure testo «20-24, 30» (stessa regola di vvMesasDePlaza della sala nueva) */
function jlMesasDePlaza(spec) {
  if (Array.isArray(spec)) return spec.map(String);
  var out = [];
  String(spec || '').split(/[,\s]+/).forEach(function (t) {
    if (!t) return;
    var r = t.match(/^(\d+)-(\d+)$/);
    if (r) { for (var i = +r[1]; i <= +r[2]; i++) out.push(String(i)); } else out.push(t);
  });
  return out;
}
function jlMinDe(it, ora) {
  if (it && typeof it.hace_s === 'number') return Math.max(0, Math.floor(it.hace_s / 60));
  var t = Number(it && (it.ts || it.t) || 0);
  if (t > 1e12) return Math.max(0, Math.floor((ora - t) / 60000));
  return null;
}
function jlItemsDe(it) {
  var a = []; try { a = JSON.parse((it && it.items_json) || '[]') || []; } catch (e) { a = []; }
  return a.map(function (i) {
    var q = Number(i.qty || i.q || i.cantidad || 1) || 1, p = Number(i.precio != null ? i.precio : i.p) || 0;
    var n = String(i.nombre || i.n || '').trim();
    return n ? { n: n + (i.op ? ' · ' + i.op : ''), q: q, p: p } : null;
  }).filter(Boolean);
}

/* ═══ IL VOCABOLARIO DEGLI STATI (validato il 15-nov, stesso nome in tutte le stanze) ═══
   «Pagando» non c'è: oggi nessun campo del bordo dice «il cobro è cominciato e non è finito» (bacheca, punto ③ di «SÌ AL PIANO»). */
var ESTADO = { aut: 'AUT QR', llamando: 'Llamando', cuenta: 'Cuenta pedida', refill: 'Refill', pidio: 'Pidió', entregado: 'Entregado', pagado: 'Pagado', libre: 'Libre' };
/* l'ordine d'urgenza del v16: chi blocca la vendita sta in cima. null = non aspetta un gesto adesso */
function jlPrioridad(x) {
  if (x.st === 'aut') return 0;
  if (x.st === 'llamando') return 1;
  if (x.st === 'cuenta') return 2;
  if (x.st === 'refill') return 4;
  if (x.st === 'pidio' && x.min != null && x.min >= JL_PIDIO_URGE_MIN) return 5;
  return null;
}
function jlUrgente(x) { return jlPrioridad(x) !== null; }

/* ═══ L'ADATTATORE: la sala del bordo (`datos` di sala_vista) → il modello del vetro. FUNZIONE PURA: niente rete, niente DOM. ═══
   Per ogni mesero (`meseros[slug]`): le mesas delle sue plazas (`plazas_detalle`), i conti (`mesas` con `items`/`total`), i pedidos vivi
   (`mios` = nel conto e non ancora entregados, `por_limpiar` = entregados), i QR che aspettano (`pendientes` della fetta + `qr_espera` in cima),
   le chiamate (`llamadas`), il già pagato (`mesas_pagadas[m].pagado_seduta`), la venta (`venta_turno.venta`). Pax e minuti seduti dall'anfitriona
   (`datos.anfitriona`, solo se il bordo la manda: leva ANFITRIONA_BORDE_ON). */
function jlModelo(dd, ora) {
  ora = ora || Date.now();
  var gente = [], dueno = {};
  var mese = (dd && dd.meseros && typeof dd.meseros === 'object') ? dd.meseros : {};
  var anf = {};
  ((dd && dd.anfitriona && dd.anfitriona.plazas) || []).forEach(function (p) {
    (p.mesas || []).forEach(function (m) { if (m && m.mesa != null) anf[String(m.mesa)] = m; });
  });
  Object.keys(mese).sort().forEach(function (slug) {
    var v = mese[slug]; if (!v || v.ok === false) return;
    var mapa = {}, orden = [];
    function mesa(m, plz) {
      m = String(m);
      if (!mapa[m]) { mapa[m] = { m: m, plz: plz || '', st: 'libre', min: null, tot: 0, pagado: 0, items: [], _vivo: false, pax: null, sentada: null }; orden.push(m); }
      if (plz && !mapa[m].plz) mapa[m].plz = plz;
      return mapa[m];
    }
    var plazas = (v.plazas_detalle || []).map(function (p) {
      var ms = jlMesasDePlaza(p.mesas); ms.forEach(function (m) { mesa(m, String(p.plaza)); });
      return { nombre: String(p.plaza), mesas: ms };
    });
    if (!plazas.length) (v.plazas || []).forEach(function (p) { plazas.push({ nombre: String(p), mesas: [] }); });
    (v.mesas || []).forEach(function (r) {
      var x = mesa(r.mesa, r.plaza ? String(r.plaza) : ''); x._vivo = true;
      x.tot = Math.round(Number(r.total) || 0);
      if (r.items && r.items.length) { x.items = r.items.map(function (i) { return { n: String(i.n || ''), q: Number(i.q) || 1, p: Number(i.p) || 0 }; }); x._daConto = true; }
    });
    /* le righe dai pedidos vivi quando la vista non porta il conto (stessa regola della sala nueva v0.8.5) */
    var ped = { mios: {}, limp: {} };
    (v.mios || []).forEach(function (it) {
      var x = mesa(it.mesa, String(it.plaza || '')); x._vivo = true; var mn = jlMinDe(it, ora);
      if (!x._daConto) { jlItemsDe(it).forEach(function (i) { x.items.push(i); }); }
      if (mn != null && (ped.mios[x.m] == null || mn > ped.mios[x.m])) ped.mios[x.m] = mn;   // il pedido che aspetta da più tempo
      if (ped.mios[x.m] == null) ped.mios[x.m] = -1;
    });
    (v.por_limpiar || []).forEach(function (it) {
      var x = mesa(it.mesa, String(it.plaza || '')); x._vivo = true; var mn = jlMinDe(it, ora);
      if (!x._daConto) { jlItemsDe(it).forEach(function (i) { x.items.push(i); }); }
      if (mn != null && (ped.limp[x.m] == null || mn < ped.limp[x.m])) ped.limp[x.m] = mn;   // l'ultimo entregado
      if (ped.limp[x.m] == null) ped.limp[x.m] = -1;
    });
    orden.forEach(function (k) {
      var x = mapa[k];
      /* [v0.1.3 · 🔴 K8b di 💵] la riga `mesas` del bordo porta il conto della mesa INTERA (mio + ajeno); la fetta vede solo le righe dei suoi
         pedidos. La scheda dice il più alto dei due: mai meno del conto che il bordo stesso dà. */
      if (!x._daConto && x.items.length) x.tot = Math.max(x.tot, x.items.reduce(function (a, i) { return a + i.q * i.p; }, 0));
    });
    var aut = {};
    (v.pendientes || []).forEach(function (it) {
      var x = mesa(it.mesa, String(it.plaza || '')); var mn = jlMinDe(it, ora);
      if (aut[x.m] == null || (mn != null && mn > aut[x.m])) aut[x.m] = mn == null ? -1 : mn;
      x.qrTot = (x.qrTot || 0) + Math.round(Number(it.total) || 0);
    });
    var llam = {};
    (v.llamadas || []).forEach(function (l) {
      var x = mesa(l.mesa, String(l.plaza || '')); var mn = jlMinDe(l, ora);
      var k = l.motivo === 'cuenta' ? 'cuenta' : 'llamando';
      if (!llam[x.m] || (k === 'llamando' && llam[x.m].k === 'cuenta')) llam[x.m] = { k: k, min: mn };
    });
    var mp = (v.mesas_pagadas && typeof v.mesas_pagadas === 'object' && !Array.isArray(v.mesas_pagadas)) ? v.mesas_pagadas : {};
    orden.forEach(function (k) {
      var x = mapa[k];
      x.pagado = Math.round(parseFloat((mp[k] || {}).pagado_seduta) || 0);
      var a = anf[k]; if (a && x._vivo) { if (a.pax != null && a.pax !== '') x.pax = Number(a.pax) || null; if (a.desde_iso) { var t = Date.parse(a.desde_iso); if (t > 0) x.sentada = Math.max(0, Math.floor((ora - t) / 60000)); } }
      function con(st, mn) { x.st = st; x.min = (mn == null || mn < 0) ? null : mn; }
      if (aut[k] != null) con('aut', aut[k]);
      else if (llam[k] && llam[k].k === 'llamando') con('llamando', llam[k].min);
      else if (llam[k]) con('cuenta', llam[k].min);
      else if (ped.mios[k] != null) con('pidio', ped.mios[k]);
      else if (ped.limp[k] != null) con(ped.limp[k] >= JL_REFILL_MIN ? 'refill' : 'entregado', ped.limp[k]);
      else if (x._vivo) con('entregado', null);
      /* [v0.1.2 · 🔴 K4 di 💵 EL GIRO «JLMODELO 8F09D05»] «Pagado» SOLO su una mesa senza pedidos vivi e con un pago nella seduta. Prima: `pagado >= tot`,
         ma `tot` sono i pedidos ANCORA APERTI e `pagado_seduta` TUTTI i pagos della seduta, anche quelli che hanno già chiuso i loro: sottratto due
         volte (lo stesso difetto dell'AUT-0460 in sala.html), una mesa che deve ancora pagare si leggeva pagata e usciva dal «$ en juego». */
      else if (x.pagado > 0) con('pagado', null);
      else con('libre', null);
      (dueno[k] || (dueno[k] = [])).push(slug);
    });
    var mesas = orden.map(function (k) { return mapa[k]; }).sort(function (a, b) {
      var na = parseInt(a.m, 10), nb = parseInt(b.m, 10);
      return (isNaN(na) || isNaN(nb)) ? (a.m < b.m ? -1 : 1) : na - nb;
    });
    if (!plazas.length && !mesas.some(function (x) { return x.st !== 'libre'; })) return;   // nessuna plaza e niente di vivo: non è in sala
    var vt = v.venta_turno || {};
    gente.push({ slug: slug, n: String(v.nombre || slug), plazas: plazas, mesas: mesas,
      venta: (typeof vt.venta === 'number') ? vt.venta : null });
  });
  /* i QR in cima alla lettura (`qr_espera`): se la mesa è di un garzón e la sua fetta non lo porta già, la sua scheda diventa AUT QR */
  var sinDueno = [];
  ((dd && dd.qr_espera) || []).forEach(function (q) {
    if (!q || q.mesa == null) return;
    var m = String(q.mesa), ss = dueno[m] || [], mn = jlMinDe(q, ora);
    var visti = gente.filter(function (g) { return ss.indexOf(g.slug) >= 0; }).map(function (g) { return g.mesas.filter(function (y) { return y.m === m; })[0]; }).filter(Boolean);
    if (!visti.length) { sinDueno.push({ m: m, min: mn, tot: Math.round(Number(q.total) || 0) }); return; }
    visti.forEach(function (x) { if (x.st !== 'aut') { x.st = 'aut'; x.min = mn; x.qrTot = Math.round(Number(q.total) || 0); } });
  });
  /* «$ en juego»: il conto della mesa, più ciò che il QR chiede e nessuno ha ancora accettato.
     [v0.1.2 · 🔴 K8 di 💵] il bordo mette la stessa mesa nella fetta di chi ha la plaza E di chi l'ha servita: la scheda si vede in tutte e due,
     il totale in cima si conta PER MESA, una volta sola (la scheda più urgente). Il «$ en juego» è il conto dei pedidos aperti, non il resto
     dopo un pago parziale (K3b, dichiarato: si decide con 🎨). */
  var perMesa = {};
  gente.forEach(function (g) { g.mesas.forEach(function (x) {
    if (!jlUrgente(x)) return;
    var p = perMesa[x.m], v = x.tot + (x.st === 'aut' ? (x.qrTot || 0) : 0);
    /* [v0.1.3 · K8b] lo stato dalla fetta più urgente, la cifra dalla fetta più alta */
    if (!p) perMesa[x.m] = { pr: jlPrioridad(x), v: v }; else { if (jlPrioridad(x) < p.pr) p.pr = jlPrioridad(x); if (v > p.v) p.v = v; }
  }); });
  var nT = 0, tot = 0;
  Object.keys(perMesa).forEach(function (m) { nT++; tot += perMesa[m].v; });
  sinDueno.forEach(function (q) { nT++; tot += q.tot; });
  return { gente: gente, sinDueno: sinDueno, nUrg: nT, enJuego: tot };
}

/* [v0.2.0 · la testata v50 + P4] campanella (mesas che chiamano o chiedono il conto, una volta per mesa) · 86 · la venta del turno
   (somma delle `venta_turno.venta` dei garzones; un garzón senza il dato si dice, non si conta come 0) */
function jlConti(M) {
  var call = {}, venta = 0, senza = 0, plz = {}, condivisa = false;
  M.gente.forEach(function (g) {
    g.mesas.forEach(function (x) { if (x.st === 'llamando' || x.st === 'cuenta') call[x.m] = 1; });
    if (g.venta == null) senza++; else venta += g.venta;
    /* [v0.2.1 · 🟡 ⓐ di 💵 «JL FASE 1 BANCATA»] `venta_turno` del bordo è la venta delle PLAZAS del garzón (index.js r.4950-4971):

/* ═══ [v0.4.0 · AUT-1109 · ⚙️ H3 `e26f556`] LE SOLICITUDES: il garzón chiede, il JL decide col PIN sul SUO telefono ═══
   Lettura: `datos.peticiones` della stessa `sala_vista` (le vive: pendiente · confirmada; il campo c'è solo a leva `PETICION_ON` accesa ⇒
   `null` = leva spenta e il vetro non mostra niente). Gesti: `POST /peticion/<local>` (token in header) `{verbo, uid_gesto, peticion_id,
   pin_jl, codigo, nombre, dispositivo_id}` con verbo `leer` (all'apertura, una volta) · `confirmar` · `rechazar`. Il `confirmar` di un eliminar

    if (!it || !it.uuid) return; var a = []; try { a = JSON.parse(it.items_json || '[]') || []; } catch (e) { a = []; }
    ped[String(it.uuid)] = a.map(function (i) { return { id: i.id, n: String(i.nombre || i.n || '').trim(), q: Number(i.qty || i.q || i.cantidad || 1) || 1 }; });
  }); });

}
function petPend() { return (PET.lista || []).filter(function (x) { return x.stato === 'pendiente'; }); }
/* cosa esce: per ogni id, quante unità il pedido ha e quante ne restano. Pura. */
function petEsce(p, righe) {
