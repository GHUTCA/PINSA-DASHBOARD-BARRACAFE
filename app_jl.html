/* ═══ v1.26.0 · [AUT-0216c] · IL VOID NON VIVE PIÙ QUI ═════════════════════════

let STATE = { pin: '', user: '', turno: null, caja: null, vista: null, rechazos: null,

try { const c = JSON.parse(localStorage.getItem(CK) || 'null'); if (c && c.ts) { STATE = Object.assign(STATE, c); STATE.pin = ''; } } catch (e) {}
try { STATE.pin = sessionStorage.getItem('jl_pin') || ''; STATE.user = sessionStorage.getItem('jl_user') || ''; } catch (e) {}

function toast(tipo, msg) {
  const t = $('toast'); t.className = 'on ' + tipo; t.textContent = msg + (tipo === 'err' ? ' · toca para cerrar' : '');
  t.onclick = () => { t.className = ''; };

  if (tipo !== 'err') t._h = setTimeout(() => { t.className = ''; }, 4200);
}
function edadS(k) { return STATE.ts[k] ? Math.round((Date.now() - STATE.ts[k]) / 1000) : null; }
function _fmtEdadS(s) { if (s == null) return '—'; if (s < 90) return 'hace ' + s + ' s'; return 'hace ' + Math.round(s / 60) + ' min'; }
function edadTxt(k) { return _fmtEdadS(edadS(k)); }
/* v1.27.0 · [PASSAGGIO CONTROLLER, AUT-0227-bis, 10-set] «hace 6 s» diceva

   dato al momento di servirlo (`/estado` r.8452, `edad_ms: Date.now() -
   crudo.ts`) — non serve un giro in più, basta leggerla invece del
   proprio orologio. `vistaEdadBaseMs` congela quel numero al momento
   della risposta; qui sopra ci si somma il tempo che passa DA quel
   momento, così il semaforo continua a invecchiare fra un poll e l'altro
   invece di restare fermo al valore ricevuto. */
function edadVistaS() {
  if (STATE.vistaEdadBaseMs == null || !STATE.ts.vista) return edadS('vista');   // ripiego: bordo vecchio senza edad_ms
  return Math.round((STATE.vistaEdadBaseMs + (Date.now() - STATE.ts.vista)) / 1000);

/* ═════ RETE — GAS dietro, bordo davanti ═════ */
/* i verbi che leggono fogli interi hanno il loro tetto: con 20 s getCaja
   tagliava SEMPRE (misurato: il solo rifiuto a vuoto costa 3,6 s). */
const VERBI_LENTI = { getCaja: 1, getTurnoAdmin: 1, adminListProducts: 1 };
async function gasPost(action, body) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), VERBI_LENTI[action] ? CFG.TIMEOUT_LENTO_MS : CFG.TIMEOUT_MS);
  try {
    const r = await fetch(CFG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, local: CFG.LOCAL }, body || {})),
      signal: ctrl.signal, cache: 'no-store', redirect: 'follow' });
    clearTimeout(t);
    if (!r.ok) throw new Error('http_' + r.status);
    return await r.json();
  } catch (e) { clearTimeout(t); throw (e.name === 'AbortError' ? new Error('timeout') : e); }
}
/* [06-set · riparazione] IL ROUTER HA DUE PORTE, e non sono intercambiabili:
   `doPost` (r.254-482) e `doGet` (da r.483) hanno liste di `case` DIVERSE.
   `getTurnoAdmin` e `adminListProducts` vivono SOLO su GET (parametri in
   querystring); chiamati in POST rispondono «Unknown action» — e l'app lo
   mostrava come «PIN no válido», facendo accusare il PIN del JL che era
   giusto. 🎓 Ho letto la riga del router senza guardare in QUALE ramo stava:
   il numero di riga c'era, il ramo no. Verificato sul vivo, non dedotto:
   GET→pin_invalid (arriva) · POST→Unknown action (non arriva). */
async function gasGet(action, params) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), VERBI_LENTI[action] ? CFG.TIMEOUT_LENTO_MS : CFG.TIMEOUT_MS);
  try {
    const q = new URLSearchParams(Object.assign({ action: action, local: CFG.LOCAL }, params || {}));
    const r = await fetch(CFG.GAS_URL + '?' + q.toString(), { signal: ctrl.signal, cache: 'no-store', redirect: 'follow' });
    clearTimeout(t);
    if (!r.ok) throw new Error('http_' + r.status);
    return await r.json();
  } catch (e) { clearTimeout(t); throw (e.name === 'AbortError' ? new Error('timeout') : e); }
}
async function bordeGet(path) {
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 6000);
  const sep = path.indexOf('?') >= 0 ? '&' : '?';
  const r = await fetch(CFG.BORDE + path + sep + 't=' + encodeURIComponent(CFG.T), { signal: ctrl.signal, cache: 'no-store' });
  clearTimeout(to);
  return await r.json();
}
/* le SCRITTURE di sala passano dal bordo come in sala.html; fallback GAS
   identico (qualsiasi risposta senza borde:true → via di sempre). */
async function staffPost(action, body) {
  try {

    const r = await fetch(CFG.BORDE + '/pedido-staff/' + encodeURIComponent(CFG.LOCAL) + '?t=' + encodeURIComponent(CFG.T),

/* ═════ IL GIRO DEI DATI — ognuno col suo ritmo, MAI davanti a un dito ═════
   veloce (bordo):  vista sala · /pedidos (rechazos) · /salud · /sdp-cola
   lento (GAS):     getTurnoAdmin (al login + ogni 5 min) · getCaja (60 s

/* ── IL RITMO, dichiarato (condizione ② di AUT-0206, dopo la notte in cui la

     · sala_vista        1 GET / 20 s   (il battito del vetro)
     · salud+pedidos+sdp 3 GET / 60 s   (un tick su tre)
     · getCaja (GAS)     1 POST / 60 s  solo con Sala/Caja davanti
     · getTurnoAdmin     1 POST / 5 min
     · adminListProducts 1 POST / 10 min, a domanda

   ogni poll ha nome, ritmo e questo commento come data di morte. */
let _tick = 0;
async function giroVeloce() {
  if (DEMO) return;
  _tick++;
  const cod = STATE.turno && STATE.turno.turno && STATE.turno.turno.codigo;
  if (cod) {
    try {

      if (v && v.ok && v.datos && v.datos.datos) {

    try { const s = await bordeGet('/salud'); STATE.salud = s; STATE.ts.salud = Date.now(); } catch (e) { STATE.salud = null; }

/* ═════ TESTATA — allarmi SOLO di macchina, spenti quando zero ═════════════ */
function pintaSalud() {
  const el = $('salud');

  /* verde: la foto respira · ambra: invecchia · rossa: bordo muto o foto morta.
     E la barra PARLA: il JL legge lo stato, non indovina un colore. */

  if (vs != null && vs < 90) { el.className = ''; el.textContent = 'sistema ok'; }
  else if (vs != null && vs < 300) { el.className = 'amb'; el.textContent = 'sistema lento — sala de hace ' + Math.round(vs / 60) + ' min'; }
  else if (STATE.turno && STATE.turno.turno) { el.className = 'amb'; el.textContent = 'sala vieja — esperando la foto'; }
  else { el.className = ''; el.textContent = 'sistema ok · turno cerrado'; }
}
function _rechazosHoy() {
  /* pago_rechazo è cumulativo da `desde`: si mostra SOLO se l'ultimo colpo è
     recente (<2 h) — un contatore vecchio non è un incendio di adesso. */
  const r = STATE.rechazos;
  if (!r || !r.n || r.ultimo_hace_s == null || r.ultimo_hace_s > 7200) return null;
  const mesas = [];
  try { Object.keys(r.mesas || {}).forEach(k => (r.mesas[k] || []).forEach(m => { if (mesas.indexOf(m) < 0) mesas.push(m); })); } catch (e) {}
  return { n: r.n, mesas: mesas };
}
function _sinPapel() {
  /* stampante che ha smesso di RITIRARE con coda > 0 = fatto di macchina */
  const s = STATE.sdp;
  if (!s || !s.sdplast) return null;

  try {
    Object.keys(s.sdplast).forEach(st => {

}

  const c = STATE.caja;
  const vuoto = STATE.ts.caja ? '0' : '···';
  const abiertas = c && c.mesas_abiertas ? c.mesas_abiertas.length : null;
  /* v1.27.0 · [PASSAGGIO CONTROLLER, AUT-0227-bis, 10-set] Alberto, in sala:
     «dovrei vedere DUE numeros: quanto ho en sala ahora y quanto pagato».
     I quattro riquadri di sempre vengono tutti dal PAGATO (`venta`) — a metà

     che alimenta gli altri quattro: `por_mesero[n].abierto` (r.518) — la
     stessa cifra che la riga del mesero mostra come «$X en sala». Qui si

  /* 🔴 v1.30.0 · [AUT-0244 · 12-set, Alberto IN SERVIZIO: «la vendita non si
     vede»] Il riquadro c'era e diceva 0 mentre in sala c'erano 12 pedidos per
     $234.110. Non era rotto il riquadro: era la FONTE. `getCaja` legge PAGOS
     +PEDIDOS interi su Google ogni 60 s — e quando il locale non ha ancora
     incassato, `por_mesero[n].abierto` non porta niente.
     ⇒ Il numero viene ora dalla FETTA DEL BORDO (`STATE.vista`), che questa
       app riceve GIÀ ogni 20 s: zero poll nuovi (N2 rispettata), tre volte
       più fresco, e soprattutto FUORI DA GOOGLE — è un pezzo di migrazione,
       non un ritocco. È la stessa somma che fa `sala.html` (r.7082) per la
       «venta turno»: i totali dei pedidos ancora aperti.
     ⚠️ La trappola evitata: `sin_dueno` (i pedidos senza mesero) vive nella
       fetta di OGNUNO — il bordo li mostra a tutti perché non sono di
       nessuno. Sommandoli per mesero si conterebbero N volte. Si prendono

  const enSala = _enSalaDaVista();
  /* 🔴 CONDIZIONE DEL CONTROLLER, e oggi è costata minuti ad Alberto in
     servizio: «0» e «NON LO SO» non devono avere la stessa faccia. Se la
     fetta non è arrivata il riquadro lo DICE — non mostra uno zero che
     significa «non ho il dato». Uno zero vero (tutto pagato) resta $0. */
  $('hKpi').innerHTML =
    '<span class="kpi"><b>' + (enSala == null ? '···' : fmt(enSala)) + '</b><small>' +
      (enSala == null ? 'en sala · sin dato' : 'en sala') + '</small></span>' +
    '<span class="kpi ok"><b>' + (c ? fmt(c.venta || 0) : vuoto) + '</b><small>venta hoy</small></span>' +
    '<span class="kpi"><b>' + (c ? (c.cuentas || 0) : vuoto) + '</b><small>cerradas</small></span>' +
    '<span class="kpi"><b>' + (abiertas == null ? vuoto : abiertas) + '</b><small>abiertas</small></span>' +
    '<span class="kpi"><b>' + (c && c.cuentas ? fmt((c.venta || 0) / c.cuentas) : vuoto) + '</b><small>promedio</small></span>';
}

/* [AUT-0244] la plata VIVA in sala, letta dalla fetta del bordo.
   Torna `null` quando la fetta non c'è — e `null` NON è zero: chi disegna
   deve dirlo, non mostrarlo come una sala vuota. */
function _enSalaDaVista() {
  const ms = STATE.vista && STATE.vista.meseros;
  if (!ms) return null;
  const buoni = Object.keys(ms).filter(k => ms[k] && ms[k].ok);
  if (!buoni.length) return null;   // fetta arrivata ma nessuna sezione leggibile: non lo so
  let tot = 0;
  buoni.forEach(k => {
    ['pendientes', 'mios', 'por_limpiar'].forEach(lista => {
      (ms[k][lista] || []).forEach(p => { tot += parseFloat(p.total) || 0; });
    });
  });
  /* i senza mesero stanno nella fetta di TUTTI: una volta sola, mai per mesero */
  (ms[buoni[0]].sin_dueno || []).forEach(p => { tot += parseFloat(p.total) || 0; });
  return Math.round(tot);
}

/* ═════ SCHEDA SALA ═════ */
function _porMesero() {
  const c = STATE.caja;
  const out = [];
  /* 🔴 [06-set · reperti di Alberto: «Eduardo $0», «(sin mesero)», «0 cuentas»]
     Il GAS tiene DUE fatti diversi nello stesso oggetto (v3.93.0, VB di
     Alberto): `venta`+`n` = chi ha SERVITO (dai PEDIDOS) · `cobrado`+`n_cobros`
     = chi ha INCASSATO (dai PAGOS, campo Registrado_Por). Io leggevo solo
     `venta`: chi incassa ma non serve usciva a ZERO (Eduardo: $165.930 in 4
     pagos, mostrato $0) e le cuentas erano sempre 0 perché il campo si chiama
     `n`, non `cuentas`.
     Qui si mostra il DENARO CHE È PASSATO DALLE SUE MANI — è ciò che un JL
     guarda in sala — dichiarando quale dei due è. Chi non ha né servito né
     incassato non entra in lista (via il `(sin mesero)`, che era una chiave
     vuota del server letta come persona). */
  if (c && c.por_mesero) {
    Object.keys(c.por_mesero).forEach(n => {
      /* 🔴 [06-set] la chiave VUOTA non è un errore: sono i pedidos che il
         CLIENTE fa da solo col QR (`Via_Cliente: directa`, nessun mesero).
         Verificato nel libro: mesa 21, 15:10, due iPhone diversi, $42.990.
         Non si nasconde (è venta vera) e non si finge una persona: si chiama
         col suo nome e va IN FONDO, fuori dal confronto fra meseros. */
      let nome = (n || '').toString().trim();
      const senzaMesero = !nome;
      if (senzaMesero) nome = '📱 Pedidos del cliente (QR)';
      const m = c.por_mesero[n] || {};
      const cobrado = m.cobrado || 0, servido = m.venta || 0;
      /* 🔴 [07-set · reperto di Alberto: «Wilbert non compare»] c'è un TERZO
         fatto, e mancava: il server (v3.94.0) mette in `venta` solo i pedidos
         di mesas GIÀ PAGATE — «la caja deve quadrare». Tutto il resto va in
         `abierto`/`n_abierto`: PLATA IN SALA, non ancora in cassa. Il campo
         viaggiava già e il vetro non lo guardava ⇒ un mesero con tavoli
         aperti e nessun pago valeva zero e SPARIVA dalla lista.
         🩸 Non è un fastidio da collaudo: venerdì alle 21 un mesero con 5
         tavoli pieni e nessun cobro sarebbe stato invisibile al JL — proprio
         quando c'è più da guardare. */
      const abierto = m.abierto || 0, nAb = m.n_abierto || 0;
      const val = cobrado || servido;           // il denaro che è passato da lui
      const ctas = m.n_cobros || m.n || 0;
      if (!val && !ctas && !abierto && !nAb) return;   // chi non ha proprio niente
      out.push({ n: nome, venta: val, ctas: ctas, cobrado: cobrado, servido: servido,
                 abierto: abierto, n_abierto: nAb, qr: senzaMesero });
    });
  }
  /* 🔴 [07-set · Alberto: «non vedo Wilbert pur essendo attivo, con 3 tavoli
     liberi»] LA RADICE, e il fix di stamattina l'aveva solo sfiorata: la lista
     nasceva dal DENARO (caja), quindi mostrava solo chi aveva già numeri. Ma
     👁 IL JL DEVE VEDERE CHI È IN SALA, non chi ha venduto: un mesero appena
     arrivato, o con la plaza tutta libera, ESISTE — e a inizio turno è proprio
     quello da guardare.
     La fonte giusta ce l'abbiamo già in casa: le ASIGNACIONES del turno (le
     stesse che disegnano il tab Turno). Si parte da CHI È IN TURNO e i numeri
     si appendono; chi ha numeri senza essere in turno (un turno chiuso male,
     un nome che non torna) NON si nasconde: resta in lista. */
  const inTurno = {};
  ((STATE.turno && STATE.turno.asignaciones) || []).forEach(a => {
    if (!a.mesero) return;
    const k = _slugSalaJS(a.mesero);
    if (!inTurno[k]) inTurno[k] = { nome: a.mesero, plazas: [] };
    if (a.plaza && inTurno[k].plazas.indexOf(a.plaza) < 0) inTurno[k].plazas.push(a.plaza);
  });
  const giaInLista = {};
  out.forEach(m => { if (!m.qr) giaInLista[_slugSalaJS(m.n)] = true; });
  Object.keys(inTurno).forEach(k => {
    if (giaInLista[k]) return;                       // ha già numeri: c'è di suo
    if (_slugSalaJS(STATE.user || '') === k) return; // il JL è già in cima
    out.push({ n: inTurno[k].nome, venta: 0, ctas: 0, cobrado: 0, servido: 0,
               abierto: 0, n_abierto: 0, qr: false, enPlaza: true,
               plazasTurno: inTurno[k].plazas });
  });
  /* la media si fa SOLO su chi ha denaro chiuso: chi ha solo tavoli aperti
     non è «un mesero che vende poco», è un mesero la cui serata non è finita.
     Metterlo nella media falserebbe il confronto di tutti gli altri. */
  const humanos = out.filter(m => !m.qr && m.venta > 0);
  const tot = humanos.reduce((a, b) => a + b.venta, 0);
  const media = humanos.length ? tot / humanos.length : 0;
  out.forEach(m => { m.d = (m.qr || !media || !m.venta) ? null : Math.round((m.venta - media) / media * 100); });
  /* prima chi ha allarmi (rechazos sulle sue mesas — TODO quando il mapping
     mesa→mesero esce pulito), poi per venta */
  out.sort((a, b) => (a.qr ? 1 : 0) - (b.qr ? 1 : 0) || b.venta - a.venta);
  return out;
}
/* ═══ [06-set · reperto di Alberto: «non vedo i tavoli»] ═══════════════════
   I tavoli NON vengono da getCaja (che dà il denaro): vengono dalla VISTA
   del bordo, che porta una fetta per OGNI mesero con `plazas`, `pendientes`
   (da servire), `mios` (i suoi), `por_limpiar`. Le si legge dallo slug del

/* ═══ 🔴 [06-set · correzione di CONCEZIONE, dettata da Alberto] ═══════════
   PRIMA il tap portava a `sala.html` — cioè FUORI dall'app, con un login da

      '<p class="mini">* MAÑANA = mismo día sem. pasada + previsión de 📊 STATISTICS. ' +
      'Las 3 columnas históricas <b>llegan esta semana</b> — hoy ya es real.</p></div>';
    return h + _ventasFranjas(c);
  }
  return h + _ventasMeseros();
}
function _ventasFranjas(c) {
  let h = '<div class="card"><h4>📊 Por turno y franja</h4>';
  const fr = (c && c.por_franja) || null;
  if (fr) {
    let gv = 0, gc = 0;
    Object.keys(TURNI).forEach(tn => TURNI[tn].forEach(f => { const x = fr[f] || {}; gv += x.venta || 0; gc += x.ctas || 0; }));
    h += '<table class="rep"><tr><th>&nbsp;</th><th>venta</th><th>ctas</th><th>prom</th></tr>';
    h += '<tr><td><b>TOTAL DEL DÍA</b></td><td><b>' + fmt(gv) + '</b></td><td><b>' + gc + '</b></td><td><b>' + (gc ? fmt(gv / gc) : '—') + '</b></td></tr>';
    Object.keys(TURNI).forEach(tn => {
      let tv = 0, tc = 0;
      h += '<tr><td colspan="4" style="padding-top:10px;color:#FF7A2F;font-weight:800">' + tn + '</td></tr>';
      TURNI[tn].forEach(f => {
        const x = fr[f] || { venta: 0, ctas: 0 };
        tv += x.venta || 0; tc += x.ctas || 0;
        h += '<tr><td style="padding-left:16px;color:#b9b2a4">' + f + '</td><td>' + fmt(x.venta || 0) + '</td><td>' + (x.ctas || 0) + '</td><td>' + (x.ctas ? fmt(x.venta / x.ctas) : '—') + '</td></tr>';
      });
      h += '<tr><td style="padding-left:16px"><b>TOTAL ' + tn + '</b></td><td><b>' + fmt(tv) + '</b></td><td><b>' + tc + '</b></td><td><b>' + (tc ? fmt(tv / tc) : '—') + '</b></td></tr>';
    });
    h += '</table>';
  } else {
    h += '<p class="mini">El corte por franja necesita los pagos con su hora — <b>declarado</b>: llega apenas la caja exponga la hora por pago (pedido a 💰). Mientras, el día entero está arriba.</p>';
  }
  h += '</div>';
  return h;
}
function _ventasMeseros() {
  let h = '<div class="card"><h4>👤 Por mesero</h4>';
  _porMesero().forEach(m => {
    const prom = m.ctas ? fmt(m.venta / m.ctas) : '—';
    /* ═══ v1.28.0 · [Alberto, in sala 10-set 12:5x] LA PLATA IN SALA, PER PERSONA
       «manca da assegnare la vendita EN SALA al mesero, per correggere un mesero
       che è basso QUANDO SI È ANCORA IN TEMPO.»
       🔴 Perché non era un abbellimento: questa lista mostrava solo il PAGATO —
       lo stesso difetto che la testata aveva fino a v1.27.0. E col solo pagato
       la domanda di Alberto è IMPOSSIBILE PER COSTRUZIONE: a metà servizio sono
       tutti a zero, e il momento per correggere qualcuno è proprio quello.
       Misurato mentre la scriveva: testata $298.320 EN SALA contro $2.900
       VENTA HOY, 11 tavoli aperti — e in questa lista un solo nome non a zero.
       🟢 Zero dati nuovi: `abierto`/`n_abierto` arrivano già nello stesso
       `getCaja` e sono già dentro l'oggetto (v. `_porMesero` r.530-535). Qui
       mancava solo di disegnarli. Se sono zero non compare niente: chi non ha
       tavoli aperti vede la riga di prima. */
    const enSala = m.abierto
      ? ' · <b style="color:#FFB558">' + fmt(m.abierto) + ' en sala</b>' +
        (m.n_abierto ? ' <span style="opacity:.6">(' + m.n_abierto + ')</span>' : '')
      : '';
    h += '<div class="pers" style="padding:6px 0"><span class="nb"><b>' + esc(m.n) + '</b><small>' + m.ctas + (m.cobrado ? ' cobros' : ' ctas') + ' · prom ' + prom + enSala + '</small></span>' +
      '<span class="val"><b>' + fmt(m.venta) + '</b>' + (m.d == null ? '<small class="mid">—</small>' : '<small class="' + (m.d > 8 ? 'up' : m.d < -8 ? 'dn' : 'mid') + '">' + (m.d > 0 ? '+' : '') + m.d + '%</small>') + '</span></div>';
  });
  h += '</div>';
  h += '<div class="card"><h4>🧠 Perfiles y susurros <span class="pill amb">EN CAMINO</span></h4>' +
    '<p class="mini">Fortalezas/debilidades por persona, plazas que venden más, clima laboral, barrio — los cerebros los construyen 📊 y RRHH. El vetro ya tiene el espacio.</p></div>';
  return h;
}

/* ═════ 🚫 86 — il verbo VERO è adminToggle86 {pin, prod_id, value}
   (il pannello vecchio, menu_admin r.1124 — NON adminForzar, che è il
   forzado per-prodotto dei gerenti. Errore trovato da Alberto in revisione). */
let TAB = 0;
function ochenta() {
  TAB = -1;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', 'false'));
  const q = (window._q86 || '').toLowerCase();
  const ps = STATE.prods || [];
  const ag = ps.filter(p => p.agotado);
  let h = '<div class="card rossa"><h4>🚫 Se acabó algo</h4>' +
    '<input class="busca" id="q86" value="' + esc(window._q86 || '') + '" placeholder="escribe el producto…" oninput="window._q86=this.value;ochentaLista()">' +
    '<div id="l86"></div>' +
    '<p class="mini">Un toque y sale del menú al instante — el cliente deja de verlo en el QR.</p></div>';
  h += '<div class="card"><h4>Agotados ahora <span class="pill off">' + ag.length + '</span></h4>';
  if (!ag.length) h += '<p class="mini">' + (STATE.ts.prods ? 'Nada agotado.' : 'Cargando el catálogo detrás…') + '</p>';
  ag.forEach(a => {
    h += '<div class="cob">' + esc(a.nombre || a.id) + '<button class="btn gh" style="width:auto;margin:0 0 0 auto;padding:5px 10px" onclick="toggle86(\'' + esc(a.id) + '\',false)">volvió</button></div>';
  });
  h += '<p class="mini" style="color:#FFB558">⏱ Vuelven solos al horario de corte — si algo sigue agotado, se remarca.</p></div>';
  $('body').innerHTML = h + _salidaHtml(); $('body').scrollTop = 0;
  ochentaLista();
  if (!STATE.ts.prods || edadS('prods') > 600) giroProds();
}
function ochentaLista() {
  const el = $('l86'); if (!el) return;
  const q = (window._q86 || '').toLowerCase().trim();
  if (q.length < 2) { el.innerHTML = ''; return; }
  const hits = (STATE.prods || []).filter(p => !p.agotado && (p.nombre || '').toLowerCase().indexOf(q) >= 0).slice(0, 6);
  el.innerHTML = hits.map(p =>
    '<div class="cob">' + esc(p.nombre) + '<button class="btn gh" style="width:auto;margin:0 0 0 auto;padding:5px 10px" onclick="toggle86(\'' + esc(p.id) + '\',true)">86 hoy</button></div>').join('') ||
    '<p class="mini">' + (STATE.ts.prods ? 'Nada con ese nombre.' : 'Cargando el catálogo…') + '</p>';
}
/* [06-set · reperto di Alberto sul telefono] «ho appena cliccato per errore una
   birra ed è andata in 86 senza accorgermene». Un 86 toglie un prodotto dalla
   vendita di TUTTO il locale: non può succedere per un dito storto.
   Il ritorno («volvió») NON chiede: rimettere una cosa in vendita è il verso
   sicuro, e chiedere lì insegnerebbe a schiacciare senza leggere. */
async function toggle86(id, value) {
  if (value) {
    const p = (STATE.prods || []).find(x => x.id === id);
    if (!confirm('¿Sacar «' + ((p && p.nombre) || id) + '» del menú?\n\nDeja de verse en el QR al instante.')) return;
  }
  try {
    const r = await gasPost('adminToggle86', { pin: STATE.pin, prod_id: id, value: value });
    if (r && r.ok) {
      toast('ok', value ? '🚫 fuera del menú' : '✓ volvió');
      (STATE.prods || []).forEach(p => { if (p.id === id) p.agotado = value; });
      window._q86 = '';   // [06-set · Alberto] la ricerca si pulisce da sola dopo il gesto
      salva(); pintaTesta(); ochenta();
    } else toast('err', '✋ ' + ((r && r.error) || 'No se pudo'));
  } catch (e) { toast('err', 'Sin conexión — no cambió nada'); }
}

/* ═════ TAB + BOOT ═════ */
const VIS = [vSala, vTurno, vCaja, vVentas];
function tab(i) {
  TAB = i;
  document.querySelectorAll('.tabs button').forEach((b, j) => b.setAttribute('aria-selected', j === i ? 'true' : 'false'));
  pintaTab();
  if (i === 2 || i === 3 || i === 0) { if (!STATE.ts.caja || edadS('caja') > 60) giroCaja(); }
  if (i === 1 && !DEMO) { levaRefresca(); levaRefrescaNoche(); } /* lo stato della leva si LEGGE, non si ricorda */
  if (i === 1) { if (!STATE.ts.turno || edadS('turno') > 300) giroTurno(); }
}
/* [06-set · norma di Alberto] la via d'uscita in FONDO a ogni scheda, non solo
   la freccina in alto: «non rimanere mai chiusi nel vetro senza via d'uscita».
   Due uscite dichiarate: tornare alla torre, o chiudere la sessione del JL. */
function _salidaHtml() {
  return '<a class="salir" href="atalaya.html">‹ Volver a ATALAYA</a>' +
    '<button class="salir" onclick="salirJL()" style="margin-top:8px">Cerrar sesión</button>';
}
function salirJL() {
  if (!confirm('¿Cerrar tu sesión de JL en este teléfono?')) return;
  try { sessionStorage.removeItem('jl_pin'); sessionStorage.removeItem('jl_user'); } catch (e) {}
  location.reload();
}
function pintaTab() { if (TAB >= 0) { $('body').innerHTML = VIS[TAB]() + _salidaHtml(); } }

async function entrar() {
  const pin = ($('gPin').value || '').trim();
  if (!pin) return;
  $('gErr').textContent = '';
  try {
    const r = await gasGet('getTurnoAdmin', { pin: pin });
    if (r && r.ok) {
      STATE.pin = pin; STATE.turno = r; STATE.ts.turno = Date.now();
      /* 🔴 [06-set · reperto di Alberto: «non vedo le plazas di Eduardo»]
         PRIMA prendevo il nome da `turno.abierto_by` — CHI HA APERTO IL TURNO,
         non chi sta guardando. Entrato come Eduardo mentre il turno l'aveva
         aperto un altro, l'app cercava le plaza dell'ALTRO: «Mi plaza» vuota
         e la Sala che non riconosce nessuno.
         `adminPing` (GET, stesso verbo del pannello vecchio) risponde
         `user` col nome legato AL PIN che ha digitato: è l'unica fonte
         dell'identità di chi guarda. Se non risponde, si ripiega su
         abierto_by come prima — mai peggio di ieri. */
      try {
        const who = await gasGet('adminPing', { pin: pin });
        if (who && who.ok && who.user) STATE.user = who.user;
      } catch (e) { /* la rete non decide chi sei: si ripiega sotto */ }
      if (!STATE.user) STATE.user = (r.turno && r.turno.abierto_by) || 'JL';
      try { sessionStorage.setItem('jl_pin', pin); sessionStorage.setItem('jl_user', STATE.user); } catch (e) {}
      salva(); $('gate').className = 'hide';
      boot();
    } else $('gErr').textContent = r && r.error === 'pin_invalid' ? 'PIN no válido' : ('✋ ' + ((r && r.error) || 'no se pudo'));
  } catch (e) { $('gErr').textContent = 'Sin conexión — prueba de nuevo'; }
}
function boot() {
  pintaTesta(); tab(0);
  giroVeloce(); giroCaja(); giroProds();
  setInterval(giroVeloce, CFG.POLL_MS);
  setInterval(() => { if (TAB === 2 || TAB === 0) giroCaja(); }, 60000);
  setInterval(giroTurno, 300000);
}

if (DEMO) bootDemo();
else if (STATE.pin) { $('gate').className = 'hide'; boot(); }
else { pintaTesta(); pintaTab(); }
