  <input class="busca" id="gPin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">

<script>
/* ═════ CFG — multilocal per ?loc= (invariante 8: mai hardcodare un locale) ═ */
const QS = new URLSearchParams(location.search);
const CFG = {
  LOCAL: ({ bks: 'BKS', rsc: 'RIESCO', cdl: 'CANDELARIA' }[(QS.get('loc') || 'bks').toLowerCase()]) || 'BKS',
  GAS_URL: 'https://script.google.com/macros/s/AKfycbzZkS3bBaYc34uJ6wXP9FG13i58-NT0FJp964vqkUYbRObUxryeRb9l_Fz24kb42f5t/exec',
  BORDE: 'https://pinsita-borde.alberto-agostini.workers.dev',
  T: '7QvreCN5fzM40GW2Me8vfvNwIwcA9RDnTceXMwgZ',
  POLL_MS: 20000,          // un client, UN poll (regola di velocità)
  TIMEOUT_MS: 20000,
};
const DEMO = QS.get('demo') === '1' || location.hash === '#demo';   // #demo: regge anche su file://

/* ═════ STATE + CACHE — la schermata non aspetta MAI la rete (N1) ═════════ */
const CK = 'jl_cache_' + CFG.LOCAL;
let STATE = { pin: '', user: '', turno: null, caja: null, vista: null, rechazos: null,
  agotados: null, salud: null, pagosHoy: null, ts: {} };
try { const c = JSON.parse(localStorage.getItem(CK) || 'null'); if (c && c.ts) { STATE = Object.assign(STATE, c); STATE.pin = ''; } } catch (e) {}
try { STATE.pin = sessionStorage.getItem('jl_pin') || ''; STATE.user = sessionStorage.getItem('jl_user') || ''; } catch (e) {}
function salva() { try { const c = Object.assign({}, STATE); delete c.pin; localStorage.setItem(CK, JSON.stringify(c)); } catch (e) {} }

/* ═════ HELPERS ═════ */
const $ = id => document.getElementById(id);
const esc = s => (s || '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => '$' + (Math.round(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
function toast(tipo, msg) { const t = $('toast'); t.className = 'on ' + tipo; t.textContent = msg; clearTimeout(t._h); t._h = setTimeout(() => { t.className = ''; }, 4200); }
function edadS(k) { return STATE.ts[k] ? Math.round((Date.now() - STATE.ts[k]) / 1000) : null; }
function edadTxt(k) { const s = edadS(k); if (s == null) return '—'; if (s < 90) return 'hace ' + s + ' s'; return 'hace ' + Math.round(s / 60) + ' min'; }

/* ═════ RETE — GAS dietro, bordo davanti ═════ */
async function gasPost(action, body) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), CFG.TIMEOUT_MS);
  try {
    const r = await fetch(CFG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, local: CFG.LOCAL }, body || {})),
      signal: ctrl.signal, cache: 'no-store', redirect: 'follow' });
    clearTimeout(t);
    if (!r.ok) throw new Error('http_' + r.status);
    return await r.json();
  } catch (e) { clearTimeout(t); throw (e.name === 'AbortError' ? new Error('timeout') : e); }
}
async function bordeGet(path) {
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 6000);
  const sep = path.indexOf('?') >= 0 ? '&' : '?';
  const r = await fetch(CFG.BORDE + path + sep + 't=' + encodeURIComponent(CFG.T), { signal: ctrl.signal, cache: 'no-store' });
  clearTimeout(to);
  return await r.json();
}
/* le SCRITTURE di sala passano dal bordo come in sala.html; fallback GAS
   identico (qualsiasi risposta senza borde:true → via di sempre). */
async function staffPost(action, body) {
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 6000);
    const r = await fetch(CFG.BORDE + '/pedido-staff/' + encodeURIComponent(CFG.LOCAL) + '?t=' + encodeURIComponent(CFG.T),
      { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action, local: CFG.LOCAL }, body || {})), signal: ctrl.signal, cache: 'no-store' });
    clearTimeout(to);
    const j = await r.json();
    if (j && j.borde === true) return j;
  } catch (e) { /* si ricade sul GAS */ }
  return await gasPost(action, body);
}

/* ═════ IL GIRO DEI DATI — ognuno col suo ritmo, MAI davanti a un dito ═════
   veloce (bordo):  vista sala · /pedidos (rechazos) · /salud · /sdp-cola
   lento (GAS):     getTurnoAdmin (al login + ogni 5 min) · getCaja (60 s
                    quando la scheda Caja è davanti) · adminListProducts (per il 86) */
async function giroVeloce() {
  if (DEMO) return;
  const cod = STATE.turno && STATE.turno.turno && STATE.turno.turno.codigo;
  try { const s = await bordeGet('/salud'); STATE.salud = s; STATE.ts.salud = Date.now(); } catch (e) { STATE.salud = null; }
  if (cod) {
    try {
      const v = await bordeGet('/estado/' + encodeURIComponent(CFG.LOCAL) + '?seccion=sala_vista&codigo=' + encodeURIComponent(cod));
      if (v && v.ok && v.datos && v.datos.datos) { STATE.vista = v.datos.datos; STATE.ts.vista = Date.now(); }
    } catch (e) {}
  }
  try {
    const p = await bordeGet('/pedidos/' + encodeURIComponent(CFG.LOCAL));
    if (p && p.stato) { STATE.rechazos = p.stato.pago_rechazo || null; STATE.ts.rechazos = Date.now(); }
  } catch (e) {}
  try {
    const c = await bordeGet('/sdp-cola/' + encodeURIComponent(CFG.LOCAL));
    if (c && c.ok) { STATE.sdp = c; STATE.ts.sdp = Date.now(); }
  } catch (e) { /* SDP_COLA_OFF → 404: il chip resta muto, mai finto */ }
  salva(); pintaTesta(); pintaTab();
}
async function giroTurno() {
  if (DEMO || !STATE.pin) return;
  try {
    const r = await gasPost('getTurnoAdmin', { pin: STATE.pin });
    if (r && r.ok) { STATE.turno = r; STATE.ts.turno = Date.now(); salva(); pintaTesta(); pintaTab(); }
    else if (r && r.error === 'pin_invalid') { sessionStorage.removeItem('jl_pin'); location.reload(); }
  } catch (e) {}
}
async function giroCaja() {
  if (DEMO || !STATE.pin) return;
  try {
    const r = await gasPost('getCaja', { pin: STATE.pin });
    if (r && r.ok) { STATE.caja = r; STATE.ts.caja = Date.now(); salva(); pintaTesta(); pintaTab(); }
  } catch (e) {}
}
async function giroProds() {
  /* il catalogo del pannello (adminListProducts): serve al 🚫 86 — ricerca
     client e conteggio agotados. Lento → dietro, cache 10 min. */
  if (DEMO || !STATE.pin) return;
  try {
    const r = await gasPost('adminListProducts', { pin: STATE.pin });
    if (r && r.ok) { STATE.prods = r.products || []; STATE.ts.prods = Date.now(); salva(); pintaTesta(); if (TAB === -1) ochenta(); }
  } catch (e) {}
}

/* ═════ TESTATA — allarmi SOLO di macchina, spenti quando zero ═════════════ */
function pintaSalud() {
  const el = $('salud');
  const vs = edadS('vista');
  /* verde: la foto respira · ambra: invecchia · rossa: bordo muto o foto morta.
     E la barra PARLA: il JL legge lo stato, non indovina un colore. */
  if (!STATE.salud) { el.className = 'roja'; el.textContent = 'sin conexión — mostrando lo último que vi'; return; }
  if (vs != null && vs < 90) { el.className = ''; el.textContent = 'sistema ok'; }
  else if (vs != null && vs < 300) { el.className = 'amb'; el.textContent = 'sistema lento — sala de hace ' + Math.round(vs / 60) + ' min'; }
  else if (STATE.turno && STATE.turno.turno) { el.className = 'amb'; el.textContent = 'sala vieja — esperando la foto'; }
  else { el.className = ''; el.textContent = 'sistema ok · turno cerrado'; }
}
function _rechazosHoy() {
  /* pago_rechazo è cumulativo da `desde`: si mostra SOLO se l'ultimo colpo è
     recente (<2 h) — un contatore vecchio non è un incendio di adesso. */
  const r = STATE.rechazos;
  if (!r || !r.n || r.ultimo_hace_s == null || r.ultimo_hace_s > 7200) return null;
  const mesas = [];
  try { Object.keys(r.mesas || {}).forEach(k => (r.mesas[k] || []).forEach(m => { if (mesas.indexOf(m) < 0) mesas.push(m); })); } catch (e) {}
  return { n: r.n, mesas: mesas };
}
function _sinPapel() {
  /* stampante che ha smesso di RITIRARE con coda > 0 = fatto di macchina */
  const s = STATE.sdp;
  if (!s || !s.sdplast) return null;
  const male = [];
  try {
    Object.keys(s.sdplast).forEach(st => {
      const hace = s.sdplast[st] ? Math.round((Date.now() - s.sdplast[st]) / 1000) : null;
      const cola = (s.colas && s.colas[st] && s.colas[st].n) || 0;
      if (cola > 0 && (hace == null || hace > 120)) male.push(st);
    });
  } catch (e) {}
  return male.length ? male : null;
}
function pintaTesta() {
  pintaSalud();
  $('hWho').textContent = STATE.user || (STATE.turno && STATE.turno.turno && STATE.turno.turno.abierto_by) || 'JL';
  $('hEdad').textContent = STATE.ts.vista ? '📷 ' + edadTxt('vista') : '';
  /* etichette PIENE, non gergo («non si capisce molto» — Alberto): la riga
     scorre in orizzontale, quindi la chiarezza non paga spazio. */
  const A = [];
  const rz = _rechazosHoy();
  if (rz) A.push('<button onclick="tab(2)">💳 pagos rechazados <i>' + rz.n + '</i></button>');
  const sp = _sinPapel();
  if (sp) A.push('<button>🖨 impresora sin retirar: ' + esc(sp.join(' · ')) + '</button>');
  const ag = (STATE.prods || []).filter(p => p.agotado).length;
  if (ag) A.push('<button class="amb" onclick="ochenta()">🚫 agotados <i>' + ag + '</i></button>');
  else A.push('<button class="amb" onclick="ochenta()">🚫 marcar agotado</button>');
  $('hAlr').innerHTML = A.join('');
  const c = STATE.caja;
  const abiertas = c && c.mesas_abiertas ? c.mesas_abiertas.length : null;
  $('hKpi').innerHTML =
    '<span class="kpi ok"><b>' + (c ? fmt(c.venta || 0) : '—') + '</b><small>venta hoy</small></span>' +
    '<span class="kpi"><b>' + (c ? (c.cuentas || 0) : '—') + '</b><small>cerradas</small></span>' +
    '<span class="kpi"><b>' + (abiertas == null ? '—' : abiertas) + '</b><small>abiertas</small></span>' +
    '<span class="kpi"><b>' + (c && c.cuentas ? fmt((c.venta || 0) / c.cuentas) : '—') + '</b><small>promedio</small></span>';
}

/* ═════ SCHEDA SALA ═════ */
function _porMesero() {
  const c = STATE.caja;
  const out = [];
  if (c && c.por_mesero) {
    Object.keys(c.por_mesero).forEach(n => {
      const m = c.por_mesero[n] || {};
      out.push({ n: n, venta: m.venta || 0, ctas: m.cuentas || m.ctas || 0 });
    });
  }
  const tot = out.reduce((a, b) => a + b.venta, 0);
  const media = out.length ? tot / out.length : 0;
  out.forEach(m => { m.d = media ? Math.round((m.venta - media) / media * 100) : 0; });
  /* prima chi ha allarmi (rechazos sulle sue mesas — TODO quando il mapping
     mesa→mesero esce pulito), poi per venta */
  out.sort((a, b) => b.venta - a.venta);
  return out;
}
function vSala() {
  const t = STATE.turno;
  let h = '';
  /* Mi plaza: OGNI GIORNO in cui c'è un'assegnazione a suo nome (verdetto 05-set) */

/* ═════ SCHEDA VENTAS — AM/PM + 4 franjas (definite col MENU il 02-set) ════
   ☀️ DÍA 06:00-17:30 · 🥂 HH 17:30-20:00 · 🌙 NOCHE 20:00-22:00 · 🎧 TRASNOCHE 22:00-06:00 */
function _franja(hhmm) {
  const h = parseInt(hhmm.slice(0, 2), 10) + parseInt(hhmm.slice(3, 5), 10) / 60;
  if (h >= 6 && h < 17.5) return 'DÍA';
  if (h >= 17.5 && h < 20) return 'HH';
  if (h >= 20 && h < 22) return 'NOCHE';
  return 'TRASNOCHE';
}
/* IL LOCALE È DUE LOCALI (Alberto, 05-set): AM e PM, due mondi che le
   statistiche già separano. Lo schema è SUO, disegnato:
     TOTAL DEL DÍA → AM (DÍA · HH · TOTAL) → PM (NOCHE · TRASNOCHE · TOTAL).
   HH sta INTERO sotto AM come nel suo schema (anche la coda 18-20). */
const TURNI = { AM: ['DÍA', 'HH'], PM: ['NOCHE', 'TRASNOCHE'] };
function vVentas() {
  const c = STATE.caja;
  let h = '<div class="card"><h4>📊 Ventas <span class="pill off">📷 ' + edadTxt('caja') + '</span></h4>';
  const fr = (c && c.por_franja) || null;
  if (fr) {
    let gv = 0, gc = 0;
    Object.keys(TURNI).forEach(tn => TURNI[tn].forEach(f => { const x = fr[f] || {}; gv += x.venta || 0; gc += x.ctas || 0; }));
    h += '<table class="rep"><tr><th>&nbsp;</th><th>venta</th><th>ctas</th><th>prom</th></tr>';
    h += '<tr><td><b>TOTAL DEL DÍA</b></td><td><b>' + fmt(gv) + '</b></td><td><b>' + gc + '</b></td><td><b>' + (gc ? fmt(gv / gc) : '—') + '</b></td></tr>';
    Object.keys(TURNI).forEach(tn => {
      let tv = 0, tc = 0;
      h += '<tr><td colspan="4" style="padding-top:10px;color:#FF7A2F;font-weight:800">' + tn + '</td></tr>';
      TURNI[tn].forEach(f => {
        const x = fr[f] || { venta: 0, ctas: 0 };
        tv += x.venta || 0; tc += x.ctas || 0;
        h += '<tr><td style="padding-left:16px;color:#8f887a">' + f + '</td><td>' + fmt(x.venta || 0) + '</td><td>' + (x.ctas || 0) + '</td><td>' + (x.ctas ? fmt(x.venta / x.ctas) : '—') + '</td></tr>';
      });
      h += '<tr><td style="padding-left:16px"><b>TOTAL ' + tn + '</b></td><td><b>' + fmt(tv) + '</b></td><td><b>' + tc + '</b></td><td><b>' + (tc ? fmt(tv / tc) : '—') + '</b></td></tr>';
    });
    h += '</table>';
  } else {
    h += '<p class="mini">El corte por franja necesita los pagos con su hora — <b>declarado</b>: llega apenas la caja exponga la hora por pago (pedido a 💰). Mientras, el día entero está arriba.</p>';
  }
  h += '</div>';
  h += '<div class="card"><h4>👤 Por mesero</h4>';
  _porMesero().forEach(m => {
    h += '<div class="pers" style="padding:6px 0"><span class="nb"><b>' + esc(m.n) + '</b><small>' + m.ctas + ' ctas</small></span>' +
      '<span class="val"><b>' + fmt(m.venta) + '</b><small class="' + (m.d > 8 ? 'up' : m.d < -8 ? 'dn' : 'mid') + '">' + (m.d > 0 ? '+' : '') + m.d + '%</small></span></div>';
  });
  h += '</div>';
  h += '<div class="card"><h4>🧠 Perfiles y susurros <span class="pill amb">EN CAMINO</span></h4>' +
    '<p class="mini">Fortalezas/debilidades por persona, plazas que venden más, clima laboral, barrio — los cerebros se construyen en sus stanze (📊 · RRHH). El vetro ya tiene el espacio.</p></div>';
  return h;
}

/* ═════ 🚫 86 — il verbo VERO è adminToggle86 {pin, prod_id, value}

   forzado per-prodotto dei gerenti. Errore trovato da Alberto in revisione). */

  });

function ochentaLista() {
  const el = $('l86'); if (!el) return;
  const q = (window._q86 || '').toLowerCase().trim();
  if (q.length < 2) { el.innerHTML = ''; return; }
  const hits = (STATE.prods || []).filter(p => !p.agotado && (p.nombre || '').toLowerCase().indexOf(q) >= 0).slice(0, 6);
  el.innerHTML = hits.map(p =>
    '<div class="cob">' + esc(p.nombre) + '<button class="btn gh" style="width:auto;margin:0 0 0 auto;padding:5px 10px" onclick="toggle86(\'' + esc(p.id) + '\',true)">86 hoy</button></div>').join('') ||
    '<p class="mini">' + (STATE.ts.prods ? 'Nada con ese nombre.' : 'Cargando el catálogo…') + '</p>';

async function toggle86(id, value) {

  pintaTab();
  if (i === 2 || i === 3 || i === 0) { if (!STATE.ts.caja || edadS('caja') > 60) giroCaja(); }
  if (i === 1) { if (!STATE.ts.turno || edadS('turno') > 300) giroTurno(); }
}
function pintaTab() { if (TAB >= 0) { $('body').innerHTML = VIS[TAB](); } }

async function entrar() {
  const pin = ($('gPin').value || '').trim();
  if (!pin) return;
  $('gErr').textContent = '';
  try {
    const r = await gasPost('getTurnoAdmin', { pin: pin });
    if (r && r.ok) {
      STATE.pin = pin; STATE.turno = r; STATE.ts.turno = Date.now();
      STATE.user = (r.turno && r.turno.abierto_by) || STATE.user || 'JL';
      try { sessionStorage.setItem('jl_pin', pin); sessionStorage.setItem('jl_user', STATE.user); } catch (e) {}
      salva(); $('gate').className = 'hide';
      boot();
    } else $('gErr').textContent = r && r.error === 'pin_invalid' ? 'PIN no válido' : ('✋ ' + ((r && r.error) || 'no se pudo'));
  } catch (e) { $('gErr').textContent = 'Sin conexión — prueba de nuevo'; }
}
function boot() {
  pintaTesta(); tab(0);
  giroVeloce(); giroCaja(); giroProds();
  setInterval(giroVeloce, CFG.POLL_MS);
  setInterval(() => { if (TAB === 2 || TAB === 0) giroCaja(); }, 60000);
  setInterval(giroTurno, 300000);
}
