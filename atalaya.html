<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>ATALAYA</title>
<!-- ver: atalaya v3.1 · 03ago · el chip negro dice UNA cosa: «existe y no es tuyo» ·
     el placeholder de local futuro ya no se pinta negro (mentía a quien ve todo) ·
     v3.0 · LA TORRE QUE FILTRA: primero QUIÉN ERES, después DÓNDE VAS ·
     chips: el tuyo con nombre, los demás negros y mudos · cada puerta lleva su ?loc= ·
     alcance por cargo (sin tocar el esquema de usuarios) · adiós llave compartida y puerta-mesero -->
<style>
  :root{
    --bg:#1F2329; --panel:#272C33; --panel2:#2F353D; --line:#3D444D;
    --ink:#F2F0ED; --ink2:#B8B2AA; --ink3:#7A7570;
    --oro:#D9923F; --oro-soft:#F3DDC0; --oro-dim:rgba(217,146,63,.14);
    --ok:#3FA66A;
    --r:16px; --r2:13px;
    --fa:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--fa);
    min-height:100%;-webkit-font-smoothing:antialiased}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  .top{display:flex;flex-direction:column;align-items:center;padding:34px 22px 8px}
  .mark{width:84px;height:84px;display:block}
  .wordmark{margin-top:13px;font-size:29px;font-weight:500;letter-spacing:5px;color:var(--ink)}
  .tag{margin-top:5px;font-size:11px;letter-spacing:2px;color:var(--ink3);text-transform:uppercase}

  .wrap{max-width:560px;margin:0 auto;padding:8px 16px 40px}
  .ask{font-size:20px;font-weight:500;text-align:center;color:var(--ink);margin:18px 4px 3px}
  .ask-sub{font-size:13px;color:var(--ink2);text-align:center;margin:0 8px 20px;line-height:1.55}

  .fronts{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .front{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 16px;cursor:pointer;text-decoration:none;color:inherit;display:flex;
    align-items:center;gap:13px;transition:border-color .15s,background .15s,transform .08s;position:relative}
  .front:active{transform:scale(.985)}
  .front:hover{border-color:var(--oro);background:var(--panel2)}
  .front .code{font-size:15px;font-weight:600;letter-spacing:1px;color:var(--oro);
    width:42px;flex:none;text-align:center}
  .front .nm{font-size:14.5px;font-weight:500;color:var(--ink);text-transform:capitalize;line-height:1.25}
  .front.self{border-color:rgba(217,146,63,.4);background:var(--oro-dim)}
  .front.self .nm{color:var(--oro-soft)}
  /* ── EL CHIP NEGRO (03-ago, Alberto): existe, no tiene nombre, no hace nada.
        Dice «el sistema es más grande que tú, y este no es tu sitio» sin decir qué es. */
  .front.mudo{background:#1A1D22;border-color:#2A2E34;cursor:default;pointer-events:none}
  .front.mudo .code{color:#33383F}
  .front.mudo .nm{color:#33383F}
  /* ── «PRONTO» ≠ NEGRO. Un local que aún no existe se anuncia con su nombre
        y se ve apagado; no se disfraza de sitio ajeno. Sólo lo ve quien
        alcanza toda la torre. */
  .front.soon{opacity:.45;cursor:default;pointer-events:none}
  .front.soon .code{color:var(--ink3)!important}
  .front.soon .nm{color:var(--ink3)}
  .front .fbadge{position:absolute;top:9px;right:11px;font-size:8.5px;letter-spacing:1px;
    text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);border-radius:18px;padding:1px 7px}
  .marca{grid-column:1/-1;font-size:10.5px;letter-spacing:3px;text-transform:uppercase;
    color:var(--ink3);margin:6px 2px 1px;display:flex;align-items:center;gap:9px;font-weight:600}
  .marca::after{content:"";flex:1;height:1px;background:var(--line)}
  .marca:first-child{margin-top:0}

  .doors{display:grid;grid-template-columns:1fr;gap:12px}
  .door{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:19px 18px;cursor:pointer;text-decoration:none;color:inherit;display:block;
    transition:border-color .15s,background .15s,transform .08s;position:relative}
  .door:active{transform:scale(.99)}
  .door:hover{border-color:var(--oro);background:var(--panel2)}
  .door .dt{font-size:17px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:10px}
  .door .dd{font-size:12.5px;color:var(--ink2);margin-top:7px;line-height:1.5;padding-left:18px}
  .door .dot{width:8px;height:8px;border-radius:50%;background:var(--oro);flex:none}
  .door.soon{opacity:.5;cursor:default;pointer-events:none}
  .door.soon .dot{background:var(--ink3)}
  .door .badge{position:absolute;top:15px;right:15px;font-size:10px;letter-spacing:1px;
    text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);border-radius:20px;padding:2px 9px}

  .sl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink3);
    margin:26px 4px 12px;display:flex;align-items:center;gap:10px}
  .sl::after{content:"";flex:1;height:1px;background:var(--line)}
  .here{text-align:center;font-size:13px;color:var(--ink2);margin:4px 0 2px}
  .here b{color:var(--oro-soft);font-weight:500}

  /* ── LA BARRA · nunca un callejón sin salida (bug B del 03-ago) ── */
  .bar{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto;
    padding:10px 16px 0;font-size:12.5px;color:var(--ink2)}
  .bar .yo{display:flex;align-items:center;gap:7px;min-width:0}
  .bar .yo b{color:var(--oro-soft);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .cargo{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);
    border:1px solid var(--line);border-radius:20px;padding:1px 7px;flex:none}
  .bar .sp{flex:1}
  .bar button{background:none;border:1px solid var(--line);border-radius:20px;color:var(--ink2);
    font-size:12px;font-family:var(--fa);cursor:pointer;padding:5px 12px;flex:none}
  .bar button:active{color:var(--ink);border-color:var(--oro)}

  .back{display:inline-flex;align-items:center;gap:7px;background:none;border:none;
    color:var(--ink2);font-size:14px;font-family:var(--fa);cursor:pointer;padding:8px 2px;margin-top:2px}
  .back:active{color:var(--ink)}

  .foot{text-align:center;color:var(--ink3);font-size:11px;letter-spacing:1px;margin-top:32px}
  .foot .owl{color:var(--oro)}
  .hidden{display:none!important}
</style>
</head>
<body>

  <div class="top">
    <svg class="mark" viewBox="0 0 100 100" aria-label="ATALAYA">
      <g transform="translate(50,54)">
        <path d="M -23 31 L -7 -20 L 7 -20 L 23 31" fill="none" stroke="#D9923F" stroke-width="3.3" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M -8.5 -20 L -8.5 -26.5 L -3.4 -26.5 L -3.4 -21 M 3.4 -21 L 3.4 -26.5 L 8.5 -26.5 L 8.5 -20" fill="none" stroke="#D9923F" stroke-width="3.3" stroke-linejoin="round"/>
        <path d="M -12.5 1 Q -7 -3.8 -1.6 1" fill="none" stroke="#D9923F" stroke-width="1.9" stroke-linecap="round"/>
        <path d="M 1.6 1 Q 7 -3.8 12.5 1" fill="none" stroke="#D9923F" stroke-width="1.9" stroke-linecap="round"/>
        <circle cx="-7" cy="6" r="4.2" fill="none" stroke="#D9923F" stroke-width="2.1"/>
        <circle cx="7" cy="6" r="4.2" fill="none" stroke="#D9923F" stroke-width="2.1"/>
        <circle cx="-7" cy="6" r="1.9" fill="#F3DDC0"/>
        <circle cx="7" cy="6" r="1.9" fill="#F3DDC0"/>
        <circle cx="-6.2" cy="5" r="0.6" fill="#FFFFFF"/>
        <circle cx="7.8" cy="5" r="0.6" fill="#FFFFFF"/>
        <path d="M 0 9 L -2 13 L 2 13 Z" fill="#D9923F"/>
      </g>
    </svg>
    <div class="wordmark">ATALAYA</div>
    <div class="tag">Siempre alerta</div>
  </div>

  <!-- la barra vive fuera de los pasos: siempre hay salida -->
  <div class="bar hidden" id="barra">
    <span class="yo">👤 <b id="barNombre">—</b><span class="cargo" id="barCargo">—</span></span>
    <span class="sp"></span>
    <button id="btnCambiar" class="hidden">Cambiar local</button>
    <button id="btnSalir">Salir</button>
  </div>

  <!-- mientras el overlay del PIN pregunta quién eres, aquí no hay nada que mirar -->
  <section class="wrap hidden" id="paso-login">
    <div class="ask">Tu torre te espera</div>
    <div class="ask-sub">Entra con tu PIN.<br>¿Aún no lo tienes? Pídeselo a tu Jefe de Local.</div>
  </section>

  <section class="wrap hidden" id="paso-chips">
    <div class="ask">¿A dónde vas?</div>
    <div class="ask-sub" id="chipsSub">Estos son tus sitios.</div>
    <div class="fronts" id="frontsGrid"></div>
    <div class="foot">ATALAYA vela por ti · <span class="owl">Siempre alerta</span></div>
  </section>

  <section class="wrap hidden" id="paso-salas">
    <button class="back" id="btnVolver">‹ Volver</button>
    <div class="here">Estás en <b id="hereName">—</b></div>
    <div id="salasBody"></div>
    <div class="foot">ATALAYA vela por ti · <span class="owl">Siempre alerta</span></div>
  </section>

  <script src="shared/pinsita_auth.js"></script>
  <script>
  (function(){
    'use strict';
    var ACCENT = '#D9923F';
    var PINSA_ORANGE = '#C4622D';

    // ══════════════════════════════════════════════════════════════════
    //  v3.0 (03-ago) · LA INVERSIÓN
    //  Antes: primero elegías el SITIO, después decías QUIÉN ERES → la torre
    //  no podía filtrar nada (no sabía quién eras al pintar) y las puertas
    //  salían sin ?loc= → los 6 usuarios con alcance '*' caían siempre en
    //  Riesco, cualquiera fuese el chip que tocaran.
    //  Ahora: primero QUIÉN ERES, después la torre enciende lo tuyo.
    // ══════════════════════════════════════════════════════════════════

    var FRENTES = [
      { code:'RSC',  nombre:'Riesco',         scope:'rsc',  marca:'PINSA', emp:'PINSA', tipo:'local'   },
      { code:'CDL',  nombre:'Candelaria',     scope:'cdl',  marca:'PINSA', emp:'PINSA', tipo:'local'   },
      { code:'NEXT', nombre:'Próximo local',  scope:'',     marca:'PINSA', emp:'PINSA', tipo:'local', soon:true },
      { code:'BKS',  nombre:'Backstage',      scope:'bks',  marca:'',      emp:'BKS',   tipo:'bks'     },
      { code:'EXO',  nombre:'Nuit',           scope:'exo',  marca:'',      emp:'EXO',   tipo:'local'   },
      { code:'BC',   nombre:'Bodega Central', scope:'bc',   marca:'',      emp:'PINSA', tipo:'bc'      },
      { code:'CC',   nombre:'Cocina Central', scope:'cc',   marca:'',      emp:'PINSA', tipo:'cc'      }
    ];

    // ── EL ALCANCE POR CARGO (03-ago) ────────────────────────────────
    // Alberto lo dictó POR CARGO («el JB debe ver EXO, PINSA, BKS y BC»), no
    // por persona → vive aquí, no en el foglio usuarios: **cero cambios de
    // esquema, cero listas que mantener**. Se asigna el cargo y los chips
    // siguen. 'casa' = sólo su local (el de la columna A del foglio).
    // Caso raro «esta persona además…» → lista en su celda, override.
    var ALCANCE = {
      OP: 'casa',
      JL: 'casa',
      JB: ['rsc','cdl','exo','bks','bc','cc'],
      CC: ['cc','rsc','cdl','exo','bks'],
      GO: '*',
      GC: '*',
      GG: '*'
    };

    // ── LAS PUERTAS · cada una declara sus cargos (data-roles) ────────
    // 🔴 La lección del 03-ago: el gating por cargo EXISTÍA pero sólo estaba
    // puesto en el grupo PINSA — las puertas de BKS no tenían ninguno, y por
    // eso el JB veía el MENU allí. Ahora TODAS lo llevan, sin excepción.
    var TODOS_OPERACION = 'OP,JL,JB,CC,GO,GC,GG';
    function puertasDe(f) {
      var loc = '?loc=' + f.scope, emp = '?emp=' + f.emp;
      if (f.tipo === 'local') return [
        { g:'Operación', href:'registro_movimientos.html'+loc, t:'Registro de movimientos',
          d:'Entregas, ingresos, ajustes e inventario. Por voz, foto o teclado.', roles:TODOS_OPERACION },
        { g:'Operación', soon:true, t:'Tu Faro',
          d:'Te avisa a tiempo: qué revisar, qué falta, quién llega. La luz que te guía en el turno.', roles:TODOS_OPERACION },
        { g:'Las recetas', href:'guia_recetas.html'+emp, t:'📖 Guía de Recetas',
          d:'Cada receta con su foto, pasos y perfect serve. Lo que se sirve, como se debe.', roles:TODOS_OPERACION },
        { g:'Las recetas', href:'taller_productos.html'+emp, t:'🏭 Taller de Productos',
          d:'Donde nacen las recetas: crear, costear, activar. Mejor en PC o tablet.', roles:'CC,GO,GC,GG' }
      ];
      if (f.tipo === 'bks') return [
        { g:'Operación', href:'registro_movimientos.html'+loc, t:'Registro de movimientos',
          d:'Entregas, ingresos, ajustes e inventario de la barra.', roles:TODOS_OPERACION },
        { g:'La sala', href:'mesero.html', t:'🛎 Mesero',
          d:'Tu plaza, tus pedidos, tu campanilla. Entras con el código del turno.', roles:'JL,GO,GC,GG' },
        { g:'La sala', href:'anfitriona.html', t:'👋 Anfitriona · Puerta',
          d:'El mapa de mesas y el gesto «Sentados». Entras con el código del turno.', roles:'JL,GO,GC,GG' },
        { g:'La sala', href:'guia_turno.html', t:'📖 Guía del turno',
          d:'Cómo funciona todo, con dibujos. Para el equipo nuevo (y no tanto).', roles:'JL,GO,GC,GG' },
        { g:'El menú', href:'https://ghutca.github.io/DIGITAL-MENU-ENGINE/menu_digital.html?local=BKS', t:'🍸 Menú del cliente',
          d:'Lo que ve la mesa al escanear el QR. Para revisar cómo se ve todo.', roles:'JL,GO,GC,GG' },
        { g:'El menú', href:'https://ghutca.github.io/DIGITAL-MENU-ENGINE/menu_admin.html?local=BKS', t:'👑 Panel del JL · Bar Manager',
          d:'Turno &amp; plazas, 86, push, precios. Entra con TU PIN del panel.', roles:'JL,GO,GC,GG' },
        { g:'Las recetas', href:'guia_recetas.html'+emp, t:'📖 Guía de Recetas',
          d:'Cada receta con su foto, pasos y perfect serve.', roles:'JL,CC,GO,GC,GG' },
        { g:'Las recetas', href:'taller_productos.html'+emp, t:'🏭 Taller de Productos',
          d:'Donde nacen las recetas (Chef · GO · GG). Mejor en PC o tablet.', roles:'CC,GO,GC,GG' }
      ];
      if (f.tipo === 'bc') return [
        { g:'Operación', href:'bcentral_operaciones.html', t:'📦 Operaciones de Bodega Central',
          d:'La bandeja: solicitudes de los locales, despachos y guías.', roles:'JB,GO,GC,GG' },
        { g:'Mirar', href:'dashboard_bodega_central.html', t:'📊 Tablero de Bodega Central',
          d:'Cómo va la bodega madre.', roles:'JB,GO,GC,GG' }
      ];
      if (f.tipo === 'cc') return [
        { g:'Mirar', href:'dashboard_cocina_central.html', t:'📊 Tablero de Cocina Central',
          d:'Cómo va la cocina madre.', roles:'CC,JB,GO,GC,GG' },
        { g:'Las recetas', href:'taller_productos.html'+emp, t:'🏭 Taller de Productos',
          d:'Donde nacen las recetas: crear, costear, activar. Mejor en PC o tablet.', roles:'CC,GO,GC,GG' },
        { g:'Las recetas', href:'guia_recetas.html'+emp, t:'📖 Guía de Recetas',
          d:'Cada receta con su foto, pasos y perfect serve.', roles:'CC,JB,GO,GC,GG' }
      ];
      return [];
    }

    // ── HELPERS ──────────────────────────────────────────────────────
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function gid(x){ return document.getElementById(x); }
    function ver(x, on){ var e=gid(x); if(e) e.classList.toggle('hidden', !on); }

    function alcanceDe(ses) {
      var rol  = String(ses.role || '').toUpperCase();
      var casa = String(ses.local || '').toLowerCase();
      // Manda el CARGO, no la casa. `local='*'` en el foglio no significa «ve
      // todo»: significa «no tiene una sola casa» — por eso 'casa' se resuelve
      // a toda la torre sólo cuando el cargo no acota nada. (Si mandara la casa,
      // el JB — que es '*' — vería también lo que no le concierne.)
      var a = ALCANCE[rol];
      if (a === undefined) a = 'casa';              // cargo desconocido → prudencia
      if (a === '*') return '*';
      if (a === 'casa') return (casa === '*') ? '*' : (casa ? [casa] : []);
      return a;
    }
    function rolPuede(rolesStr, rol) {
      return rolesStr.split(',').some(function(r){ return r.trim().toUpperCase() === rol; });
    }
    function puertasAbiertas(f, rol) {
      return puertasDe(f).filter(function(p){ return rolPuede(p.roles, rol); });
    }
    // 🔑 REGLA: NINGÚN CHIP SIN CUARTO. Un chip encendido que abre una sala
    // vacía es otro callejón sin salida — el bug B con otra cara. Un sitio es
    // tuyo sólo si detrás hay algo que puedas abrir.
    function puedeEntrar(f, alc, rol) {
      if (!f.scope || f.soon) return false;
      if (!(alc === '*' || alc.indexOf(f.scope) >= 0)) return false;
      return puertasAbiertas(f, rol).length > 0;
    }

    // ── PINTAR LOS CHIPS ─────────────────────────────────────────────
    function pintarChips(ses) {
      var alc = alcanceDe(ses);
      var rol = String(ses.role || '').toUpperCase();
      var grid = gid('frontsGrid');
      grid.innerHTML = '';
      var mios = 0, negros = 0, marcaPintada = '';

      FRENTES.forEach(function(f){
        // v3.1 (03-ago, Alberto: «¿por qué veo un chip negro?») · EL NEGRO
        // DICE UNA COSA SOLA: «existe y no es tuyo». Un local que todavía no
        // existe no es «no tuyo», es «no todavía» — pintarlo negro le mentía
        // justo a quien ve toda la torre. Ahora el placeholder se muestra
        // SÓLO a quien alcanza todo, con su nombre y su «Pronto»; para los
        // demás no ocupa sitio en la grilla.
        if (f.soon) {
          if (alc !== '*') return;
          var s = document.createElement('a');
          s.className = 'front soon';
          s.href = '#';
          s.innerHTML = '<span class="code">'+esc(f.code)+'</span>'+
                        '<span class="nm">'+esc(f.nombre)+'</span>'+
                        '<span class="fbadge">Pronto</span>';
          grid.appendChild(s);
          return;
        }
        var abierto = puedeEntrar(f, alc, rol);
        if (abierto) mios++;

        // la cinta de marca sólo se pinta si el chip que viene es tuyo:
        // un rótulo sobre chips negros contaría lo que no debe contarse
        if (abierto && f.marca && f.marca !== marcaPintada) {
          var lab = document.createElement('div');
          lab.className = 'marca';
          lab.textContent = f.marca;
          if (f.marca === 'PINSA') lab.style.color = PINSA_ORANGE;
          grid.appendChild(lab);
          marcaPintada = f.marca;
        }

        var a = document.createElement('a');
        a.href = '#';
        if (!abierto) {
          // EL CHIP NEGRO: sin nombre, sin código, sin acción (Alberto, 03-ago:
          // «silenzio o un'emoji, ma in pratica nulla»)
          a.className = 'front mudo';
          negros++;
          a.setAttribute('aria-hidden','true');
          a.innerHTML = '<span class="code">·</span><span class="nm">—</span>';
        } else {
          var esCasa = (String(ses.local||'').toLowerCase() === f.scope);
          a.className = 'front' + (esCasa ? ' self' : '');
          var codeColor = (f.marca === 'PINSA') ? PINSA_ORANGE : '';
          a.innerHTML = '<span class="code"'+(codeColor?' style="color:'+codeColor+'"':'')+'>'+esc(f.code)+'</span>'+
                        '<span class="nm">'+esc(f.nombre)+'</span>';
          a.addEventListener('click', function(ev){ ev.preventDefault(); entrar(f, ses); });
        }
        grid.appendChild(a);
      });

      // el subtítulo dice la verdad de ESTA pantalla: sólo se habla de «los
      // demás» cuando de verdad hay chips negros delante (v3.1)
      gid('chipsSub').textContent = mios > 1
        ? (negros ? 'Estos son tus sitios. Los demás no son tuyos.' : 'Estos son tus sitios.')
        : (mios === 1 ? 'Este es tu sitio.'
                      : 'Todavía no hay nada asignado a tu cargo. Habla con tu Jefe de Local.');

      ver('paso-login', false); ver('paso-salas', false); ver('paso-chips', true);
      gid('btnCambiar').classList.add('hidden');
      // un solo sitio → entrar directo, sin hacerle tocar un chip único
      if (mios === 1) {
        var uno = FRENTES.filter(function(f){ return puedeEntrar(f, alc, rol); })[0];
        if (uno) entrar(uno, ses, true);
      }
    }

    // ── PINTAR LAS PUERTAS DE UN FRENTE ──────────────────────────────
    function entrar(f, ses, esUnico) {
      var rol = String(ses.role || '').toUpperCase();
      var abiertas = puertasAbiertas(f, rol);

      var html = '', grupo = '';
      abiertas.forEach(function(p){
        if (p.g !== grupo) {
          if (grupo) html += '</div>';
          html += '<div class="sl">'+esc(p.g)+'</div><div class="doors">';
          grupo = p.g;
        }
        var cls = 'door' + (p.soon ? ' soon' : '');
        var abre = p.soon ? '<a class="'+cls+'">' : '<a class="'+cls+'" href="'+p.href+'">';
        html += abre +
          (p.soon ? '<span class="badge">Pronto</span>' : '') +
          '<div class="dt"><span class="dot"></span>'+p.t+'</div>' +
          '<div class="dd">'+p.d+'</div></a>';
      });
      if (grupo) html += '</div>';
      if (!abiertas.length) {
        html = '<div class="ask-sub" style="margin-top:26px">Aquí no hay nada para tu cargo todavía.</div>';
      }
      gid('salasBody').innerHTML = html;
      gid('hereName').textContent = f.nombre;

      // la identidad cromática que el registro busca (lo dice su comentario):
      // ATALAYA la deja en un canal accesible al entrar al frente
      try { localStorage.setItem('pinsita_ident', f.scope); } catch(e) {}

      ver('paso-login', false); ver('paso-chips', false); ver('paso-salas', true);
      // «Cambiar local» sólo tiene sentido si de verdad tienes más de uno
      gid('btnCambiar').classList.toggle('hidden', !!esUnico);
      gid('btnVolver').classList.toggle('hidden', !!esUnico);
    }

    // ── LA BARRA · nunca un callejón sin salida ──────────────────────
    function pintarBarra(ses) {
      gid('barNombre').textContent = ses.user || '—';
      gid('barCargo').textContent  = ses.role || '—';
      ver('barra', true);
    }

    gid('btnSalir').addEventListener('click', function(){
      if (window.PinsitaAuth) PinsitaAuth.logout();
      else location.reload();
    });
    gid('btnCambiar').addEventListener('click', function(){
      var s = sesion(); if (s) pintarChips(s);
    });
    gid('btnVolver').addEventListener('click', function(){
      var s = sesion(); if (s) pintarChips(s);
    });

    function sesion(){
      try { return (window.PinsitaAuth && PinsitaAuth.sesion) ? PinsitaAuth.sesion() : null; }
      catch(e){ return null; }
    }

    // ══════════════════════════════════════════════════════════════════
    //  ARRANQUE
    // ══════════════════════════════════════════════════════════════════
    // ?f=<scope> sigue sirviendo como atajo (marcadores viejos, PWA por local),
    // pero YA NO ES UNA LLAVE: sólo salta al frente si ese frente es tuyo.
    // La palabra compartida ('vigia-1897') murió el 03-ago — no escondía nada
    // que el filtro por persona no esconda mejor.
    var QF = '';
    try {
      QF = (new URLSearchParams(location.search).get('f') || '').trim().toLowerCase();
      if (QF) localStorage.setItem('aty_f', QF);
      else QF = (localStorage.getItem('aty_f') || '').trim().toLowerCase();
    } catch (e) {}

    // ⚠️ init() PRIMERO, SIEMPRE — aunque ya haya sesión.
    // leerSesion() compara contra CFG.local, y el CFG por defecto del módulo es
    // 'cdl': preguntando antes de init, la sesión de un usuario de Riesco se
    // leía como inválida y la torre le pedía el PIN otra vez, cada vez.
    // (Cazado en el navegador el 03-ago, no en el papel.)
    if (window.PinsitaAuth) PinsitaAuth.init({ local: 'todos', accent: ACCENT });

    var ses = sesion();
    if (ses) {
      arrancar(ses);
    } else {
      // primero QUIÉN ERES: la lista entera, el PIN, y recién después los chips
      ver('paso-login', true);
      // al entrar, recargamos: la torre se pinta limpia con la sesión ya escrita
      var esperando = setInterval(function(){
        if (sesion()) { clearInterval(esperando); location.reload(); }
      }, 400);
    }

    function arrancar(ses) {
      pintarBarra(ses);
      var alc = alcanceDe(ses);
      var rol = String(ses.role || '').toUpperCase();
      var fDirecto = QF ? FRENTES.filter(function(f){
        return f.scope === QF && puedeEntrar(f, alc, rol); })[0] : null;
      if (fDirecto) { pintarChips(ses); entrar(fDirecto, ses); }
      else pintarChips(ses);
    }

    // ── Offline: la torre debe poder abrirse bajo tierra (−6, sin señal) ──────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function () {
          if (navigator.onLine) {
            ['atalaya.html','shared/pinsita_auth.js','registro_movimientos.html',
             'atalaya_icon_180.png','manifest.webmanifest']
              .forEach(function (u) { fetch(u, { cache: 'reload' }).catch(function () {}); });
          }
        }).catch(function () {});
      });
    }
  })();
  </script>
</body>
</html>
