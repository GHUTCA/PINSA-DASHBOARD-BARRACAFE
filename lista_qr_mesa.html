<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>La Lista · QR para las mesas</title>
<!-- DEVICE-CLASS: 2 · lavoro da scrivania — si apre dal PC e si stampa (o si salva in PDF): 4 cartoline A6 per foglio A4. -->
<!-- 🎟 LA LISTA V35 · D-567 · il QR «Únete a La Lista» per i tavoli. Porta a sistema.pinsita.cl/unete.html?loc=<loc>.
     ?loc=bks (default BKS). Il QR si disegna con shared/qr_pinsita.js (la stessa libreria della sala). Nessuna rete oltre a quel file. -->
<style>
  @page{size:A4;margin:0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e9e6e1;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1a1410}
  .barra{max-width:210mm;margin:16px auto;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:0 8px}
  .barra button{border:none;border-radius:12px;padding:11px 18px;font-weight:700;background:#e0a94a;color:#241503;cursor:pointer}
  .barra span{font-size:12px;color:#5a514a}
  .foglio{width:210mm;height:297mm;margin:0 auto 20px;background:#fff;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .carta{border:1px dashed #d8d2ca;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10mm 8mm;background:#141018;color:#f7f0e2}
  .carta .marca{font-size:10pt;letter-spacing:.32em;text-transform:uppercase;color:#e0a94a;font-weight:700}
  .carta h1{font-size:24pt;letter-spacing:-.02em;margin:3mm 0 1mm}
  .carta p{font-size:11pt;color:#d8cfbf;max-width:80mm}
  .qr{background:#fff;border-radius:5mm;padding:3mm;width:52mm;height:52mm;margin:6mm 0 4mm}
  .qr svg{width:100%;height:100%}
  .carta .chico{font-size:8pt;color:#8f8779;margin-top:2mm}
  @media print{ body{background:#fff} .barra{display:none} .foglio{margin:0} .carta{border-color:transparent;-webkit-print-color-adjust:exact;print-color-adjust:exact} }
</style>
</head>
<body>
<div class="barra"><span id="info"></span><button onclick="window.print()">Imprimir / guardar PDF</button></div>
<div class="foglio" id="foglio"></div>
<div style="text-align:center;font-size:10px;color:#8f8779;margin-bottom:20px" class="barra"><span id="ver">lista_qr_mesa v0.1.0 · 24nov · ramo</span></div>
<script>
'use strict';
const QS = new URLSearchParams(location.search);
const LOC = String(QS.get('loc') || 'bks').trim().toLowerCase().replace(/[^a-z]/g, '').slice(0, 12) || 'bks';
const URL_UNETE = 'https://sistema.pinsita.cl/unete.html?loc=' + LOC;
document.getElementById('info').textContent = 'Lleva a ' + URL_UNETE;
function carta(svg) {
  return '<div class="carta"><div class="marca">Backstage</div><h1>Únete a La Lista</h1>' +
    '<p>Tus precios de La Lista desde hoy. Gratis, en un minuto.</p>' +
    '<div class="qr">' + svg + '</div>' +
    '<p>Escanea con la cámara de tu teléfono</p><div class="chico">Solo mayores de 18 años</div></div>';
}
const s = document.createElement('script'); s.src = 'shared/qr_pinsita.js';
s.onload = () => { const q = qrcode(0, 'M'); q.addData(URL_UNETE); q.make(); const svg = q.createSvgTag(6, 0); document.getElementById('foglio').innerHTML = carta(svg).repeat(4); };
s.onerror = () => { document.getElementById('foglio').innerHTML = '<p style="padding:20mm">No pude cargar el dibujante del QR. Recarga la página.</p>'; };
document.head.appendChild(s);
</script>
</body>
</html>
